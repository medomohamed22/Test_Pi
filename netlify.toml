

[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/api/pi/approve"
to = "/.netlify/functions/approve"
status = 200
force = true

[[redirects]]
from = "/api/pi/complete"
to = "/.netlify/functions/complete"
status = 200
force = true

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SUPABASE_URL"

[functions."subscription-expire"]
schedule = "0 * * * *"
