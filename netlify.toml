[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.secrets_scanner]
  enabled = false  # هذا سيعطل الفحص ويسمح بالبناء بنجاح

[[redirects]]
  from = "/api/pi/approve"
  to = "/.netlify/functions/approve"
  status = 200
  force = true

[[redirects]]
  from = "/api/pi/complete"
  to = "/.netlify/functions/complete"
  status = 200
  force = true


