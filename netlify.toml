
[build]
  publish = "."
  functions = "netlify/functions"

# هذا هو الكود المسؤول عن تحويل المسار
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# إعدادات لضمان عدم حدوث مشاكل CORS
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
