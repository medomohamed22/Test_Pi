<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Social</title>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}
body{margin:0;background:#f3edff;color:#1f1230}

header{
  background:#6a1b9a;color:#fff;
  padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
button{
  background:#6a1b9a;color:#fff;
  border:none;border-radius:8px;
  padding:8px 14px;cursor:pointer;
}
button.outline{background:#fff;color:#6a1b9a;border:1px solid #6a1b9a}

.container{max-width:600px;margin:15px auto;padding:10px}

.card{
  background:#fff;border-radius:12px;
  padding:12px;margin-bottom:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.hidden{display:none}

textarea{
  width:100%;border-radius:8px;
  border:1px solid #ccc;padding:8px;
  min-height:70px;
}

.post{
  border-top:1px solid #eee;
  padding-top:10px;margin-top:10px;
}
.post b{color:#6a1b9a}
.like{color:#6a1b9a;cursor:pointer;font-size:14px}
</style>
</head>

<body>

<header>
  <div><b>💜 Pi Social</b></div>
  <button id="loginBtn">دخول عبر Pi</button>
</header>

<div class="container hidden" id="app">

  <!-- PROFILE -->
  <div class="card">
    <b id="username">—</b>
  </div>

  <!-- CREATE POST -->
  <div class="card">
    <textarea id="postText" placeholder="بم تفكر؟"></textarea>
    <button style="margin-top:8px" onclick="createPost()">نشر</button>
  </div>

  <!-- FEED -->
  <div class="card">
    <b>المنشورات</b>
    <div id="feed"></div>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://xncapmzlwuisupkjlftb.supabase.co";
const SUPABASE_KEY = "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS";

/* ================= INIT ================= */
const SB = window.supabaseJs?.createClient
        ? window.supabaseJs
        : window.supabase;

const supabase = SB.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

/* ================= LOGIN ================= */
document.getElementById("loginBtn").onclick = async () => {
  if(!window.Pi){
    alert("افتح الموقع من Pi Browser");
    return;
  }

  Pi.init({ version:"2.0", sandbox:false });

  try{
    const auth = await Pi.authenticate(["username"], () => {});
    currentUser = auth.user;

    document.getElementById("loginBtn").style.display="none";
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("username").innerText = "@"+currentUser.username;

    // save profile
    await supabase.from("profiles").upsert({
      pi_uid: String(currentUser.uid),
      username: currentUser.username
    });

    loadPosts();
  }catch(e){
    alert("فشل تسجيل الدخول");
  }
};

/* ================= POSTS ================= */
async function createPost(){
  const text = document.getElementById("postText").value.trim();
  if(!text) return;

  await supabase.from("posts").insert({
    user_id: String(currentUser.uid),
    content: text,
    likes: 0
  });

  document.getElementById("postText").value="";
  loadPosts();
}

async function loadPosts(){
  const { data } = await supabase
    .from("posts")
    .select("id,content,likes,profiles(username)")
    .order("created_at",{ascending:false});

  const feed = document.getElementById("feed");
  feed.innerHTML="";

  data.forEach(p=>{
    feed.innerHTML += `
      <div class="post">
        <b>@${p.profiles.username}</b>
        <p>${p.content}</p>
        <span class="like" onclick="likePost('${p.id}',${p.likes})">
          ❤️ ${p.likes}
        </span>
      </div>
    `;
  });
}

async function likePost(id,likes){
  await supabase.from("posts")
    .update({likes:likes+1})
    .eq("id",id);
  loadPosts();
}
</script>

</body>
</html>
