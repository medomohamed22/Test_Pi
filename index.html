<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>سوق باي | Pi Market</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
:root {
  --primary: #6D28D9;
  --primary-light: #8B5CF6;
  --accent: #F59E0B;
  --bg-body: #F8F9FA;
  --surface: #FFFFFF;
  --text-main: #1F2937;
  --text-muted: #6B7280;
  --danger: #EF4444;
  --border: #E5E7EB;
  --nav-height: 65px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  padding-bottom: calc(var(--nav-height) + 20px); /* مسافة للبار السفلي */
  overflow-y: scroll;
}

/* --- Utilities --- */
.container { width: min(100%, 1200px); margin: 0 auto; padding: 16px; }
.hidden { display: none !important; }
.btn {
  border: none; cursor: pointer; border-radius: 12px;
  padding: 10px 16px; font-weight: 700; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.2s ease; font-size: 14px;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: white; }
.btn-gold { background: linear-gradient(135deg, var(--accent), #FBBF24); color: white; }
.btn-danger { background: #fee2e2; color: var(--danger); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

/* --- Top Header --- */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.brand { font-size: 18px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }

/* --- Bottom Navigation Bar --- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: white;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 1000;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text-muted); font-size: 11px; font-weight: 600;
  background: none; border: none; cursor: pointer; padding: 8px; width: 100%;
}
.nav-item i { font-size: 20px; transition: 0.2s; }
.nav-item.active { color: var(--primary); }
.nav-item.active i { transform: translateY(-2px); }
.badge {
  background: var(--danger); color: white; font-size: 10px;
  padding: 2px 6px; border-radius: 10px; position: absolute;
  top: 8px; margin-right: 15px; display: none;
}

/* --- Views Layout --- */
.view-section { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* --- Product Cards (Home) --- */
.products-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
}
.card {
  background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
  overflow: hidden; display: flex; flex-direction: column;
}
.card-img {
  width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee;
}
.card-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
.card-price {
  font-weight: 800; color: var(--primary); font-size: 16px; margin-bottom: 4px;
  display: flex; align-items: center; gap: 4px;
}
.card-price span { font-size: 12px; font-weight: 600; background: #ede9fe; padding: 2px 6px; border-radius: 6px; }
.card-title { font-size: 14px; margin: 0 0 6px; line-height: 1.4; color: var(--text-main); }
.card-meta { font-size: 11px; color: var(--text-muted); margin-top: auto; display: flex; justify-content: space-between; }

/* --- Inbox List (Chats) --- */
.inbox-item {
  background: white; padding: 16px; margin-bottom: 10px;
  border-radius: 12px; border: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.inbox-icon {
  width: 45px; height: 45px; background: #ede9fe; color: var(--primary);
  border-radius: 50%; display: grid; place-items: center; font-size: 18px;
}
.inbox-content { flex: 1; }
.inbox-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.inbox-last { color: var(--text-muted); font-size: 12px; }

/* --- Profile Section --- */
.profile-header {
  background: white; padding: 20px; border-radius: 16px;
  text-align: center; margin-bottom: 20px; border: 1px solid var(--border);
}
.profile-avatar {
  width: 70px; height: 70px; background: var(--primary); color: white;
  border-radius: 50%; font-size: 28px; display: grid; place-items: center;
  margin: 0 auto 12px;
}
.my-ads-title { font-weight: 800; margin: 20px 0 10px; font-size: 16px; }

/* --- Modals & Sheets --- */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 2000; display: none; align-items: flex-end;
}
.sheet {
  background: white; width: 100%; border-radius: 20px 20px 0 0;
  padding: 20px; max-height: 90vh; overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from {transform: translateY(100%)} to {transform: translateY(0)} }

/* --- Inputs --- */
input, textarea {
  width: 100%; padding: 12px; margin-bottom: 12px;
  border: 1px solid var(--border); border-radius: 10px;
  font-family: inherit; font-size: 14px;
}
textarea { resize: none; height: 100px; }

/* Chat Bubbles */
.chat-area { height: 60vh; overflow-y: auto; background: #f3f4f6; padding: 10px; border-radius: 12px; margin-bottom: 10px; }
.bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; }
.me { background: var(--primary); color: white; align-self: flex-end; margin-right: auto; }
.other { background: white; border: 1px solid var(--border); margin-left: auto; }

</style>
</head>
<body>

<header class="header">
  <div class="brand"><i class="fa-solid fa-store"></i> سوق باي</div>
  <button id="loginBtn" class="btn btn-gold" onclick="alert('جاري تهيئة Pi...')">
    <i class="fa-solid fa-fingerprint"></i> دخول
  </button>
</header>

<div class="container">

  <div id="view-home" class="view-section">
    <h3 style="margin-top:0">أحدث المنتجات</h3>
    <div id="products-list" class="products-grid">
      </div>
    <div id="loading" style="text-align:center;padding:20px;color:gray">جاري التحميل...</div>
  </div>

  <div id="view-chats" class="view-section hidden">
    <h3 style="margin-top:0">الرسائل والمحادثات</h3>
    <div id="inbox-list">
      <div style="text-align:center;padding:40px;color:gray">يجب تسجيل الدخول لعرض الرسائل</div>
    </div>
  </div>

  <div id="view-profile" class="view-section hidden">
    
    <div id="profile-guest" style="text-align:center;padding:40px;">
      <i class="fa-solid fa-lock" style="font-size:40px;color:gray;margin-bottom:10px"></i>
      <p>يرجى تسجيل الدخول لإدارة إعلاناتك</p>
    </div>

    <div id="profile-user" class="hidden">
      <div class="profile-header">
        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
        <h3 id="p-username" style="margin:0">اسم المستخدم</h3>
        <small id="p-uid" style="color:gray">ID: ...</small>
        
        <div style="margin-top:16px;">
          <button class="btn btn-primary" style="width:100%" onclick="openAddModal()">
            <i class="fa-solid fa-plus-circle"></i> إضافة إعلان جديد
          </button>
        </div>
      </div>

      <div class="my-ads-title">إعلاناتي المنشورة</div>
      <div id="my-ads-list" class="products-grid">
        </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="nav('home')">
    <i class="fa-solid fa-house"></i>
    <span>الرئيسية</span>
  </button>

  <button class="nav-item" onclick="nav('chats')" style="position:relative">
    <i class="fa-solid fa-comments"></i>
    <span id="chatBadge" class="badge">0</span>
    <span>المحادثات</span>
  </button>

  <button class="nav-item" onclick="nav('profile')">
    <i class="fa-solid fa-user"></i>
    <span>حسابي</span>
  </button>
</nav>


<div id="addModal" class="modal" onclick="if(event.target==this) closeAddModal()">
  <div class="sheet">
    <h3>بيع منتج جديد</h3>
    <input id="addName" placeholder="اسم المنتج (مثال: موبايل سامسونج)" />
    <div style="display:flex;gap:10px">
      <input id="addPrice" type="number" placeholder="السعر (Pi)" />
      <input id="addPhone" type="tel" placeholder="رقم واتساب (اختياري)" />
    </div>
    <textarea id="addDesc" placeholder="وصف المنتج وحالته..."></textarea>
    <label style="display:block;margin-bottom:8px;font-size:12px">صورة المنتج</label>
    <input id="addImg" type="file" accept="image/*" />
    <button id="publishBtn" class="btn btn-primary" style="width:100%" onclick="submitProduct()">
      نشر الإعلان الآن
    </button>
  </div>
</div>

<div id="chatModal" class="modal" style="z-index:2100" onclick="if(event.target==this) closeChat()">
  <div class="sheet" style="height:90vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <b id="chatTitle">محادثة</b>
      <button onclick="closeChat()" style="background:none;border:none"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div id="msgContainer" class="chat-area" style="flex:1;display:flex;flex-direction:column;"></div>
    
    <div style="display:flex;gap:8px;margin-top:auto">
      <input id="msgInput" placeholder="اكتب رسالة..." style="margin:0" />
      <button class="btn btn-primary" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
// --- CONFIG ---
const SUPABASE_URL = "https://xncapmzlwuisupkjlftb.supabase.co";
const SUPABASE_KEY = "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS"; // مفتاح عام آمن

let sb, user = null;
let activeChat = null; // { pid, otherId, title }

// --- INIT ---
document.addEventListener("DOMContentLoaded", async () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  initPi();
  loadAllProducts();
});

// --- NAVIGATION ---
function nav(viewName) {
  // Hide all views
  document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  // Show selected
  document.getElementById(`view-${viewName}`).classList.remove('hidden');
  
  // Update Nav Icon
  const iconIndex = viewName === 'home' ? 0 : viewName === 'chats' ? 1 : 2;
  document.querySelectorAll('.nav-item')[iconIndex].classList.add('active');

  // Load specific data
  if(viewName === 'profile' && user) loadMyAds();
  if(viewName === 'chats' && user) loadInbox();
}

// --- PI LOGIN ---
function initPi(){
  const btn = document.getElementById("loginBtn");
  
  if(!window.Pi){
    // Demo Mode for browser testing
    btn.innerHTML = `<i class="fa-solid fa-vial"></i> تجربة (Demo)`;
    btn.onclick = () => handleLogin("test_user_" + Math.floor(Math.random()*1000), "زائر_تجريبي");
    return;
  }

  Pi.init({ version: "2.0", sandbox: false });
  btn.onclick = async () => {
    try {
      const auth = await Pi.authenticate(["username"], () => {});
      handleLogin(auth.user.uid, auth.user.username);
    } catch(e) { alert("فشل الدخول: " + e) }
  };
}

async function handleLogin(uid, username) {
  user = { uid, username };
  await sb.from("users").upsert({ pi_id: uid, username });
  
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("profile-guest").classList.add("hidden");
  document.getElementById("profile-user").classList.remove("hidden");
  
  document.getElementById("p-username").innerText = username;
  document.getElementById("p-uid").innerText = "ID: " + uid.slice(0,8) + "...";
  
  // Realtime listener for messages
  sb.channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      if(payload.new.receiver_pi_id === user.uid) {
        document.getElementById("chatBadge").style.display = "block";
        document.getElementById("chatBadge").innerText = "!";
      }
    }).subscribe();
}

// --- DATA: ALL PRODUCTS (Home) ---
async function loadAllProducts() {
  const { data, error } = await sb.from("products").select("*").order("created_at", {ascending:false});
  document.getElementById("loading").style.display = "none";
  const list = document.getElementById("products-list");
  list.innerHTML = "";

  if(!data || !data.length) {
    list.innerHTML = "<div style='grid-column:1/-1;text-align:center'>لا توجد إعلانات</div>";
    return;
  }

  data.forEach(p => {
    const isOwner = user && p.seller_pi_id === user.uid;
    const img = p.image_url || "https://placehold.co/400?text=No+Image";
    
    // Action Button Logic
    let actionBtn = "";
    if(isOwner) {
       actionBtn = `<button class="btn btn-ghost" style="width:100%;font-size:12px" disabled>إعلانك</button>`;
    } else {
       // WhatsApp logic if phone exists
       if(p.phone) {
         let ph = p.phone.replace(/\D/g,'');
         if(ph.startsWith('0')) ph = '2' + ph; // Assume Egypt for simplicity
         actionBtn = `
           <div style="display:flex;gap:5px">
             <a href="https://wa.me/${ph}" target="_blank" class="btn btn-success" style="flex:1;background:#25D366;color:white;padding:6px">
               <i class="fa-brands fa-whatsapp"></i>
             </a>
             <button onclick="openChatRoom(${p.id}, '${p.seller_pi_id}', '${p.name}')" class="btn btn-primary" style="flex:1;padding:6px">
               <i class="fa-solid fa-comment"></i>
             </button>
           </div>`;
       } else {
         actionBtn = `
           <button onclick="openChatRoom(${p.id}, '${p.seller_pi_id}', '${p.name}')" class="btn btn-primary" style="width:100%">
             <i class="fa-solid fa-comment"></i> محادثة
           </button>`;
       }
    }

    const html = `
      <div class="card">
        <img src="${img}" class="card-img" loading="lazy">
        <div class="card-body">
          <div class="card-price">${p.price} <span>Pi</span></div>
          <h4 class="card-title">${p.name}</h4>
          <div class="card-meta">
            <span>${p.seller_username || 'بائع'}</span>
          </div>
          <div style="margin-top:10px">${actionBtn}</div>
        </div>
      </div>
    `;
    list.innerHTML += html;
  });
}

// --- DATA: MY ADS (Profile) ---
async function loadMyAds() {
  if(!user) return;
  const list = document.getElementById("my-ads-list");
  list.innerHTML = "<div style='grid-column:1/-1;text-align:center'>جاري التحميل...</div>";

  const { data } = await sb.from("products").select("*").eq("seller_pi_id", user.uid).order("created_at", {ascending:false});
  list.innerHTML = "";

  if(!data || !data.length) {
    list.innerHTML = "<div style='grid-column:1/-1;text-align:center;color:gray'>لم تقم بنشر أي إعلان بعد</div>";
    return;
  }

  data.forEach(p => {
    const img = p.image_url || "https://placehold.co/400?text=Image";
    const html = `
      <div class="card">
        <div style="position:relative">
          <img src="${img}" class="card-img">
          <button onclick="deleteProduct(${p.id})" class="btn" style="position:absolute;top:5px;right:5px;background:white;color:red;padding:4px 8px;border-radius:8px">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
        <div class="card-body">
          <div class="card-price">${p.price} <span>Pi</span></div>
          <div class="card-title">${p.name}</div>
          <button class="btn btn-ghost" style="width:100%;font-size:12px;margin-top:5px">تعديل (قريباً)</button>
        </div>
      </div>
    `;
    list.innerHTML += html;
  });
}

// --- OPERATIONS: ADD & DELETE ---
function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

async function submitProduct() {
  const name = document.getElementById("addName").value;
  const price = document.getElementById("addPrice").value;
  const phone = document.getElementById("addPhone").value;
  const desc = document.getElementById("addDesc").value;
  const file = document.getElementById("addImg").files[0];
  const btn = document.getElementById("publishBtn");

  if(!name || !price) return alert("الاسم والسعر مطلوبين");
  
  btn.innerText = "جاري النشر..."; btn.disabled = true;

  let image_url = null;
  if(file) {
    const path = `${user.uid}/${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from("images").upload(path, file);
    if(!error) {
      const { data } = sb.storage.from("images").getPublicUrl(path);
      image_url = data.publicUrl;
    }
  }

  const { error } = await sb.from("products").insert({
    name, price, phone, description: desc, image_url,
    seller_pi_id: user.uid, seller_username: user.username
  });

  if(!error) {
    alert("تم النشر بنجاح!");
    closeAddModal();
    loadAllProducts(); // Refresh Home
    loadMyAds();       // Refresh Profile
    // Clear inputs
    document.getElementById("addName").value = "";
    document.getElementById("addPrice").value = "";
  } else {
    alert("خطأ: " + error.message);
  }
  btn.innerText = "نشر الإعلان الآن"; btn.disabled = false;
}

async function deleteProduct(id) {
  if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟")) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if(!error) {
    loadMyAds();
    loadAllProducts();
  } else {
    alert("خطأ في الحذف");
  }
}

// --- CHAT SYSTEM (Groups & Logic) ---
async function loadInbox() {
  const list = document.getElementById("inbox-list");
  list.innerHTML = "<div style='text-align:center;padding:20px'>جاري تحميل المحادثات...</div>";
  
  // Get messages involving me
  const { data } = await sb.from("messages")
    .select("*, products(name)")
    .or(`sender_pi_id.eq.${user.uid},receiver_pi_id.eq.${user.uid}`)
    .order("created_at", {ascending: false});

  list.innerHTML = "";
  if(!data || !data.length) {
    list.innerHTML = "<div style='text-align:center;padding:20px;color:gray'>لا توجد رسائل</div>";
    return;
  }

  // Group threads by ProductID + OtherPersonID
  const threads = new Map();
  data.forEach(m => {
    const otherId = m.sender_pi_id === user.uid ? m.receiver_pi_id : m.sender_pi_id;
    const key = `${m.product_id}_${otherId}`;
    
    if(!threads.has(key)) {
      threads.set(key, {
        pid: m.product_id,
        otherId: otherId,
        pName: m.products ? m.products.name : "منتج #"+m.product_id,
        lastMsg: m.content,
        time: new Date(m.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})
      });
    }
  });

  threads.forEach(t => {
    const item = `
      <div class="inbox-item" onclick="openChatRoom(${t.pid}, '${t.otherId}', '${t.pName}')">
        <div class="inbox-icon"><i class="fa-solid fa-comment"></i></div>
        <div class="inbox-content">
          <div class="inbox-title">${t.pName}</div>
          <div class="inbox-last">${t.lastMsg.substring(0,30)}...</div>
        </div>
        <div style="font-size:10px;color:gray">${t.time}</div>
      </div>
    `;
    list.innerHTML += item;
  });
}

// Open Specific Chat
function openChatRoom(pid, otherId, title) {
  if(!user) return alert("سجل دخول أولاً");
  
  activeChat = { pid, otherId };
  document.getElementById("chatTitle").innerText = title;
  document.getElementById("chatModal").style.display = "flex";
  
  loadMessages();
  
  // Subscribe to THIS chat room
  const channelName = `chat:${pid}:${user.uid}:${otherId}`;
  sb.channel(channelName).on('postgres_changes', 
    { event: 'INSERT', schema: 'public', table: 'messages', filter: `product_id=eq.${pid}` }, 
    payload => {
      const m = payload.new;
      // Check if message belongs to this pair
      const isRel = (m.sender_pi_id == otherId && m.receiver_pi_id == user.uid) || 
                    (m.sender_pi_id == user.uid && m.receiver_pi_id == otherId);
      if(isRel) renderMsg(m);
    }
  ).subscribe();
}

async function loadMessages() {
  const container = document.getElementById("msgContainer");
  container.innerHTML = "<div style='text-align:center'>تحميل...</div>";
  
  const { data } = await sb.from("messages")
    .select("*")
    .eq("product_id", activeChat.pid)
    .order("created_at", {ascending: true});
    
  container.innerHTML = "";
  if(data) {
    data.forEach(m => {
       // Filter strictly for this pair
       const isMe = m.sender_pi_id === user.uid;
       const isOther = m.sender_pi_id === activeChat.otherId;
       if(isMe || isOther) renderMsg(m);
    });
  }
}

function renderMsg(m) {
  const container = document.getElementById("msgContainer");
  const isMe = m.sender_pi_id === user.uid;
  const div = document.createElement("div");
  div.className = `bubble ${isMe ? 'me' : 'other'}`;
  div.innerText = m.content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMsg() {
  const inp = document.getElementById("msgInput");
  const txt = inp.value.trim();
  if(!txt) return;
  
  const { error } = await sb.from("messages").insert({
    product_id: activeChat.pid,
    sender_pi_id: user.uid,
    receiver_pi_id: activeChat.otherId,
    content: txt
  });
  
  if(!error) inp.value = "";
}

function closeChat() {
  document.getElementById("chatModal").style.display = "none";
  activeChat = null;
  sb.removeAllChannels(); // Cleanup listeners
}

</script>
</body>
</html>
