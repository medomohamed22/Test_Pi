<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Network Donation Portal</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Support Our Project</h1>
            <div id="user-info">
                <p id="status-text">Checking connection...</p>
                <button id="login-btn" style="display:none;">Login with Pi</button>
            </div>
        </header>

        <main>
            <section class="donation-card">
                <h2>Donate Pi</h2>
                <p>Your contributions help us keep the servers running.</p>
                <div class="amount-selector">
                    <button class="amount-btn" onclick="setAmount(1)">1 π</button>
                    <button class="amount-btn" onclick="setAmount(5)">5 π</button>
                    <button class="amount-btn" onclick="setAmount(10)">10 π</button>
                </div>
                <div class="input-group">
                    <input type="number" id="custom-amount" placeholder="Custom Amount" step="0.01">
                    <span>π</span>
                </div>
                <button id="donate-btn" disabled>Donate Now</button>
            </section>

            <section class="leaderboard">
                <h3>Recent Donors</h3>
                <ul id="donors-list">
                    <li>Loading recent donations...</li>
                </ul>
            </section>
        </main>

        <div id="toast" class="hidden"></div>
    </div>
</body>
</html>
