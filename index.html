<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Purple Gemini Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --p:#7B2FF7; --p2:#9B6DFF;
  --bg:#F6F3FF; --card:#FFFFFF;
  --stroke:#E6E0FF;
  --text:#1F1F2E; --mut:#6B6B85;
  --userBg:#EDE7FF; --aiBg:#FFFFFF;
  --r:18px;
  --shadow: 0 10px 28px rgba(123,47,247,.10);
}

*{box-sizing:border-box;font-family:Tajawal,system-ui}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

header{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
header .title{font-weight:900;font-size:16px}
header .badge{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap
}

.wrap{width:min(980px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column}

.toolbar{
  width:min(980px,100%);margin:10px auto 0;padding:0 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between
}
.panel{
  background:#fff;border:1px solid var(--stroke);box-shadow:var(--shadow);
  border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center
}
.btn{
  border:none;border-radius:14px;padding:10px 12px;font-weight:900;cursor:pointer
}
.btn.primary{background:var(--p);color:#fff}
.btn.ghost{background:#f3f0ff;border:1px solid var(--stroke);color:var(--text)}
.btn.danger{background:#fff0f1;border:1px solid #ffd2d6;color:#b4232a}
.btn:disabled{opacity:.6;cursor:not-allowed}

.chat{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}

.bubble{
  max-width:86%;
  border-radius:var(--r);
  padding:12px 14px;
  line-height:1.7;
  box-shadow:var(--shadow);
  border:1px solid var(--stroke);
  position:relative;
  white-space:pre-wrap;
  word-break:break-word;
}
.bubble.user{align-self:flex-start;background:var(--userBg)}
.bubble.ai{align-self:flex-end;background:var(--aiBg)}

.meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:8px;align-items:center}
.bubble.user .meta{justify-content:flex-start}
.bubble.ai .meta{justify-content:flex-end}

footer{background:var(--card);border-top:1px solid var(--stroke);padding:12px}
.composer{width:min(980px,100%);margin:0 auto;display:flex;gap:10px;align-items:flex-end;padding:0 2px}
textarea{
  flex:1;resize:none;min-height:46px;max-height:160px;
  padding:12px;border-radius:16px;border:1px solid var(--stroke);
  outline:none;font-size:15px;background:#fff
}
.smallHint{width:min(980px,100%);margin:8px auto 0;color:var(--mut);font-size:12px;padding:0 12px}
.kbd{
  background:#f3f0ff;border:1px solid var(--stroke);border-bottom-width:2px;
  padding:2px 6px;border-radius:8px;font-size:11px
}

/* Attachments (TXT only) */
.attachRow{
  width:min(980px,100%);
  margin:0 auto;
  padding:0 12px 10px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between
}
.fileChip{
  display:inline-flex;gap:8px;align-items:center;
  background:#fff;border:1px solid var(--stroke);border-radius:999px;padding:8px 10px;
  box-shadow:var(--shadow);font-size:12px;color:var(--mut)
}
.fileChip b{color:var(--text)}

/* Modal */
.backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;
  padding:18px;
  z-index:50;
}
.modal{
  width:min(560px, 100%);
  background:#fff;
  border:1px solid var(--stroke);
  border-radius:18px;
  box-shadow: 0 20px 70px rgba(0,0,0,.25);
  overflow:hidden;
}
.modalHead{
  padding:14px 16px;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.modalHead b{font-size:14px}
.modalBody{
  padding:14px 16px;
  display:flex;flex-direction:column;gap:12px;
}
.field{
  display:flex;flex-direction:column;gap:6px;
}
.field label{font-size:12px;color:var(--mut)}
.field select, .field textarea, .field input[type="range"]{
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:12px;
  background:#fff;
  outline:none;
}
.modalFoot{
  padding:12px 16px;
  display:flex;gap:10px;justify-content:flex-end;
  border-top:1px solid var(--stroke);
  background:#faf9ff;
}
.rowInline{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.pill{
  background:#f3f0ff;border:1px solid var(--stroke);
  padding:6px 10px;border-radius:999px;font-size:12px;color:var(--text)
}
</style>
</head>

<body>
<header>
  <div class="title">💜 Purple Gemini Chat</div>
  <div class="badge" id="status">● Ready</div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="panel">
    <button class="btn ghost" id="btnCustomize">تخصيص AI</button>
    <span class="pill" id="summaryPill">شخصية: مساعد عام • طول: متوسط • إبداع: 0.35</span>
  </div>

  <div class="panel">
    <button class="btn ghost" id="btnLoad">استرجاع</button>
    <button class="btn danger" id="btnClear">مسح</button>
    <button class="btn ghost" id="btnExport">تصدير</button>
  </div>
</div>

<!-- Attachments (TXT) -->
<div class="attachRow">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label class="btn ghost" style="display:inline-flex;align-items:center;gap:8px">
      📎 رفع ملف (TXT/MD/JSON)
      <input id="file" type="file" accept=".txt,.md,.json,text/plain,application/json" style="display:none">
    </label>
    <div id="fileChipWrap" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

  <div style="font-size:12px;color:var(--mut)">
    أوامر: <span class="kbd">/code</span> <span class="kbd">/translate</span> <span class="kbd">/explain</span> <span class="kbd">/short</span> <span class="kbd">/long</span>
  </div>
</div>

<div class="wrap">
  <div class="chat" id="chat"></div>

  <footer>
    <div class="composer">
      <textarea id="msg" placeholder="اكتب رسالتك... (Enter إرسال / Shift+Enter سطر جديد)" rows="1"></textarea>
      <!-- ✅ onclick احتياطي + addEventListener كمان -->
      <button id="sendBtn" class="btn primary" type="button" onclick="window.__sendSafe && window.__sendSafe()">إرسال</button>
      <button id="regenBtn" class="btn ghost" type="button" disabled>إعادة توليد</button>
      <button id="stopBtn" class="btn ghost" type="button" disabled>إيقاف</button>
    </div>
    <div class="smallHint">
      Enter لإرسال — Shift+Enter سطر جديد •
      لو كتبت <span class="kbd">/code</span> قبل السؤال الرد يبقى كود
    </div>
  </footer>
</div>

<!-- Modal: Customize AI -->
<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <b>تخصيص AI</b>
      <button class="btn ghost" id="btnCloseModal" style="padding:8px 10px;border-radius:12px">✕</button>
    </div>

    <div class="modalBody">
      <div class="field">
        <label>الشخصية</label>
        <select id="persona">
          <option value="helper">مساعد عام</option>
          <option value="pi_dev">مساعد مطور Pi Network</option>
          <option value="teacher">مدرس</option>
          <option value="coder">مبرمج</option>
          <option value="marketer">مسوّق</option>
        </select>
      </div>

      <div class="field">
        <label>طول الرد</label>
        <select id="lenLevel">
          <option value="short">مختصر</option>
          <option value="medium" selected>متوسط</option>
          <option value="long">تفصيلي</option>
        </select>
      </div>

      <div class="field">
        <label>الإبداع (Temperature) <span id="tempVal" class="pill">0.35</span></label>
        <input id="temp" type="range" min="0" max="100" value="35" />
      </div>

      <div class="field">
        <label>تعليمات إضافية (اختياري)</label>
        <textarea id="extraPrompt" rows="3" placeholder="مثال: رد باللهجة المصرية، وخلي الرد منظم بعناوين..."></textarea>
      </div>

      <div class="rowInline" style="color:var(--mut);font-size:12px">
        <span>✅ التخصيص بيتطبق على الرسائل الجديدة فقط.</span>
      </div>
    </div>

    <div class="modalFoot">
      <button class="btn ghost" id="btnReset">إعادة ضبط</button>
      <button class="btn primary" id="btnApply">تم</button>
    </div>
  </div>
</div>

<script>
/* ========= Safety wrapper: لو أي Error حصل، الشات يفضل شغال ========= */
(function(){
  "use strict";

  const chat = document.getElementById('chat');
  const msgEl = document.getElementById('msg');
  const sendBtn = document.getElementById('sendBtn');
  const regenBtn = document.getElementById('regenBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');

  const btnCustomize = document.getElementById('btnCustomize');
  const summaryPill = document.getElementById('summaryPill');

  const btnLoad = document.getElementById('btnLoad');
  const btnClear = document.getElementById('btnClear');
  const btnExport = document.getElementById('btnExport');

  const fileEl = document.getElementById('file');
  const fileChipWrap = document.getElementById('fileChipWrap');

  // Modal elements
  const backdrop = document.getElementById('backdrop');
  const btnCloseModal = document.getElementById('btnCloseModal');
  const btnApply = document.getElementById('btnApply');
  const btnReset = document.getElementById('btnReset');

  const personaEl = document.getElementById('persona');
  const lenLevelEl = document.getElementById('lenLevel');
  const tempEl = document.getElementById('temp');
  const tempValEl = document.getElementById('tempVal');
  const extraPromptEl = document.getElementById('extraPrompt');

  let convo = [];        // {role:'user'|'model', text:'...'}
  let attachments = [];  // {name, type, text}
  let aborter = null;

  const LS_KEY = "purple_gemini_chat_v2";

  /* ========= Helpers ========= */
  function setStatus(text, busy=false){
    statusEl.textContent = "● " + text;
    statusEl.style.opacity = busy ? 0.9 : 1;
  }

  function addBubble(role, text){
    const b = document.createElement('div');
    b.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');

    const content = document.createElement('div');
    content.className = 'content';
    content.textContent = text || '';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (role === 'user') ? '👤 أنت' : '🤖 AI';

    b.appendChild(content);
    b.appendChild(meta);
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
    return { b, content, meta };
  }

  function autosize(){
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 160) + 'px';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function renderAttachments(){
    fileChipWrap.innerHTML = "";
    for(let i=0;i<attachments.length;i++){
      const f = attachments[i];
      const chip = document.createElement('div');
      chip.className = 'fileChip';
      chip.innerHTML = `📄 <b>${escapeHtml(f.name)}</b>
        <button class="btn ghost" style="padding:6px 10px;border-radius:999px" data-i="${i}">حذف</button>`;
      chip.querySelector('button').addEventListener('click', (e)=>{
        const idx = Number(e.target.getAttribute('data-i'));
        attachments.splice(idx, 1);
        renderAttachments();
        saveChat();
      });
      fileChipWrap.appendChild(chip);
    }
  }

  /* ========= Feature 1+7 (Persona/Length/Temp) in Modal ========= */
  const personaNames = {
    helper: "مساعد عام",
    pi_dev: "مساعد Pi",
    teacher: "مدرس",
    coder: "مبرمج",
    marketer: "مسوّق"
  };

  function personaPrompt(persona){
    switch(persona){
      case "pi_dev":
        return "أنت مساعد خبير في تطوير تطبيقات Pi Network (Pi SDK, Pi API, مدفوعات, Pi Browser) وتفهم Supabase وVercel وتقدم حلول عملية بكود واضح.";
      case "teacher":
        return "أنت مدرس صبور يشرح خطوة بخطوة وبأسلوب بسيط مع أمثلة.";
      case "coder":
        return "أنت مبرمج محترف. أعطِ حلول عملية مع كود منظم وملاحظات قصيرة.";
      case "marketer":
        return "أنت مسوّق ذكي. اعطِ أفكار تسويق ونصوص إعلانية وخطط نمو بشكل عملي.";
      default:
        return "أنت مساعد عام مفيد ودقيق.";
    }
  }

  function lengthConfig(level){
    if(level === "short") return { maxOutputTokens: 220, style: "اجعل الرد مختصر جدًا ومباشر." };
    if(level === "long")  return { maxOutputTokens: 900, style: "اجعل الرد تفصيلي ومنظم بعناوين." };
    return { maxOutputTokens: 450, style: "اجعل الرد متوسط الطول ومنظم." };
  }

  function updateSummary(){
    const name = personaNames[personaEl.value] || "مساعد";
    const lenName = (lenLevelEl.value==="short"?"مختصر":lenLevelEl.value==="long"?"تفصيلي":"متوسط");
    const t = (Number(tempEl.value)/100).toFixed(2);
    summaryPill.textContent = `شخصية: ${name} • طول: ${lenName} • إبداع: ${t}`;
  }

  tempEl.addEventListener('input', ()=>{
    tempValEl.textContent = (Number(tempEl.value)/100).toFixed(2);
  });

  function openModal(){
    backdrop.style.display = "flex";
  }
  function closeModal(){
    backdrop.style.display = "none";
  }

  btnCustomize.addEventListener('click', openModal);
  btnCloseModal.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e)=>{
    if(e.target === backdrop) closeModal();
  });

  btnReset.addEventListener('click', ()=>{
    personaEl.value = "helper";
    lenLevelEl.value = "medium";
    tempEl.value = "35";
    tempValEl.textContent = "0.35";
    extraPromptEl.value = "";
  });

  btnApply.addEventListener('click', ()=>{
    updateSummary();
    saveChat();
    closeModal();
  });

  /* ========= Feature 2: LocalStorage ========= */
  function saveChat(){
    const payload = {
      convo, attachments,
      settings: {
        persona: personaEl.value,
        lenLevel: lenLevelEl.value,
        temp: Number(tempEl.value),
        extraPrompt: extraPromptEl.value || ""
      }
    };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
  }

  function loadChat(){
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    convo = Array.isArray(data.convo) ? data.convo : [];
    attachments = Array.isArray(data.attachments) ? data.attachments : [];

    const s = data.settings || {};
    if(s.persona) personaEl.value = s.persona;
    if(s.lenLevel) lenLevelEl.value = s.lenLevel;
    if(typeof s.temp === "number") tempEl.value = String(s.temp);
    extraPromptEl.value = s.extraPrompt || "";
    tempValEl.textContent = (Number(tempEl.value)/100).toFixed(2);

    chat.innerHTML = "";
    renderAttachments();
    for(const m of convo){
      addBubble(m.role === "user" ? "user" : "ai", m.text);
    }

    updateSummary();
    regenBtn.disabled = !hasLastUserMessage();
    return true;
  }

  btnLoad.addEventListener('click', ()=>{
    const ok = loadChat();
    if(!ok) alert("مفيش محادثة محفوظة لسه.");
  });

  btnClear.addEventListener('click', ()=>{
    if(!confirm("متأكد تمسح المحادثة؟")) return;
    convo = [];
    attachments = [];
    chat.innerHTML = "";
    renderAttachments();
    localStorage.removeItem(LS_KEY);
    regenBtn.disabled = true;
    addBubble('ai','اتمسحت المحادثة ✅');
    saveChat();
  });

  btnExport.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({convo, attachments}, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "chat_export.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ========= Feature 6: Upload TXT only ========= */
  fileEl.addEventListener('change', async ()=>{
    const file = fileEl.files?.[0];
    if(!file) return;

    try{
      setStatus("Reading file...", true);
      const text = (await file.text()).trim().slice(0, 18000);
      attachments.push({ name:file.name, type:"text", text });
      renderAttachments();
      saveChat();
      setStatus("Ready", false);
    }catch(e){
      console.error(e);
      setStatus("File error", false);
      alert("حصل خطأ في قراءة الملف.");
    }finally{
      fileEl.value = "";
    }
  });

  /* ========= Feature 5: Slash Commands ========= */
  function applySlashCommand(input){
    const t = input.trim();
    if(!t.startsWith("/")) return { cmd:null, userText: input, cmdPrompt:null };

    const firstSpace = t.indexOf(" ");
    const cmd = (firstSpace === -1 ? t : t.slice(0, firstSpace)).toLowerCase();
    const rest = (firstSpace === -1 ? "" : t.slice(firstSpace+1));

    const map = {
      "/code": "أجب بكود منسق قدر الإمكان، ولو محتاج شرح خلي الشرح قصير قبل الكود.",
      "/translate": "ترجم النص التالي ترجمة دقيقة مع الحفاظ على المعنى:",
      "/explain": "اشرح الفكرة ببساطة وبأمثلة صغيرة:",
      "/short": "اجعل الرد مختصر جدًا في 3-5 سطور:",
      "/long": "اجعل الرد تفصيلي ومنظم بعناوين:"
    };

    if(map[cmd]){
      return { cmd, userText: rest, cmdPrompt: map[cmd] };
    }
    return { cmd:null, userText: input, cmdPrompt:null };
  }

  /* ========= Feature 4: Regenerate ========= */
  function hasLastUserMessage(){
    for(let i=convo.length-1;i>=0;i--){
      if(convo[i].role === "user") return true;
    }
    return false;
  }
  function getLastUserIndex(){
    for(let i=convo.length-1;i>=0;i--){
      if(convo[i].role === "user") return i;
    }
    return -1;
  }

  async function regenerate(){
    const idx = getLastUserIndex();
    if(idx === -1) return;

    convo = convo.slice(0, idx+1);

    chat.innerHTML = "";
    renderAttachments();
    for(const m of convo){
      addBubble(m.role === "user" ? "user" : "ai", m.text);
    }
    saveChat();

    // ابعت نفس آخر رسالة
    await send(convo[idx].text, true);
  }

  regenBtn.addEventListener('click', regenerate);

  /* ========= Feature 3: Streaming + Stop ========= */
  function stopStream(){
    if(aborter){
      aborter.abort();
      aborter = null;
      setStatus("Stopped", false);
      stopBtn.disabled = true;
    }
  }
  stopBtn.addEventListener('click', stopStream);

  /* ========= SEND (مضمون) ========= */
  async function send(forcedText=null, isRegen=false){
    const raw = forcedText ?? (msgEl.value || '');
    const original = raw.trim();
    if(!original) return;

    // parse commands
    const cmdData = applySlashCommand(original);
    const userText = (cmdData.userText || "").trim();
    const cmdPrompt = cmdData.cmdPrompt || null;

    if(!userText){
      addBubble('ai', 'اكتب نص بعد الأمر مثل: /code اكتب لي كود...');
      return;
    }

    if(!isRegen){
      addBubble('user', original);
      convo.push({ role:'user', text: original });
      msgEl.value = '';
      autosize();
    }

    sendBtn.disabled = true;
    msgEl.disabled = true;
    regenBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus("Streaming...", true);

    const aiBubble = addBubble('ai', '');
    aiBubble.meta.textContent = '🤖 AI يكتب...';

    // settings
    const temp = Number(tempEl.value)/100;
    const len = lengthConfig(lenLevelEl.value);

    // system prompt
    const systemText =
      personaPrompt(personaEl.value) +
      "\n" + len.style +
      (extraPromptEl.value ? ("\nتعليمات إضافية: " + extraPromptEl.value) : "");

    // attachments context
    let filesContext = "";
    if(attachments.length){
      const chunks = attachments.map(f => `--- FILE: ${f.name} ---\n${f.text}`).join("\n\n");
      filesContext = `\n\n[مرفقات من المستخدم]\n${chunks}\n\n[نهاية المرفقات]\n`;
    }

    const finalUserMessage =
      (cmdPrompt ? (cmdPrompt + "\n\n") : "") +
      userText +
      (filesContext ? ("\n\n" + filesContext) : "");

    const history = convo.map(m => ({ role:m.role, text:m.text }));

    aborter = new AbortController();

    try{
      const res = await fetch('/api/chat-stream', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          system: systemText,
          message: finalUserMessage,
          history,
          temperature: temp,
          maxOutputTokens: len.maxOutputTokens
        }),
        signal: aborter.signal
      });

      if(!res.ok){
        const t = await res.text();
        throw new Error("API Error: " + t.slice(0, 800));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let full = "";

      while(true){
        const { value, done } = await reader.read();
        if(done) break;
        const chunk = decoder.decode(value, { stream:true });
        const lines = chunk.split("\n").filter(Boolean);
        for(const line of lines){
          try{
            const obj = JSON.parse(line);
            if(obj.delta){
              full += obj.delta;
              aiBubble.content.textContent = full;
              chat.scrollTop = chat.scrollHeight;
            }
          }catch{}
        }
      }

      aiBubble.meta.textContent = "🤖 AI";
      if(!full.trim()) aiBubble.content.textContent = "مفيش رد اتبعت من السيرفر.";

      convo.push({ role:'model', text: full });
      saveChat();

      setStatus("Ready", false);
    }catch(err){
      if(err?.name === "AbortError"){
        aiBubble.meta.textContent = "🤖 AI (متوقف)";
        if(!aiBubble.content.textContent.trim()) aiBubble.content.textContent = "تم إيقاف الرد.";
        setStatus("Stopped", false);
      } else {
        console.error(err);
        aiBubble.meta.textContent = "🤖 AI (Error)";
        aiBubble.content.textContent = "حصل خطأ:\n" + (err?.message || err);
        setStatus("Error", false);
      }
    }finally{
      aborter = null;
      sendBtn.disabled = false;
      msgEl.disabled = false;
      regenBtn.disabled = !hasLastUserMessage();
      stopBtn.disabled = true;
      msgEl.focus();
    }
  }

  // ✅ Export send function for onclick fallback
  window.__sendSafe = () => {
    try { send(); } catch(e){ console.error(e); alert("حصل خطأ في الإرسال. افتح Console."); }
  };

  /* ========= Events (مضمون) ========= */
  msgEl.addEventListener('input', autosize);
  autosize();

  msgEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });

  // ✅ binding للإرسال (حتى لو onclick اتشال)
  sendBtn.addEventListener('click', ()=>send());
  // زر الإرسال شغال حتى لو JS فيه أخطاء بسيطة

  /* ========= Boot ========= */
  tempValEl.textContent = (Number(tempEl.value)/100).toFixed(2);
  updateSummary();
  renderAttachments();

  // ترحيب
  addBubble('ai', 'أهلاً 👋\nاضغط "تخصيص AI" لاختيار الشخصية والطول والإبداع، وبعدين ابعت رسالتك.');

  // Load auto if exists
  try{ loadChat(); }catch{}
})();
</script>
