<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق إكس - متصل بـ Pi Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        :root { 
            --primary: #002f34; 
            --accent: #3a77ff; 
            --pi-color: #ffda00; /* Pi Yellow */
            --pi-text: #674818;
            --bg: #f2f4f5; 
            --surface: #ffffff; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--primary); padding-bottom: 50px; }
        
        header { 
            background: var(--surface); 
            padding: 12px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky; top: 0; z-index: 100; 
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }

        /* Login Button Styling */
        .btn-login {
            background: var(--pi-color);
            color: var(--pi-text);
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(255, 218, 0, 0.4);
            transition: 0.3s;
        }
        .btn-login:hover { transform: scale(1.05); }
        .user-profile { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 14px; }

        .search-area { text-align: center; margin: 30px 0; }
        .search-input { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 50px; border: 1px solid #ddd; font-size: 16px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; }
        .card-price { font-size: 20px; font-weight: 800; color: var(--primary); }

        .fab { 
            position: fixed; bottom: 20px; left: 20px; 
            width: 60px; height: 60px; 
            background: var(--accent); color: white; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            font-size: 24px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 99; 
            cursor: pointer;
        }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-submit { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 50px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="loaderStatus" style="margin-top: 15px;">جاري تشغيل النظام...</p>
</div>

<header>
    <div class="container nav">
        <a href="#" class="logo">سوق <span>إكس</span></a>
        <div id="authContainer">
            <button class="btn-login" onclick="app.loginWithPi()">
                <i class="fab fa-pi"></i> تسجيل الدخول بـ Pi
            </button>
        </div>
    </div>
</header>

<div class="container">
    <div class="search-area">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي شيء..." onkeyup="app.fetchAds()">
    </div>
    <div class="grid" id="productGrid"></div>
</div>

<button class="fab" onclick="app.checkAuthBeforeAdd()"><i class="fas fa-plus"></i></button>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px;">انشر إعلانك</h3>
        <form id="addForm">
            <div class="form-group"><label>العنوان</label><input type="text" id="pName" required></div>
            <div class="form-group"><label>السعر (ج.م)</label><input type="number" id="pPrice" required></div>
            <div class="form-group">
                <label>القسم</label>
                <select id="pCat"><option value="cars">سيارات</option><option value="electronics">إلكترونيات</option><option value="properties">عقارات</option></select>
            </div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="pPhone" required></div>
            <div class="form-group"><label>الوصف</label><textarea id="pDesc" rows="3" required></textarea></div>
            <div class="form-group"><label>الصورة</label><input type="file" id="pImage" accept="image/*" required></div>
            <button type="submit" class="btn-submit" id="submitBtn">نشر الآن</button>
            <button type="button" onclick="toggleModal('addModal', false)" style="width: 100%; background: #eee; border: none; padding: 10px; border-radius: 50px; margin-top: 10px; cursor: pointer;">إلغاء</button>
        </form>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <div id="detailContent"></div>
        <button onclick="toggleModal('detailModal', false)" style="width: 100%; background: #eee; border: none; padding: 10px; border-radius: 8px; margin-top: 15px; cursor: pointer;">إغلاق</button>
    </div>
</div>

<script>
    // --- الإعدادات ---
    const SB_URL = 'https://xncapmzlwuisupkjlftb.supabase.co';
    const SB_KEY = 'sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS'; 
    const client = supabase.createClient(SB_URL, SB_KEY);

    // تهيئة Pi SDK
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: false });

    const app = {
        currentUser: null,

        async init() {
            try {
                console.log("App starting...");
                await this.fetchAds();
                document.getElementById('loader').style.display = 'none';
            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loaderStatus').innerHTML = `<span style="color:red">فشل الاتصال: ${err.message}</span>`;
            }
        },

        // --- تسجيل الدخول عبر Pi ---
        async loginWithPi() {
            try {
                const scopes = ['username', 'payments'];
                const onIncompletePaymentFound = (payment) => { /* معالجة الدفعات المعلقة إن وجدت */ };

                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                this.currentUser = auth.user;
                this.updateAuthUI();
                console.log("Authenticated User:", this.currentUser);
            } catch (err) {
                alert("فشل تسجيل الدخول بـ Pi: " + err.message);
            }
        },

        updateAuthUI() {
            const container = document.getElementById('authContainer');
            if (this.currentUser) {
                container.innerHTML = `
                    <div class="user-profile">
                        <span>مرحباً، ${this.currentUser.username}</span>
                        <i class="fas fa-user-circle" style="font-size: 24px; color: var(--accent);"></i>
                    </div>
                `;
            }
        },

        checkAuthBeforeAdd() {
            if (!this.currentUser) {
                alert("يرجى تسجيل الدخول باستخدام Pi أولاً لتتمكن من إضافة إعلان.");
                this.loginWithPi();
            } else {
                toggleModal('addModal', true);
            }
        },

        async fetchAds() {
            const searchTerm = document.getElementById('searchInput').value;
            let query = client.from('ads').select('*').order('created_at', { ascending: false });
            
            if (searchTerm) query = query.ilike('name', `%${searchTerm}%`);

            const { data, error } = await query;
            if (error) throw error;
            
            this.renderGrid(data || []);
        },

        renderGrid(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد إعلانات متاحة حالياً.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => this.showDetails(item);
                card.innerHTML = `
                    <img src="${item.image_url}" class="card-img" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                    <div class="card-body">
                        <div class="card-price">${Number(item.price).toLocaleString()} ج.م</div>
                        <div style="font-weight:bold; margin-top:5px;">${item.name}</div>
                        <div style="font-size:11px; color:#999; margin-top:5px;">بواسطة: ${item.seller_user || 'غير معروف'}</div>
                        <div style="font-size:12px; color:#777; margin-top:10px;"><i class="fas fa-phone"></i> ${item.phone}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        },

        async showDetails(item) {
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <img src="${item.image_url}" style="width:100%; border-radius:10px; margin-bottom:15px;">
                <h2>${item.name}</h2>
                <h3 style="color:var(--accent); margin:10px 0;">${Number(item.price).toLocaleString()} ج.م</h3>
                <p style="background:#f9f9f9; padding:10px; border-radius:8px; font-size:14px; color:#555;">${item.description}</p>
                <div style="margin: 15px 0; font-size: 13px;">البائع: <b>${item.seller_user || 'عضو Pi'}</b></div>
                <a href="tel:${item.phone}" style="display:block; text-align:center; background:#25D366; color:white; padding:12px; border-radius:8px; text-decoration:none; margin-top:15px; font-weight:bold;">
                    <i class="fas fa-phone"></i> اتصل بالبائع
                </a>
            `;
            toggleModal('detailModal', true);
        }
    };

    // --- معالجة رفع الإعلان مع اسم المستخدم من Pi ---
    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'جاري النشر...';

        try {
            const file = document.getElementById('pImage').files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random()}.${fileExt}`;

            // 1. رفع الصورة
            const { error: uploadError } = await client.storage.from('ad_images').upload(fileName, file);
            if (uploadError) throw uploadError;

            // 2. الحصول على الرابط
            const { data: { publicUrl } } = client.storage.from('ad_images').getPublicUrl(fileName);

            // 3. حفظ البيانات (مع إضافة seller_user)
            const { error: insertError } = await client.from('ads').insert({
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                description: document.getElementById('pDesc').value,
                phone: document.getElementById('pPhone').value,
                image_url: publicUrl,
                seller_user: app.currentUser.username // حفظ اسم المستخدم من شبكة Pi
            });

            if (insertError) throw insertError;

            alert('تم نشر إعلانك بنجاح!');
            location.reload();
        } catch (err) {
            alert('خطأ: ' + err.message);
            btn.disabled = false;
            btn.innerText = 'نشر الآن';
        }
    };

    function toggleModal(id, show) {
        document.getElementById(id).style.display = show ? 'flex' : 'none';
    }

    app.init();
</script>
</body>
</html>
