<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pi Startups | منصة دعم المشروعات</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* نفس التصميم السابق (Purple & Gold) */
    :root {
      --primary: #6f2fa0;
      --primary-dark: #4b1e6e;
      --accent: #fbce3a;
      --bg-body: #f8f9fe;
      --bg-card: #ffffff;
      --text-main: #2d2d2d;
      --border-radius: 16px;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; outline: none; }
    body { margin: 0; font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
    
    header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 15px 0; }
    .container { width: 90%; max-width: 1200px; margin: 0 auto; }
    .nav-content { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 24px; color: var(--primary); }
    
    .btn { padding: 10px 20px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Tajawal'; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 15px rgba(111, 47, 160, 0.3); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .hero { text-align: center; padding: 40px 0; }
    .hero h1 { color: var(--primary-dark); margin-bottom: 10px; }
    
    #user-section { background: linear-gradient(135deg, #6f2fa0, #8e44ad); color: white; padding: 20px; border-radius: var(--border-radius); margin-bottom: 30px; display: none; animation: fadeIn 0.5s ease; }
    
    .form-card { background: var(--bg-card); padding: 25px; border-radius: var(--border-radius); box-shadow: var(--shadow); margin-top: 20px; color: var(--text-main); }
    input, textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; font-family: 'Tajawal'; margin-bottom: 15px; }
    input:focus, textarea:focus { border-color: var(--primary); }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: var(--bg-card); border-radius: var(--border-radius); box-shadow: var(--shadow); padding: 20px; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); }
    .progress-bar { height: 8px; background: #eee; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 1s; }

    #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

<header>
  <div class="container nav-content">
    <div class="logo">π <span>Pi Startups</span></div>
    <div id="auth-btn-container">
      <button class="btn btn-primary" id="loginBtn" onclick="authenticateUser()">تسجيل دخول Pi</button>
    </div>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>منصة دعم المشروعات</h1>
    <p style="color:#666">شارك فكرتك أو ادعم مشروعات الآخرين بعملة Pi.</p>
  </section>

  <div id="user-section">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>👋 أهلاً، <span id="display-username">...</span></h3>
      <button class="btn btn-outline" style="border-color:white; color:white" onclick="toggleAddProject()">+ مشروع جديد</button>
    </div>

    <div id="add-project-box" class="form-card" style="display:none;">
      <h3 style="margin-top:0">بيانات المشروع</h3>
      <input type="text" id="pName" placeholder="اسم المشروع">
      <input type="text" id="pCategory" placeholder="التصنيف">
      <textarea id="pDesc" placeholder="وصف المشروع..." style="min-height:100px"></textarea>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <input type="number" id="pGoal" placeholder="المبلغ المطلوب (Pi)">
        <input type="text" id="pOwner" readonly>
      </div>
      <button class="btn btn-primary" onclick="submitProject()">نشر الآن</button>
    </div>
  </div>

  <div class="grid-container" id="projects-grid"></div>
  
  <footer style="text-align:center; margin-top:50px; padding:20px; color:#999; font-size:12px;">© 2026 Pi Startups</footer>
</div>

<div id="toast"></div>

<script>
  /* =========================================
     1. الثوابت والإعدادات (تم التعديل حسب طلبك)
     ========================================= */
  const SUPA_URL = "https://xncapmzlwuisupkjlftb.supabase.co";
  const SUPA_KEY = "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS";
  
  // إنشاء كائن Supabase باسم supa
  const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  // إعداد Pi SDK
  const PI_SANDBOX = false; // تم وضعه false بناء على طلبك (للوضع الحقيقي)
  if (window.Pi) {
    try {
      Pi.init({ version: "2.0", sandbox: PI_SANDBOX });
      console.log("Pi SDK Init: Success (Sandbox: " + PI_SANDBOX + ")");
    } catch (e) {
      console.error("Pi Init Error:", e);
    }
  }

  // دالة الاختصار $
  const $ = (id) => document.getElementById(id);

  /* =========================================
     2. المنطق والتفاعل
     ========================================= */
  
  let currentUser = null;

  // Callback مطلوب من Pi للمدفوعات
  function onIncompletePaymentFound(payment) {
    console.log("Incomplete Payment:", payment);
  };

  async function authenticateUser() {
    const btn = $("loginBtn");
    const oldText = btn.innerHTML;
    
    try {
      btn.disabled = true;
      btn.innerHTML = "جاري الاتصال...";

      if (!window.Pi) throw new Error("متصفح Pi غير موجود");

      // طلب المصادقة
      const scopes = ['username', 'payments'];
      const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
      
      currentUser = auth.user || auth;
      
      // حفظ المستخدم في قاعدة البيانات
      await supa.from("pi_users").upsert({ 
        pi_uid: currentUser.uid, 
        username: currentUser.username 
      }, { onConflict: 'pi_uid' });

      // تحديث الواجهة
      onLoginSuccess();

    } catch (err) {
      console.error(err);
      alert("فشل تسجيل الدخول: " + (err.message || err));
      btn.disabled = false;
      btn.innerHTML = oldText;
    }
  }

  function onLoginSuccess() {
    $("auth-btn-container").style.display = "none";
    $("user-section").style.display = "block";
    $("display-username").textContent = currentUser.username;
    $("pOwner").value = currentUser.username;
    showToast("تم تسجيل الدخول بنجاح ✅");
  }

  async function submitProject() {
    if (!currentUser) return alert("يرجى تسجيل الدخول");

    const name = $("pName").value.trim();
    const category = $("pCategory").value.trim();
    const desc = $("pDesc").value.trim();
    const goal = $("pGoal").value;

    if (!name || !desc || !goal) return showToast("أكمل البيانات الناقصة!");

    // استخدام supa بدلاً من supabase
    const { error } = await supa.from("projects").insert({
      owner_pi_uid: currentUser.uid,
      owner_username: currentUser.username,
      name, category, description: desc,
      goal_pi: Number(goal), 
      raised_pi: 0
    });

    if (error) {
      alert("Error: " + error.message);
    } else {
      showToast("تم نشر المشروع 🚀");
      toggleAddProject();
      // تنظيف الحقول
      $("pName").value = ""; $("pDesc").value = ""; $("pGoal").value = "";
      fetchProjects();
    }
  }

  async function fetchProjects() {
    const grid = $("projects-grid");
    grid.innerHTML = '<div style="text-align:center; width:100%">جاري التحميل...</div>';

    // استخدام supa
    const { data, error } = await supa
      .from("projects")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = "حدث خطأ في جلب البيانات.";
      return;
    }

    grid.innerHTML = "";
    if (!data || data.length === 0) {
      grid.innerHTML = '<div style="text-align:center; color:#888; grid-column:1/-1">لا توجد مشروعات حالياً.</div>';
      return;
    }

    data.forEach(p => {
      const raised = p.raised_pi || 0;
      const goal = p.goal_pi || 1;
      const pct = Math.min(100, Math.round((raised / goal) * 100));

      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <span style="background:#f3e5f5; color:#6f2fa0; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:bold">${escapeHtml(p.category)}</span>
        <h3 style="margin:10px 0 5px">${escapeHtml(p.name)}</h3>
        <p style="color:#666; font-size:14px; margin-bottom:15px">${escapeHtml(p.description)}</p>
        
        <div style="font-size:13px; font-weight:bold; display:flex; justify-content:space-between">
           <span>مجمّع: ${raised} π</span>
           <span>هدف: ${goal} π</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="margin-top:10px; font-size:12px; color:#999">بواسطة: ${escapeHtml(p.owner_username)}</div>
      `;
      grid.appendChild(el);
    });
  }

  /* Helpers */
  function toggleAddProject() {
    const b = $("add-project-box");
    b.style.display = b.style.display === "none" ? "block" : "none";
  }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "show";
    setTimeout(() => t.className = "", 3000);
  }

  function escapeHtml(text) {
    return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // التشغيل المبدئي
  fetchProjects();

</script>
</body>
</html>
