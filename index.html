<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Pi Social</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- Supabase (CDN 1) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ Fallback لو jsdelivr اتحظر -->
  <script>
    (function () {
      function loadFallback() {
        var s = document.createElement("script");
        s.src = "https://unpkg.com/@supabase/supabase-js@2";
        s.onload = function () { console.log("Supabase fallback loaded ✅"); };
        s.onerror = function () { console.error("Supabase fallback failed ❌"); };
        document.head.appendChild(s);
      }
      setTimeout(function () {
        var ok =
          (window.supabaseJs && window.supabaseJs.createClient) ||
          (window.supabase && window.supabase.createClient);
        if (!ok) loadFallback();
      }, 400);
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo">💜</span>
      <div>
        <div class="title">Pi Social</div>
        <div class="sub">ستايل قديم</div>
      </div>
    </div>

    <button id="loginBtn" class="btn">تسجيل الدخول بـ Pi</button>
  </header>

  <main id="app" class="container hidden">

    <!-- PROFILE -->
    <section class="card profile">
      <div class="profileRow">
        <img id="avatar" class="avatar" src="https://ui-avatars.com/api/?name=Pi" alt="avatar" />
        <div class="profileInfo">
          <div class="name" id="username">—</div>
          <div class="meta" id="userid">—</div>
        </div>
      </div>
    </section>

    <!-- CREATE POST -->
    <section class="card composer">
      <div class="cardTitle">إنشاء بوست</div>
      <textarea id="postText" placeholder="بم تفكر؟ (نص فقط في النسخة دي)"></textarea>
      <div class="row">
        <button id="postBtn" class="btn btn-primary">نشر</button>
        <button id="refreshBtn" class="btn btn-ghost">تحديث</button>
      </div>
    </section>

    <!-- FEED -->
    <section class="card">
      <div class="cardTitle">المنشورات</div>
      <div id="feed" class="feed"></div>
    </section>

  </main>

  <!-- app.js آخر حاجة -->
  <script src="app.js"></script>
</body>
</html>
