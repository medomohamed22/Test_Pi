<html lang="ar" dir="rtl">

<meta charset="utf-8">

<style>
:root{
  --bg1:#f6f2ff;
  --bg2:#efe7ff;
  --card:rgba(255,255,255,.62);
  --card2:rgba(255,255,255,.42);
  --stroke:rgba(127,92,255,.22);

  --p:#8b6cff;
  --p2:#b7a7ff;
  --p3:#5b2cff;

  --text:#1d1b2e;
  --mut:rgba(29,27,46,.65);

  --shadow: 0 18px 45px rgba(20,12,60,.14);
  --inset: inset 0 1px 0 rgba(255,255,255,.55);

  --radius:20px;
  --radius2:999px;
}

*{box-sizing:border-box;font-family:Tajawal,system-ui}
html,body{height:100%}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(900px 380px at 50% -80px, rgba(139,108,255,.32), transparent 60%),
    radial-gradient(700px 320px at 15% 20%, rgba(183,167,255,.30), transparent 55%),
    radial-gradient(800px 360px at 90% 35%, rgba(91,44,255,.16), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
}

header{
  padding:16px 14px;
  text-align:center;
  font-weight:900;
  letter-spacing:.2px;
  color:#fff;
  background: linear-gradient(135deg, rgba(183,167,255,.98), rgba(91,44,255,.95));
  position:sticky;top:0;z-index:10;
  box-shadow: 0 10px 30px rgba(91,44,255,.22);
}

.container{
  padding:14px;
  max-width:920px;
  margin:0 auto;
}

.tabs{
  display:flex;
  gap:10px;
  margin: 14px 0 18px;
}
.tabs button{
  flex:1;
  padding:14px 14px;
  border-radius:var(--radius2);
  border:1px solid rgba(255,255,255,.45);
  background: rgba(255,255,255,.55);
  color: var(--text);
  font-weight:900;
  box-shadow: 0 10px 25px rgba(20,12,60,.10);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.tabs button:active{transform:scale(.98)}
.tabs .active{
  color:#fff;
  border-color: rgba(255,255,255,.35);
  background: linear-gradient(135deg, rgba(183,167,255,.95), rgba(139,108,255,.95));
  box-shadow: 0 14px 30px rgba(91,44,255,.26);
}

.card{
  background: linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow: var(--shadow), var(--inset);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  animation: fade .28s ease;
}

input, textarea, select{
  width:100%;
  padding:14px 14px;
  border-radius:16px;
  border:1px solid rgba(127,92,255,.20);
  background: rgba(255,255,255,.70);
  color: var(--text);
  outline:none;
  font-size:15px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
textarea{min-height:92px;resize:vertical}
input::placeholder, textarea::placeholder{color:rgba(29,27,46,.45)}

button{
  width:100%;
  padding:14px 14px;
  border-radius:16px;
  border:none;
  font-weight:900;
  cursor:pointer;
  color:#fff;
  background: linear-gradient(135deg, rgba(183,167,255,1), rgba(139,108,255,1));
  box-shadow: 0 14px 26px rgba(91,44,255,.22);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
button:active{transform:scale(.985)}
button:hover{filter:brightness(1.02)}
button.secondary{
  color: var(--text);
  background: rgba(255,255,255,.70);
  border:1px solid rgba(127,92,255,.18);
  box-shadow: 0 12px 24px rgba(20,12,60,.10);
}
button.danger{
  background: linear-gradient(135deg, #ff7b7b, #ff3b30);
  box-shadow: 0 14px 26px rgba(255,59,48,.18);
}
button:disabled{opacity:.6;box-shadow:none}

.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--mut);font-size:13px}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 12px;border-radius:999px;
  background: rgba(255,255,255,.70);
  border:1px solid rgba(127,92,255,.18);
  color: var(--mut);
}

.shop-img{
  width:100%;
  height:190px;
  border-radius:18px;
  object-fit:cover;
  border:1px solid rgba(127,92,255,.18);
  box-shadow: 0 14px 30px rgba(20,12,60,.10);
  margin-bottom:10px;
}

.auth-form{display:flex;flex-direction:column;gap:14px}
.merchant-actions{display:flex;flex-direction:column;gap:12px;margin-top:8px}

hr.sep{border:0;border-top:1px solid rgba(127,92,255,.18);margin:14px 0}

.shop-mini{
  display:flex;
  gap:10px;
  align-items:center;
}
.shop-mini img{
  width:74px;height:74px;
  border-radius:16px;
  object-fit:cover;
  border:1px solid rgba(127,92,255,.18);
}
.shop-mini .meta{flex:1;min-width:0}
.shop-mini .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-mini .meta .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{width:auto;padding:10px 12px;border-radius:14px}

.stars{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:10px;
}
.stars button{
  width:auto;
  min-width:52px;
  padding:10px 12px;
  border-radius:14px;
  background: rgba(255,255,255,.75);
  color: var(--text);
  border:1px solid rgba(127,92,255,.18);
  box-shadow: 0 10px 20px rgba(20,12,60,.10);
}
.stars button.active{
  background: linear-gradient(135deg, rgba(183,167,255,1), rgba(139,108,255,1));
  color:#fff;
  border-color: rgba(255,255,255,.35);
}

@media (max-width:420px){
  .container{padding:12px}
  .card{padding:14px}
  button, input, textarea, select{padding:13px}
  .shop-img{height:175px}
}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
const SUPA_URL = "https://xncapmzlwuisupkjlftb.supabase.co";
const SUPA_KEY = "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS";

if(window.Pi){

  userView.style.display="block";

// GPS helper (fixed)
function getGPS(){
  return new Promise((res, rej)=>{
    if(!navigator.geolocation) return rej(new Error("GPS غير مدعوم"));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      err => rej(err),
      { enableHighAccuracy:true, timeout: 15000, maximumAge: 0 }
    );
  });
}

// Haversine distance
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function openMap(lat, lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,"_blank");
}

// Fingerprint (SHA-256)
async function generateFingerprint(){
  const raw =
    navigator.userAgent + "|" +
    navigator.language + "|" +
    (navigator.platform || "") + "|" +
    screen.width + "x" + screen.height + "|" +
    (Intl.DateTimeFormat().resolvedOptions().timeZone || "");

  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ================= USER =================
let userLoc = null;

btnUserGPS.addEventListener("click", async ()=>{
  try{
    btnUserGPS.disabled = true;
    gpsStatus.textContent = "جاري...";
    btnUserGPS.textContent = "⏳ جاري تحديد الموقع...";
    userLoc = await getGPS();
    gpsStatus.textContent = "تم";
    userLocText.textContent = `موقعك: ${userLoc.lat.toFixed(5)}, ${userLoc.lng.toFixed(5)}`;
    localStorage.setItem("user_loc", JSON.stringify(userLoc));
    await loadNearbyShops();
  }catch(e){
    gpsStatus.textContent = "مرفوض";
    alert("من فضلك اسمح بالموقع (GPS) من إعدادات المتصفح/الهاتف.");
  }finally{
    btnUserGPS.disabled = false;
    btnUserGPS.textContent = "📍 تحديد موقعي";
  }
});

async function loadNearbyShops(){
  shopsList.innerHTML = `<div class="card"><b>جاري تحميل المحلات...</b><div class="muted">لحظات…</div></div>`;

  const { data, error } = await supa.from("shops").select("*");
  if(error){
    shopsList.innerHTML = `<div class="card"><b>خطأ</b><div class="muted">${error.message}</div></div>`;
    return;
  }

  const arr = (data||[])
    .map(s => ({...s, dist_km: haversine(userLoc.lat, userLoc.lng, s.lat, s.lng)}))
    .sort((a,b)=>a.dist_km - b.dist_km);

  if(!arr.length){
    shopsList.innerHTML = `<div class="card"><b>لا توجد محلات</b><div class="muted">اطلب من التاجر إضافة متجر.</div></div>`;
    return;
  }

  shopsList.innerHTML = "";
  arr.forEach(s=>{
    shopsList.innerHTML += renderShopCard(s);
  });
}

function renderShopCard(s){
  const img = s.image_url || `https://picsum.photos/600?seed=${encodeURIComponent(s.id)}`;
  const avg = Number(s.avg_rating || 0).toFixed(1);
  const cnt = Number(s.rating_count || 0);

  return `
    <div class="card">
      <img class="shop-img" src="${img}" alt="shop">

      <div class="row">
        <b>${escapeHtml(s.name)}</b>
        <span class="badge">📏 ${s.dist_km.toFixed(2)} كم</span>
      </div>

      <div class="muted" style="margin-top:6px">${escapeHtml(s.address || "")}</div>
      <div class="muted" style="margin-top:6px">${escapeHtml((s.description || "").slice(0,120))}${(s.description||"").length>120?"…":""}</div>

      <div class="row" style="margin-top:10px">
        <span class="badge">⭐ ${avg} (${cnt})</span>
        <button class="secondary" type="button" style="width:auto" onclick="openMap(${s.lat},${s.lng})">🗺️ الخريطة</button>
      </div>

      <hr class="sep">

      <b>قيّم المتجر</b>
      <div class="stars" data-shop="${s.id}">
        ${[1,2,3,4,5].map(n=>`<button type="button" onclick="setStars('${s.id}',${n})">${n}⭐</button>`).join("")}
      </div>

      <textarea id="c_${s.id}" placeholder="اكتب تعليق (اختياري)..." style="margin-top:10px"></textarea>
      <button type="button" style="margin-top:10px" onclick="submitReview('${s.id}')">إرسال التقييم</button>
    </div>
  `;
}

window.setStars = (shopId, n)=>{
  const wrap = document.querySelector(`.stars[data-shop="${shopId}"]`);
  if(!wrap) return;
  wrap.dataset.value = String(n);
  [...wrap.querySelectorAll("button")].forEach((b, i)=>{
    b.classList.toggle("active", (i+1) <= n);
  });
};

window.submitReview = async (shopId)=>{
  try{
    // get stars
    const wrap = document.querySelector(`.stars[data-shop="${shopId}"]`);
    const stars = Number(wrap?.dataset?.value || 0);
    if(!stars) return alert("اختر عدد النجوم أولاً ⭐");

    const comment = (document.getElementById(`c_${shopId}`)?.value || "").trim();
    const fp = await generateFingerprint();

    const { error } = await supa.from("reviews").insert({
      shop_id: shopId,
      stars,
      comment: comment || null,
      fingerprint: fp
    });

    if(error){
      if(String(error.message||"").toLowerCase().includes("duplicate") || String(error.message||"").includes("unique")){
        alert("لقد قمت بتقييم هذا المحل بالفعل من هذا الجهاز ✅");
      }else{
        alert("خطأ في التقييم: " + error.message);
      }
      return;
    }

    alert("تم إرسال التقييم ⭐");
    await loadNearbyShops();
  }catch(e){
    alert("حدث خطأ أثناء إرسال التقييم.");
  }
};

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// ================= MERCHANT =================
let piUser = null;
let piAccessToken = null;
let merchantProfile = null;
let hasSubscription = false;
let shopLoc = null;
let editShopId = null;

async function checkAuth(){
  if(piUser){
    authBox.style.display = "none";
    shopForm.style.display = "block";
    await refreshMerchantProfile();
    await refreshSubscription();
    await loadMyShops();
  }else{
    authBox.style.display = "block";
    shopForm.style.display = "none";
  }
}

async function fetchPiWalletAddress(){
  if(window.Pi?.getWalletAddress){
    return await window.Pi.getWalletAddress();
  }
  return null;
}

async function refreshMerchantProfile(){
  if(!piUser) return;
  const { data } = await supa
    .from("merchants")
    .select("*")
    .eq("pi_username", piUser.username)
    .maybeSingle();

  merchantProfile = data || null;
  const wallet = merchantProfile?.wallet_address || "";
  walletInput.value = wallet;
  merchantName.textContent = piUser.username;
  merchantWallet.textContent = `محفظة: ${wallet || "غير متوفر"}`;
}

async function upsertMerchantProfile(walletAddress){
  if(!piUser) return;
  const payload = {
    pi_username: piUser.username,
    pi_uid: piUser.uid,
    wallet_address: walletAddress || null
  };
  const { data, error } = await supa
    .from("merchants")
    .upsert(payload, { onConflict: "pi_username" })
    .select()
    .single();
  if(error){
    authMsg.textContent = "خطأ في حفظ التاجر: " + error.message;
    return;
  }
  merchantProfile = data;
  merchantWallet.textContent = `محفظة: ${merchantProfile.wallet_address || "غير متوفر"}`;
}

async function refreshSubscription(){
  if(!piUser) return;
  const { data, error } = await supa
    .from("merchant_subscriptions")
    .select("status")
    .eq("pi_username", piUser.username)
    .eq("status", "active")
    .maybeSingle();
  hasSubscription = !!data && !error;
  updateSubscriptionUI();
}

function updateSubscriptionUI(){
  subscriptionBadge.textContent = hasSubscription ? "مشترك ✅" : "غير مشترك";
  btnSubscribe.disabled = hasSubscription;
  btnSave.disabled = !hasSubscription;
  subscriptionMsg.textContent = hasSubscription
    ? "اشتراكك مفعل ويمكنك إضافة حتى 3 محلات."
    : "يلزم الاشتراك بـ 1 Pi قبل إضافة بيانات المحل (3 محلات كحد أقصى).";
}

btnPiLogin.addEventListener("click", async ()=>{
  if(!window.Pi) {
    authMsg.textContent = "Pi SDK غير متاح في هذا المتصفح.";
    return;
  }
  authMsg.textContent = "جاري تسجيل الدخول عبر Pi...";
  try{
    const scopes = ["username", "payments"];
    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
    piUser = auth.user;
    piAccessToken = auth.accessToken;
    const wallet = await fetchPiWalletAddress();
    if(wallet){
      await upsertMerchantProfile(wallet);
    }else{
      await upsertMerchantProfile(walletInput.value.trim());
    }
    authMsg.textContent = "تم تسجيل الدخول ✅";
    await checkAuth();
  }catch(e){
    authMsg.textContent = "تعذر تسجيل الدخول عبر Pi.";
  }
});

btnLogout.addEventListener("click", async ()=>{
  resetForm();
  piUser = null;
  piAccessToken = null;
  merchantProfile = null;
  hasSubscription = false;
  await checkAuth();
});

btnSaveWallet.addEventListener("click", async ()=>{
  if(!piUser) return alert("سجّل الدخول أولاً.");
  const wallet = walletInput.value.trim();
  if(!wallet) return alert("أدخل عنوان المحفظة.");
  await upsertMerchantProfile(wallet);
  alert("تم تحديث المحفظة ✅");
});

btnSubscribe.addEventListener("click", async ()=>{
  if(!piUser) return alert("سجّل الدخول أولاً.");
  if(!window.Pi) return alert("Pi SDK غير متاح.");
  subscriptionMsg.textContent = "جاري إنشاء عملية الدفع...";
  try{
    await Pi.createPayment({
      amount: 1,
      memo: "اشتراك تاجر - أقرب المحلات (3 محلات)",
      metadata: { purpose: "MERCHANT_SUBSCRIPTION", username: piUser.username }
    }, {
      onReadyForServerApproval: async (paymentId) => {
        subscriptionMsg.textContent = "جاري اعتماد الدفع...";
        const r = await fetch("/api/pi/approve", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ paymentId })
        });
        const j = await r.json().catch(()=> ({}));
        if(!r.ok || !j.ok) throw new Error("approve_failed");
        subscriptionMsg.textContent = "تم اعتماد الدفع ✅";
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        subscriptionMsg.textContent = "جاري تفعيل الاشتراك...";
        const r = await fetch("/api/pi/complete", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ paymentId, txid })
        });
        const j = await r.json().catch(()=> ({}));
        if(!r.ok || !j.ok) throw new Error("complete_failed");
        subscriptionMsg.textContent = "تم الاشتراك ✅ يمكنك إضافة المحلات.";
        await refreshSubscription();
      },
      onCancel: async (paymentId) => {
        subscriptionMsg.textContent = "تم إلغاء الدفع.";
        await recordPayment(paymentId, "canceled", null);
      },
      onError: async (error, payment) => {
        if(payment?.identifier){
          await recordPayment(payment.identifier, "error", null, error?.message);
        }
      }
    });
  }catch(e){
    subscriptionMsg.textContent = "تعذر إنشاء الدفع عبر Pi.";
  }
});

async function recordPayment(paymentId, status, txid, errorMessage) {
  const uname = piUser?.username || "unknown";
  await supa.from("merchant_payments").insert({
    pi_username: uname,
    payment_id: paymentId,
    status,
    txid: txid || null,
    error_message: errorMessage || null
  });
}

// ✅ هتشتغل لو Pi لقى دفعة معلّقة أثناء تسجيل الدخول
async function onIncompletePaymentFound(payment) {
  try {
    const paymentId = payment?.identifier || payment?.id;
    if (!paymentId) return;
    
    authMsg.textContent = "لقيت عملية دفع معلّقة.. بنحاول نكملها الآن ✅";
    
    if (window.Pi?.openPayment) {
      await Pi.openPayment(paymentId);
    } else if (window.Pi?.openPaymentRequest) {
      await Pi.openPaymentRequest(paymentId);
    } else {
      await recordPayment(paymentId, "incomplete", null);
      authMsg.textContent = "في دفعة معلّقة، افتحها من سجل المدفوعات داخل Pi.";
      return;
    }
    
    await recordPayment(paymentId, "incomplete_opened", null);
    
  } catch (e) {
    await recordPayment(payment?.identifier || "unknown", "error", null, String(e));
    authMsg.textContent = "حصل خطأ أثناء محاولة إكمال الدفع المعلّق.";
  }
}

btnCancelEdit.addEventListener("click", ()=>{
  resetForm();
  saveMsg.textContent = "تم إلغاء التعديل.";
});

btnRefreshMyShops.addEventListener("click", loadMyShops);

async function uploadShopImage(file){
  const safeName = file.name.replace(/[^\w.\-]+/g,"_");
  const path = `${piUser.username}/${Date.now()}_${safeName}`;
  const up = await supa.storage.from("shop-images").upload(path, file, { upsert: true });
  if(up.error) throw up.error;
  return supa.storage.from("shop-images").getPublicUrl(path).data.publicUrl;
}

btnSave.addEventListener("click", async ()=>{
  try{
    if(!piUser) return alert("لازم تسجل دخول كتاجر أولاً");
    if(!hasSubscription) return alert("لازم تشترك بـ 1 Pi قبل إضافة المحلات.");
    if(!editShopId && myShopsCount >= 3) return alert("الحد الأقصى 3 محلات لكل تاجر.");
    if(!shopLoc) return alert("حدد موقع المتجر أولاً");

    const name = mName.value.trim();
    if(!name) return alert("اكتب اسم المتجر");

    saveMsg.textContent = "جاري الحفظ...";

    // optional image
    let imageUrl = null;
    if(mImg.files && mImg.files[0]){
      imageUrl = await uploadShopImage(mImg.files[0]);
    }

    const payload = {
      owner_username: piUser.username,
      name,
      description: mDesc.value.trim() || null,
      address: mAddr.value.trim() || null,
      lat: shopLoc.lat,
      lng: shopLoc.lng
    };
    if(imageUrl) payload.image_url = imageUrl; // لو ما رفعش صورة جديدة، ما نغيرش القديمة

    let res;
    if(editShopId){
      res = await supa.from("shops").update(payload).eq("id", editShopId);
    }else{
      res = await supa.from("shops").insert(payload);
    }

    if(res.error){
      saveMsg.textContent = "خطأ: " + res.error.message;
      return;
    }

    saveMsg.textContent = editShopId ? "تم تحديث المتجر ✅" : "تم إضافة المتجر ✅";
    resetForm();
    await loadMyShops();
  }catch(e){
    saveMsg.textContent = "خطأ: " + (e?.message || e);
  }
});

function resetForm(){
  editShopId = null;
  mName.value = "";
  mDesc.value = "";
  mAddr.value = "";
  mImg.value = "";
  shopLoc = null;
  shopLocText.textContent = "";
  btnCancelEdit.style.display = "none";
}

async function loadMyShops(){
  myShopsList.innerHTML = `<div class="muted">جاري تحميل محلاتك...</div>`;

  const { data, error } = await supa
    .from("shops")
    .select("*")
    .eq("owner_username", piUser.username)
    .order("created_at", { ascending: false });

  if(error){
    myShopsList.innerHTML = `<div class="muted">خطأ: ${error.message}</div>`;
    return;
  }

  if(!data || !data.length){
    myShopsCount = 0;
    myShopsList.innerHTML = `<div class="muted">لا توجد محلات مضافة بعد.</div>`;
    return;
  }

  myShopsCount = data.length;
  myShopsList.innerHTML = "";
  data.forEach(s=>{
    const img = s.image_url || `https://picsum.photos/200?seed=${encodeURIComponent(s.id)}`;
    myShopsList.innerHTML += `
      <div class="card" style="padding:12px;margin-bottom:10px">
        <div class="shop-mini">
          <img src="${img}" alt="shop">
          <div class="meta">
            <b>${escapeHtml(s.name)}</b>
            <div class="muted">${escapeHtml(s.address || "")}</div>
            <div class="muted">⭐ ${Number(s.avg_rating||0).toFixed(1)} (${Number(s.rating_count||0)})</div>
          </div>
        </div>

        <div class="actions">
          <button class="secondary" type="button" onclick="startEditShop('${s.id}')">تعديل</button>
          <button class="danger" type="button" onclick="deleteShop('${s.id}')">حذف</button>
        </div>
      </div>
    `;
  });
}

window.startEditShop = async (id)=>{
  const { data, error } = await supa.from("shops").select("*").eq("id", id).single();
  if(error) return alert("خطأ: " + error.message);

  editShopId = data.id;

  mName.value = data.name || "";
  mDesc.value = data.description || "";
  mAddr.value = data.address || "";

  shopLoc = { lat: data.lat, lng: data.lng };
  shopLocText.textContent = `موقع المتجر الحالي: ${shopLoc.lat.toFixed(5)}, ${shopLoc.lng.toFixed(5)}`;

  saveMsg.textContent = "وضع التعديل: عدّل ثم اضغط حفظ ✅";
  btnCancelEdit.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.deleteShop = async (id)=>{
  const ok = confirm("متأكد أنك تريد حذف المتجر؟");
  if(!ok) return;

  const { error } = await supa.from("shops").delete().eq("id", id);
  if(error) return alert("خطأ: " + error.message);

  if(editShopId === id) resetForm();
  alert("تم الحذف ✅");
  await loadMyShops();
};

checkAuth();

    userLocText.textContent = `آخر موقع محفوظ: ${userLoc.lat.toFixed(5)}, ${userLoc.lng.toFixed(5)}`;

}catch{}
</script>
