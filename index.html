<!-- استبدل جزء الـ <script> في ملف index.html بهذا الجزء المحدث -->
<script>
    async function generateImage() {
        const promptInput = document.getElementById('prompt');
        const generateBtn = document.getElementById('generateBtn');
        const resultImage = document.getElementById('resultImage');
        const loader = document.getElementById('loader');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const text = promptInput.value.trim();
        if (!text) return alert("من فضلك اكتب وصفاً للصورة!");
        
        // تجهيز الواجهة للتحميل
        generateBtn.disabled = true;
        generateBtn.innerHTML = "⏳ جاري الرسم...";
        resultImage.style.display = "none";
        placeholder.style.display = "none";
        loader.style.display = "block";
        downloadBtn.style.display = "none";
        
        try {
            // طلب الرابط من الفانكشن
            const response = await fetch('/.netlify/functions/generate', {
                method: 'POST',
                body: JSON.stringify({ prompt: text })
            });
            
            if (!response.ok) throw new Error("السيرفر لا يستجيب حالياً");
            
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            
            // الخطوة الأهم: نربط أحداث الصورة قبل وضع الرابط
            resultImage.onload = () => {
                resultImage.style.display = "block";
                loader.style.display = "none";
                downloadBtn.style.display = "block";
                generateBtn.disabled = false;
                generateBtn.innerHTML = "🎨 توليد صورة جديدة";
            };
            
            resultImage.onerror = () => {
                throw new Error("فشل تحميل الصورة من المصدر، جرب وصفاً آخر");
            };
            
            // وضع الرابط للبدء في التحميل
            resultImage.src = data.url;
            
        } catch (err) {
            alert("حدث خطأ: " + err.message);
            placeholder.style.display = "flex";
            loader.style.display = "none";
            generateBtn.disabled = false;
            generateBtn.innerHTML = "🎨 توليد الصورة";
        }
    }
    
    async function downloadImage() {
        const img = document.getElementById('resultImage');
        if (!img.src) return;
        try {
            const response = await fetch(img.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ai-art-' + Date.now() + '.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch (e) {
            window.open(img.src, '_blank');
        }
    }
</script>
