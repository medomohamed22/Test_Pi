<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio | Pi Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة Pi SDK فقط، لا حاجة لـ supabase-js هنا للكتابة -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    /* نفس التنسيقات السابقة تماماً */
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --accent: #d946ef;
      --bg-body: #f8fafc; --surface: #ffffff; --text-main: #1e293b;
      --text-sub: #64748b; --border: #e2e8f0; --input-bg: #f1f5f9;
      --pi-color: #F8A01A; --radius-xl: 24px; --radius-md: 12px;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background-color: var(--bg-body);
      background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(217, 70, 239, 0.08) 0%, transparent 40%);
      color: var(--text-main); display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 700px; background: var(--surface); border-radius: var(--radius-xl);
      padding: 32px; box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.15); border: 1px solid #fff;
      position: relative; overflow: hidden;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;
    }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 800; background: linear-gradient(to right, var(--text-main), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-login {
      background: var(--text-main); color: white; padding: 8px 16px; border-radius: 20px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.3s;
    }
    .btn-login:hover { background: var(--primary); }
    .btn-login.logged-in { background: rgba(99, 102, 241, 0.1); color: var(--primary); cursor: default; }

    .user-stats { display: none; align-items: center; gap: 10px; margin-bottom: 20px; background: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 12px; justify-content: space-between; }
    .token-balance { font-weight: 700; color: var(--text-main); }
    .btn-buy { background: var(--pi-color); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-buy:hover { opacity: 0.9; transform: scale(1.05); }

    .input-group { position: relative; margin-bottom: 16px; }
    textarea { width: 100%; height: 120px; background: var(--input-bg); border: 2px solid transparent; border-radius: var(--radius-md); padding: 16px; font-size: 16px; resize: none; outline: none; transition: 0.3s; }
    textarea:focus { background: #fff; border-color: var(--primary); }

    .chips-scroller { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
    .chip { background: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .chip:hover { border-color: var(--primary); color: var(--primary); }

    .actions { display: flex; gap: 12px; margin-bottom: 24px; }
    .btn-main { flex: 2; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); }
    .btn-sec { flex: 1; background: white; border: 1px solid var(--border); color: var(--text-sub); border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }

    .display-area { position: relative; width: 100%; min-height: 380px; background: #f1f5f9; border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; border: 4px solid #fff; overflow: hidden; }
    .display-area img { max-width: 100%; max-height: 100%; display: none; z-index: 10; animation: fadeIn 0.5s; }
    .aurora-loader { position: absolute; inset: 0; background: #ffffff; display: none; z-index: 5; }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.8; animation: float 8s infinite; }
    .blob-1 { width: 120%; height: 120%; background: #ffe3e0; top:-20%; left:-20%; }
    .loading-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 6; font-weight: 700; color: #475569; animation: pulseText 2s infinite; }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: white; padding: 10px 24px; border-radius: 50px; font-size: 14px; display: none; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    @keyframes pulseText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(10px, -10px); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div class="brand">
      <div class="logo-icon">AI</div>
      <div><h1>Imagine AI</h1></div>
    </div>
    <button id="piLoginBtn" class="btn-login" onclick="loginPi()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
      تسجيل دخول Pi
    </button>
  </div>

  <div class="user-stats" id="userStats">
    <div class="token-balance">
      <span>⚡</span> <span id="tokenCount">--</span> توكين
    </div>
    <button class="btn-buy" onclick="buyTokens()">شراء (1 Pi = 10 توكين)</button>
  </div>

  <div class="input-group">
    <textarea id="prompt" placeholder="اطلق العنان لخيالك.. وصف للصورة.."></textarea>
  </div>

  <div class="chips-scroller">
    <div class="chip" onclick="addTag('Realistic, 8k')">📸 واقعي</div>
    <div class="chip" onclick="addTag('Cyberpunk')">🤖 سايبر بانك</div>
    <div class="chip" onclick="addTag('Anime')">🌸 أنيمي</div>
    <div class="chip" onclick="addTag('Cinematic')">🎬 سينمائي</div>
  </div>

  <div class="actions">
    <button id="generateBtn" class="btn-main" onclick="generateImage()" disabled>
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path></svg>
      <span id="btnText">سجل الدخول أولاً</span>
    </button>
    <button class="btn-sec" onclick="fillRandom()">🎲 مثال</button>
  </div>

  <div class="display-area" id="displayArea">
    <div class="aurora-loader" id="auroraLoader">
      <div class="blob blob-1"></div>
      <div class="loading-status">جاري الرسم...</div>
    </div>
    <div class="empty-state" id="emptyState" style="color:#94a3b8; text-align:center;">
      <svg width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <div>الصورة ستظهر هنا</div>
    </div>
    <img id="resultImage" src="" alt="AI Art">
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
  // تهيئة Pi
  Pi.init({ version: "2.0", sandbox: false }); // 🔴 تأكد من هذا الإعداد

  let currentUser = null;

  // --- 1. تسجيل الدخول الآمن ---
  async function loginPi() {
    try {
      const auth = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
      
      // إرسال البيانات للباك اند للتحقق والتخزين
      const response = await fetch('/.netlify/functions/user-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: auth.user.uid, username: auth.user.username })
      });

      if(!response.ok) throw new Error("فشل الاتصال بالسيرفر");
      
      const userData = await response.json();
      currentUser = userData;

      // تحديث الواجهة
      document.getElementById('piLoginBtn').innerHTML = `👤 ${auth.user.username}`;
      document.getElementById('piLoginBtn').classList.add('logged-in');
      document.getElementById('piLoginBtn').onclick = null;
      document.getElementById('userStats').style.display = 'flex';
      updateUIState();
      
    } catch (err) {
      console.error(err);
      showToast("❌ خطأ في التسجيل");
    }
  }

  function onIncompletePaymentFound(payment) {
    // يمكن هنا إرسال الدفعة المعلقة للباك اند للتحقق منها
    console.log("دفعة غير مكتملة:", payment);
  }

  function updateUIState() {
    if (currentUser) {
      document.getElementById('tokenCount').innerText = currentUser.tokens;
      const genBtn = document.getElementById('generateBtn');
      
      if (currentUser.tokens > 0) {
        genBtn.disabled = false;
        document.getElementById('btnText').innerText = "توليد (1 توكين)";
      } else {
        genBtn.disabled = true;
        document.getElementById('btnText').innerText = "الرصيد نفذ (اشحن الآن)";
      }
    }
  }

  // --- 2. الدفع الحقيقي (Server-Side Logic) ---
  function buyTokens() {
    const paymentData = {
      amount: 1, 
      memo: "AI Studio - 10 Tokens", 
      metadata: { type: 'credits', quantity: 10 } 
    };

    const callbacks = {
      onReadyForServerApproval: async (paymentId) => {
        // استدعاء الباك اند للموافقة
        try {
          await fetch('/.netlify/functions/pi-approve', {
            method: 'POST', body: JSON.stringify({ paymentId })
          });
        } catch(e) { console.error(e); }
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        // استدعاء الباك اند للإنهاء وإضافة الرصيد
        try {
          const res = await fetch('/.netlify/functions/pi-complete', {
            method: 'POST', body: JSON.stringify({ paymentId, txid })
          });
          const data = await res.json();
          if(data.success) {
            currentUser.tokens = data.newBalance; // تحديث الواجهة
            updateUIState();
            showToast("✅ تم الشحن بنجاح!");
          }
        } catch(e) { 
          showToast("خطأ في تحديث الرصيد"); 
        }
      },
      onCancel: () => showToast("تم الإلغاء"),
      onError: (err) => showToast("خطأ: " + err)
    };

    Pi.createPayment(paymentData, callbacks);
  }

  // --- 3. توليد الصورة وخصم الرصيد (Server-Side) ---
  async function generateImage() {
    if (!currentUser || currentUser.tokens < 1) return showToast("رصيدك غير كافٍ");
    
    const promptVal = document.getElementById('prompt').value.trim();
    if (!promptVal) return showToast("أدخل وصف للصورة");

    // بدء التحميل
    document.getElementById('auroraLoader').style.display = 'block';
    document.getElementById('generateBtn').disabled = true;
    document.getElementById('resultImage').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';

    try {
      // 1. طلب خصم الرصيد من السيرفر
      const deductRes = await fetch('/.netlify/functions/deduct-credits', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: currentUser.pi_id })
      });
      
      if (!deductRes.ok) throw new Error("فشل خصم الرصيد");
      
      const deductData = await deductRes.json();
      currentUser.tokens = deductData.remaining;
      updateUIState();

      // 2. توليد الصورة (يفضل أن يكون هذا الرابط أيضاً عبر الـ Backend لإخفاء الـ API Key)
      // لكن حالياً سنستخدم الطريقة المباشرة للتوضيح
      await new Promise(r => setTimeout(r, 2000)); // محاكاة وقت المعالجة
      const fakeImage = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptVal)}?width=1024&height=1024&nologo=true`;
      
      const img = document.getElementById('resultImage');
      img.onload = () => {
        document.getElementById('auroraLoader').style.display = 'none';
        img.style.display = 'block';
        document.getElementById('generateBtn').disabled = false;
      };
      img.src = fakeImage;

    } catch (err) {
      console.error(err);
      showToast("حدث خطأ: " + err.message);
      document.getElementById('auroraLoader').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
    }
  }

  // أدوات مساعدة
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }
  function addTag(tag) { document.getElementById('prompt').value += (document.getElementById('prompt').value ? ", " : "") + tag; }
  function fillRandom() { document.getElementById('prompt').value = "Cyberpunk city with neon lights, 8k, realistic"; }
</script>

</body>
</html>
