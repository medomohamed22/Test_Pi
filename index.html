<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Purple Gemini Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#7B2FF7; --p2:#9B6DFF;
  --bg:#F6F3FF; --card:#FFFFFF;
  --stroke:#E6E0FF;
  --text:#1F1F2E; --mut:#6B6B85;
  --userBg:#EDE7FF; --aiBg:#FFFFFF;
  --r:18px;
  --shadow: 0 10px 28px rgba(123,47,247,.10);
}
*{box-sizing:border-box;font-family:Tajawal,system-ui}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
header .title{font-weight:900;font-size:16px}
header .badge{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap
}
.wrap{width:min(920px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column}
.chat{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}

.bubble{
  max-width:86%;
  border-radius:var(--r);
  padding:12px 14px;
  line-height:1.7;
  box-shadow:var(--shadow);
  border:1px solid var(--stroke);
  position:relative;
  white-space:pre-wrap;
  word-break:break-word;
}
.bubble.user{align-self:flex-start;background:var(--userBg)}
.bubble.ai{align-self:flex-end;background:var(--aiBg)}

.meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:8px;align-items:center}
.bubble.user .meta{justify-content:flex-start}
.bubble.ai .meta{justify-content:flex-end}

.dotTyping{display:inline-flex;gap:4px;align-items:center}
.dotTyping span{
  width:6px;height:6px;border-radius:50%;
  background:var(--p);display:inline-block;
  animation:bounce 1s infinite ease-in-out;opacity:.75
}
.dotTyping span:nth-child(2){animation-delay:.12s}
.dotTyping span:nth-child(3){animation-delay:.24s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-5px);opacity:1}}

footer{background:var(--card);border-top:1px solid var(--stroke);padding:12px}
.composer{width:min(920px,100%);margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{
  flex:1;resize:none;min-height:46px;max-height:140px;
  padding:12px;border-radius:16px;border:1px solid var(--stroke);
  outline:none;font-size:15px;background:#fff
}
button{
  border:none;background:var(--p);color:#fff;
  padding:12px 16px;border-radius:16px;font-weight:800;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
.smallHint{width:min(920px,100%);margin:8px auto 0;color:var(--mut);font-size:12px;padding:0 2px}

/* ====== Code block styling + Copy button ====== */
.codeWrap{
  border:1px solid var(--stroke);
  border-radius:14px;
  overflow:hidden;
  margin-top:10px;
  background:#fff;
}
.codeTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 10px;
  border-bottom:1px solid var(--stroke);
  background:#faf9ff;
}
.codeLang{
  font-size:12px;
  color:var(--mut);
  font-weight:800;
}
.copyBtn{
  border:none;
  background:var(--p);
  color:#fff;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.copyBtn:active{transform:scale(.98)}
pre{
  margin:0;
  padding:12px;
  overflow:auto;
  direction:ltr;
  text-align:left;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size:13px;
  line-height:1.6;
  background:#ffffff;
}
code{font-family:inherit}
</style>
</head>

<body>
<header>
  <div class="title">💜 Purple Gemini Chat</div>
  <div class="badge" id="status">● Ready</div>
</header>

<div class="wrap">
  <div class="chat" id="chat"></div>

  <footer>
    <div class="composer">
      <textarea id="msg" placeholder="اكتب رسالتك..." rows="1"></textarea>
      <button id="sendBtn" type="button">إرسال</button>
    </div>
    <div class="smallHint">Enter لإرسال — Shift+Enter لسطر جديد</div>
  </footer>
</div>

<script>
// ✅ Netlify:
const API_ENDPOINT = "/.netlify/functions/chat";
// ✅ لو رجعت لـ Vercel بدّلها:
// const API_ENDPOINT = "/api/chat";

const chat = document.getElementById('chat');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

let convo = []; // {role:'user'|'model', text:'...'}

function setStatus(text, busy=false){
  statusEl.textContent = "● " + text;
  statusEl.style.opacity = busy ? 0.9 : 1;
}

function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');

  const content = document.createElement('div');
  content.className = 'content';
  content.textContent = text || '';

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = (role === 'user') ? '👤 أنت' : '🤖 AI';

  b.appendChild(content);
  b.appendChild(meta);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return { b, content, meta };
}

function addTyping(){
  const b = document.createElement('div');
  b.className = 'bubble ai';

  const content = document.createElement('div');
  content.className = 'content';
  content.innerHTML = `<span class="dotTyping"><span></span><span></span><span></span></span>`;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = '🤖 AI يكتب...';

  b.appendChild(content);
  b.appendChild(meta);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return { b, content, meta };
}

function typewriter(el, text, speed=12){
  el.textContent = '';
  let i = 0;
  return new Promise(resolve=>{
    const t = setInterval(()=>{
      el.textContent += text[i] ?? '';
      i++;
      chat.scrollTop = chat.scrollHeight;
      if(i >= text.length){
        clearInterval(t);
        resolve();
      }
    }, speed);
  });
}

function autosize(){
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 140) + 'px';
}
msgEl.addEventListener('input', autosize);
autosize();

msgEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);

/* ===== Helpers for code blocks ===== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function parseCodeFences(text){
  const blocks = [];
  const re = /```([\w#+-]*)\n([\s\S]*?)```/g;
  let lastIndex = 0;
  let m;
  while((m = re.exec(text)) !== null){
    if(m.index > lastIndex){
      blocks.push({ type:"text", value: text.slice(lastIndex, m.index) });
    }
    blocks.push({ type:"code", lang: (m[1] || "code").trim(), value: m[2] });
    lastIndex = re.lastIndex;
  }
  if(lastIndex < text.length){
    blocks.push({ type:"text", value: text.slice(lastIndex) });
  }
  return blocks;
}

function looksLikeHtmlCode(text){
  const t = text.trim();
  return t.startsWith("<!DOCTYPE html") || (t.startsWith("<html") && t.includes("</html>"));
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = "✅ تم النسخ";
    setTimeout(()=>btn.textContent = old, 1200);
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    const old = btn.textContent;
    btn.textContent = "✅ تم النسخ";
    setTimeout(()=>btn.textContent = old, 1200);
  }
}

function renderAiWithCode(container, reply){
  container.innerHTML = "";

  if(!reply.includes("```") && looksLikeHtmlCode(reply)){
    const wrap = document.createElement("div");
    wrap.className = "codeWrap";
    wrap.innerHTML = `
      <div class="codeTop">
        <div class="codeLang">html</div>
        <button class="copyBtn" type="button">نسخ الكود</button>
      </div>
      <pre><code>${escapeHtml(reply)}</code></pre>
    `;
    wrap.querySelector(".copyBtn").addEventListener("click", (e)=>copyToClipboard(reply, e.target));
    container.appendChild(wrap);
    return;
  }

  const parts = parseCodeFences(reply);
  for(const part of parts){
    if(part.type === "text"){
      const p = document.createElement("div");
      p.textContent = part.value.trim();
      if(p.textContent) container.appendChild(p);
    } else {
      const code = part.value.replace(/\s+$/,"");
      const lang = (part.lang || "code").toLowerCase();

      const wrap = document.createElement("div");
      wrap.className = "codeWrap";
      wrap.innerHTML = `
        <div class="codeTop">
          <div class="codeLang">${escapeHtml(lang)}</div>
          <button class="copyBtn" type="button">نسخ الكود</button>
        </div>
        <pre><code>${escapeHtml(code)}</code></pre>
      `;
      wrap.querySelector(".copyBtn").addEventListener("click", (e)=>copyToClipboard(code, e.target));
      container.appendChild(wrap);
    }
  }
}

async function send(){
  const text = (msgEl.value || '').trim();
  if(!text) return;

  // ✅ كشف لو المستخدم عايز كود
  const wantsCode = /(\bكود\b|\bcode\b|\bhtml\b|\bcss\b|\bjavascript\b|\bjs\b)/i.test(text);

  // ✅ تعليمات إجبارية للـ AI علشان يبعث الكود كامل داخل fences
  const forceCodeInstruction = wantsCode
    ? "\n\nمهم جدًا: لو هتبعت كود لازم يكون كامل داخل ```html``` أو ```js``` أو ```css``` حسب المطلوب. ممنوع ترد بجملة تمهيدية بس. لازم تبعت الكود كامل فورًا."
    : "";

  addBubble('user', text);
  convo.push({ role:'user', text });

  msgEl.value = '';
  autosize();

  sendBtn.disabled = true;
  msgEl.disabled = true;
  setStatus("Thinking...", true);

  const typing = addTyping();

  try{
    const res = await fetch(API_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        message: text + forceCodeInstruction,
        history: convo.slice(0, -1)
      })
    });

    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); }
    catch { throw new Error("API رجّع HTML/نص مش JSON:\n" + rawText.slice(0, 200)); }

    if(!res.ok){
      throw new Error((data && (data.error || data.message)) ? JSON.stringify(data) : "Request failed");
    }

    const reply = data.reply || "";
    if(!reply){
      throw new Error("الـ API رجّع JSON بس مفيش reply.");
    }

    typing.meta.textContent = '🤖 AI';

    const isLong = reply.length > 800;
    const hasCode = reply.includes("```") || looksLikeHtmlCode(reply);

    // ✅ لو فيه كود: عرض Blocks + زر نسخ
    if(hasCode){
      renderAiWithCode(typing.content, reply);
    } else if(isLong || wantsCode){
      // ✅ لو الرد طويل أو المستخدم طالب كود: اعرضه مرة واحدة (بدون typewriter) عشان ما يقطعش
      typing.content.textContent = reply;
    } else {
      await typewriter(typing.content, reply, 12);
    }

    convo.push({ role:'model', text: reply });
    setStatus("Ready", false);

  }catch(err){
    typing.meta.textContent = '🤖 AI (Error)';
    typing.content.textContent = "حصل خطأ:\n" + (err?.message || err);
    setStatus("Error", false);
    console.error(err);
  }finally{
    sendBtn.disabled = false;
    msgEl.disabled = false;
    msgEl.focus();
  }
}

addBubble('ai', 'أهلاً 👋 ابعت رسالتك وأنا هرد عليك.\nلو طلبت كود، هبعته كامل داخل ``` ``` ومعاه زر النسخ.');
</script>
</body>
</html>
