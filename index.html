<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق إكس برو - Live Realtime</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --primary: #002f34; --accent: #3a77ff; --danger: #eb4d4b; --pi: #ffda00; --bg: #f2f4f5; --surface: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--primary); padding-bottom: 60px; }
        header { background: var(--surface); padding: 12px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; cursor: pointer; }
        .logo span { color: var(--accent); }
        .btn-pi { background: var(--pi); color: #674818; border: none; padding: 10px 18px; border-radius: 50px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        .search-section { margin: 25px 0; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .search-bar { display: flex; gap: 10px; width: 100%; max-width: 800px; }
        .search-input { flex: 1; padding: 12px 20px; border-radius: 50px; border: 1px solid #ddd; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; }

        .fab { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: var(--accent); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 99; cursor: pointer; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .admin-tools { display: flex; gap: 10px; margin-top: 15px; border-top: 2px dashed #eee; padding-top: 15px; }
        .btn-bump { flex: 1; background: #2ed573; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-delete { flex: 1; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:15px;">جاري تشغيل النظام الحي...</p></div>

<header>
    <div class="container nav">
        <a class="logo" onclick="app.fetchAds()">سوق <span>إكس</span></a>
        <div id="authContainer">
            <button class="btn-pi" onclick="app.loginWithPi()"><i class="fab fa-pi"></i> دخول بـ Pi</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث وسيظهر النتائج فوراً..." onkeyup="app.fetchAds()">
        </div>
    </div>
    <div class="grid" id="productGrid"></div>
</div>

<button class="fab" onclick="app.checkAuth()"><i class="fas fa-plus"></i></button>

<div id="detailModal" class="modal"><div class="modal-content" id="detailContent"></div></div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>إضافة إعلان جديد</h3>
        <form id="addForm" style="margin-top:15px;">
            <div class="form-group"><label>العنوان</label><input type="text" id="pName" required></div>
            <div class="form-group"><label>السعر</label><input type="number" id="pPrice" required></div>
            <div class="form-group"><label>القسم</label><select id="pCat"><option value="cars">سيارات</option><option value="electronics">إلكترونيات</option></select></div>
            <div class="form-group"><label>الهاتف</label><input type="tel" id="pPhone" required></div>
            <div class="form-group"><label>الوصف</label><textarea id="pDesc" rows="3" required></textarea></div>
            <div class="form-group"><label>الصورة</label><input type="file" id="pImage" accept="image/*" required></div>
            <button type="submit" class="btn-pi" style="width:100%; background:var(--accent); color:white;" id="submitBtn">نشر الآن</button>
            <button type="button" onclick="toggleModal('addModal', false)" style="width:100%; border:none; background:none; margin-top:10px; cursor:pointer;">إلغاء</button>
        </form>
    </div>
</div>

<script>
    const SB_URL = 'https://xncapmzlwuisupkjlftb.supabase.co';
    const SB_KEY = 'sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS'; 
    const client = supabase.createClient(SB_URL, SB_KEY);
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: false });

    const app = {
        currentUser: null,
        adsData: [],

        async init() {
            this.setupRealtime();
            await this.fetchAds();
            document.getElementById('loader').style.display = 'none';
        },

        // --- ميزة الـ Realtime السحرية ---
        setupRealtime() {
            client
                .channel('public:ads')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'ads' }, payload => {
                    console.log('تغيير مباشر مكتشف:', payload);
                    this.fetchAds(); // تحديث القائمة فوراً عند أي حذف أو إضافة أو تعديل
                })
                .subscribe();
        },

        async loginWithPi() {
            try {
                const auth = await Pi.authenticate(['username'], (pay) => {});
                this.currentUser = auth.user;
                this.updateUI();
            } catch (e) { alert("عذراً، فشل الاتصال بشبكة Pi"); }
        },

        updateUI() {
            if(this.currentUser) {
                document.getElementById('authContainer').innerHTML = `
                    <div style="font-weight:bold; color:var(--primary)">
                        <i class="fas fa-user-circle"></i> ${this.currentUser.username}
                    </div>`;
            }
        },

        async fetchAds() {
            const search = document.getElementById('searchInput').value;
            let query = client.from('ads').select('*').order('updated_at', { ascending: false });
            if (search) query = query.ilike('name', `%${search}%`);
            
            const { data } = await query;
            this.adsData = data || [];
            this.render();
        },

        render() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            this.adsData.forEach(item => {
                grid.innerHTML += `
                    <div class="card" onclick="app.showDetails(${item.id})">
                        <img src="${item.image_url}" class="card-img">
                        <div class="card-body">
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:var(--accent); font-weight:900;">${item.price} ج.م</div>
                            <div style="font-size:11px; color:#999; margin-top:5px;">بواسطة: ${item.seller_user}</div>
                        </div>
                    </div>`;
            });
        },

        async showDetails(id) {
            const item = this.adsData.find(a => a.id === id);
            if(!item) return;

            const isOwner = this.currentUser && this.currentUser.username === item.seller_user;
            const content = document.getElementById('detailContent');
            
            content.innerHTML = `
                <img src="${item.image_url}" style="width:100%; border-radius:10px;">
                <h2 style="margin-top:15px;">${item.name}</h2>
                <h3 style="color:var(--accent);">${item.price} ج.م</h3>
                <p style="margin:10px 0; color:#555;">${item.description}</p>
                <a href="tel:${item.phone}" class="btn-pi" style="width:100%; justify-content:center; background:var(--accent); color:white; text-decoration:none;">اتصال بالبائع</a>

                ${isOwner ? `
                    <div class="admin-tools">
                        <button onclick="app.bumpAd(${item.id})" class="btn-bump"><i class="fas fa-arrow-up"></i> رفع</button>
                        <button onclick="app.deleteAd(${item.id})" class="btn-delete"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                ` : ''}
                <button onclick="toggleModal('detailModal', false)" style="width:100%; border:none; background:none; margin-top:15px; cursor:pointer;">إغلاق</button>
            `;
            toggleModal('detailModal', true);
        },

        async bumpAd(id) {
            const { error } = await client.from('ads').update({ updated_at: new Date() }).eq('id', id);
            if (!error) {
                toggleModal('detailModal', false);
                // لا نحتاج لـ reload، الـ Realtime سيحدث القائمة تلقائياً
            }
        },

        async deleteAd(id) {
            if (confirm("هل تريد حذف هذا الإعلان؟")) {
                const { error } = await client.from('ads').delete().eq('id', id);
                if (!error) toggleModal('detailModal', false);
            }
        },

        checkAuth() {
            if(!this.currentUser) { alert("يرجى تسجيل الدخول بـ Pi أولاً"); this.loginWithPi(); }
            else toggleModal('addModal', true);
        }
    };

    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'جاري الرفع...';

        try {
            const file = document.getElementById('pImage').files[0];
            const name = `${Date.now()}_${file.name}`;
            await client.storage.from('ad_images').upload(name, file);
            const { data: { publicUrl } } = client.storage.from('ad_images').getPublicUrl(name);

            await client.from('ads').insert({
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                description: document.getElementById('pDesc').value,
                phone: document.getElementById('pPhone').value,
                image_url: publicUrl,
                seller_user: app.currentUser.username,
                updated_at: new Date()
            });

            toggleModal('addModal', false);
            document.getElementById('addForm').reset();
        } catch (err) { alert(err.message); }
        btn.disabled = false;
        btn.innerText = 'نشر الآن';
    };

    function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
    app.init();
</script>
</body>
</html>
