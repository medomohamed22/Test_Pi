<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Purple Gemini Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<!-- PDF.js (لإستخراج نص من PDF في المتصفح) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.js"></script>

<style>
:root{
  --p:#7B2FF7; --p2:#9B6DFF;
  --bg:#F6F3FF; --card:#FFFFFF;
  --stroke:#E6E0FF;
  --text:#1F1F2E; --mut:#6B6B85;
  --userBg:#EDE7FF; --aiBg:#FFFFFF;
  --r:18px;
  --shadow: 0 10px 28px rgba(123,47,247,.10);
}
*{box-sizing:border-box;font-family:Tajawal,system-ui}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

header{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
header .title{font-weight:900;font-size:16px}
header .badge{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap
}

.wrap{width:min(980px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column}
.toolbar{
  width:min(980px,100%);margin:10px auto 0;padding:0 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between
}
.panel{
  background:#fff;border:1px solid var(--stroke);box-shadow:var(--shadow);
  border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center
}
.panel label{font-size:12px;color:var(--mut)}
select,input[type="range"]{
  border:1px solid var(--stroke);border-radius:12px;padding:10px;background:#fff;outline:none
}
.btn{
  border:none;border-radius:14px;padding:10px 12px;font-weight:900;cursor:pointer
}
.btn.primary{background:var(--p);color:#fff}
.btn.ghost{background:#f3f0ff;border:1px solid var(--stroke);color:var(--text)}
.btn.danger{background:#fff0f1;border:1px solid #ffd2d6;color:#b4232a}
.btn:disabled{opacity:.6;cursor:not-allowed}

.chat{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}

.bubble{
  max-width:86%;
  border-radius:var(--r);
  padding:12px 14px;
  line-height:1.7;
  box-shadow:var(--shadow);
  border:1px solid var(--stroke);
  position:relative;
  white-space:pre-wrap;
  word-break:break-word;
}
.bubble.user{align-self:flex-start;background:var(--userBg)}
.bubble.ai{align-self:flex-end;background:var(--aiBg)}

.meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:8px;align-items:center}
.bubble.user .meta{justify-content:flex-start}
.bubble.ai .meta{justify-content:flex-end}

.dotTyping{display:inline-flex;gap:4px;align-items:center}
.dotTyping span{
  width:6px;height:6px;border-radius:50%;
  background:var(--p);display:inline-block;
  animation:bounce 1s infinite ease-in-out;opacity:.75
}
.dotTyping span:nth-child(2){animation-delay:.12s}
.dotTyping span:nth-child(3){animation-delay:.24s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-5px);opacity:1}}

footer{background:var(--card);border-top:1px solid var(--stroke);padding:12px}
.composer{width:min(980px,100%);margin:0 auto;display:flex;gap:10px;align-items:flex-end;padding:0 2px}
textarea{
  flex:1;resize:none;min-height:46px;max-height:160px;
  padding:12px;border-radius:16px;border:1px solid var(--stroke);
  outline:none;font-size:15px;background:#fff
}
.smallHint{width:min(980px,100%);margin:8px auto 0;color:var(--mut);font-size:12px;padding:0 12px}

.attachRow{
  width:min(980px,100%);
  margin:0 auto;
  padding:0 12px 10px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between
}
.fileChip{
  display:inline-flex;gap:8px;align-items:center;
  background:#fff;border:1px solid var(--stroke);border-radius:999px;padding:8px 10px;
  box-shadow:var(--shadow);font-size:12px;color:var(--mut)
}
.fileChip b{color:var(--text)}
.kbd{
  background:#f3f0ff;border:1px solid var(--stroke);border-bottom-width:2px;
  padding:2px 6px;border-radius:8px;font-size:11px
}
</style>
</head>

<body>
<header>
  <div class="title">💜 Purple Gemini Chat</div>
  <div class="badge" id="status">● Ready</div>
</header>

<!-- Toolbar (Features 1,2,7 + file) -->
<div class="toolbar">
  <div class="panel">
    <label>شخصية AI</label>
    <select id="persona">
      <option value="helper">مساعد عام</option>
      <option value="pi_dev">مساعد مطور Pi Network</option>
      <option value="teacher">مدرس</option>
      <option value="coder">مبرمج</option>
      <option value="marketer">مسوّق</option>
    </select>

    <label>طول الرد</label>
    <select id="lenLevel">
      <option value="short">مختصر</option>
      <option value="medium" selected>متوسط</option>
      <option value="long">تفصيلي</option>
    </select>

    <label>إبداع</label>
    <input id="temp" type="range" min="0" max="100" value="35" />
    <span id="tempVal" style="font-size:12px;color:var(--mut)">0.35</span>
  </div>

  <div class="panel">
    <button class="btn ghost" id="btnLoad">استرجاع المحادثة</button>
    <button class="btn danger" id="btnClear">مسح المحادثة</button>
    <button class="btn ghost" id="btnExport">تصدير JSON</button>
  </div>
</div>

<!-- Attachments row (Feature 6) -->
<div class="attachRow">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label class="btn ghost" style="display:inline-flex;align-items:center;gap:8px">
      📎 رفع ملف (TXT/PDF)
      <input id="file" type="file" accept=".txt,.md,.json,application/pdf" style="display:none">
    </label>
    <div id="fileChipWrap" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

  <div style="font-size:12px;color:var(--mut)">
    أوامر: <span class="kbd">/code</span> <span class="kbd">/translate</span> <span class="kbd">/explain</span> <span class="kbd">/short</span> <span class="kbd">/long</span>
  </div>
</div>

<div class="wrap">
  <div class="chat" id="chat"></div>

  <footer>
    <div class="composer">
      <textarea id="msg" placeholder="اكتب رسالتك... (Enter إرسال / Shift+Enter سطر جديد)" rows="1"></textarea>
      <button id="sendBtn" class="btn primary" type="button">إرسال</button>
      <button id="regenBtn" class="btn ghost" type="button" disabled>إعادة توليد</button>
      <button id="stopBtn" class="btn ghost" type="button" disabled>إيقاف</button>
    </div>
    <div class="smallHint">
      نصيحة: لو كتبت <span class="kbd">/code</span> قبل السؤال، الرد هيكون كود منسق.  
      Enter لإرسال — Shift+Enter لسطر جديد.
    </div>
  </footer>
</div>

<script>
/* ========= State ========= */
const chat = document.getElementById('chat');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('sendBtn');
const regenBtn = document.getElementById('regenBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');

const personaEl = document.getElementById('persona');
const lenLevelEl = document.getElementById('lenLevel');
const tempEl = document.getElementById('temp');
const tempValEl = document.getElementById('tempVal');

const fileEl = document.getElementById('file');
const fileChipWrap = document.getElementById('fileChipWrap');

const btnLoad = document.getElementById('btnLoad');
const btnClear = document.getElementById('btnClear');
const btnExport = document.getElementById('btnExport');

let convo = []; // {role:'user'|'model', text:'...'}
let attachments = []; // {name, type, text}
let aborter = null; // للـ streaming

const LS_KEY = "purple_gemini_chat_v1";

/* ========= UI Helpers ========= */
function setStatus(text, busy=false){
  statusEl.textContent = "● " + text;
  statusEl.style.opacity = busy ? 0.9 : 1;
}

function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');

  const content = document.createElement('div');
  content.className = 'content';
  content.textContent = text || '';

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = (role === 'user') ? '👤 أنت' : '🤖 AI';

  b.appendChild(content);
  b.appendChild(meta);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return { b, content, meta };
}

function addTypingBubble(){
  const b = document.createElement('div');
  b.className = 'bubble ai';

  const content = document.createElement('div');
  content.className = 'content';
  content.innerHTML = `<span class="dotTyping"><span></span><span></span><span></span></span>`;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = '🤖 AI يكتب...';

  b.appendChild(content);
  b.appendChild(meta);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return { b, content, meta };
}

function autosize(){
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 160) + 'px';
}
msgEl.addEventListener('input', autosize);
autosize();

msgEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', send);
regenBtn.addEventListener('click', regenerate);
stopBtn.addEventListener('click', stopStream);

tempEl.addEventListener('input', ()=>{
  tempValEl.textContent = (Number(tempEl.value)/100).toFixed(2);
});

/* ========= Feature 2: LocalStorage Save/Load ========= */
function saveChat(){
  const payload = {
    convo,
    attachments,
    persona: personaEl.value,
    lenLevel: lenLevelEl.value,
    temp: Number(tempEl.value)
  };
  localStorage.setItem(LS_KEY, JSON.stringify(payload));
}
function loadChat(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw) return false;
  const data = JSON.parse(raw);
  convo = Array.isArray(data.convo) ? data.convo : [];
  attachments = Array.isArray(data.attachments) ? data.attachments : [];
  personaEl.value = data.persona || personaEl.value;
  lenLevelEl.value = data.lenLevel || lenLevelEl.value;
  tempEl.value = (typeof data.temp === 'number') ? data.temp : tempEl.value;
  tempValEl.textContent = (Number(tempEl.value)/100).toFixed(2);

  chat.innerHTML = "";
  renderAttachments();
  if(convo.length === 0){
    addBubble('ai', 'تم الاسترجاع ✅ لكن المحادثة كانت فاضية.');
  } else {
    for(const m of convo){
      addBubble(m.role === 'user' ? 'user' : 'ai', m.text);
    }
  }
  regenBtn.disabled = !hasLastUserMessage();
  return true;
}
btnLoad.addEventListener('click', ()=>{
  const ok = loadChat();
  if(!ok) alert("مفيش محادثة محفوظة لسه.");
});
btnClear.addEventListener('click', ()=>{
  if(!confirm("متأكد تمسح المحادثة؟")) return;
  convo = [];
  attachments = [];
  chat.innerHTML = "";
  renderAttachments();
  localStorage.removeItem(LS_KEY);
  regenBtn.disabled = true;
  addBubble('ai','اتمسحت المحادثة ✅');
});
btnExport.addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({convo, attachments}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "chat_export.json";
  a.click();
  URL.revokeObjectURL(url);
});

/* ========= Feature 6: File Upload TXT/PDF ========= */
function renderAttachments(){
  fileChipWrap.innerHTML = "";
  for(let i=0;i<attachments.length;i++){
    const f = attachments[i];
    const chip = document.createElement('div');
    chip.className = 'fileChip';
    chip.innerHTML = `📄 <b>${escapeHtml(f.name)}</b> <span>(${escapeHtml(f.type)})</span>
      <button class="btn ghost" style="padding:6px 10px;border-radius:999px" data-i="${i}">حذف</button>`;
    chip.querySelector('button').addEventListener('click', (e)=>{
      const idx = Number(e.target.getAttribute('data-i'));
      attachments.splice(idx, 1);
      renderAttachments();
      saveChat();
    });
    fileChipWrap.appendChild(chip);
  }
}

fileEl.addEventListener('change', async ()=>{
  const file = fileEl.files?.[0];
  if(!file) return;

  try{
    setStatus("Reading file...", true);

    if(file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")){
      // PDF -> استخراج نص عبر PDF.js
      const arr = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arr }).promise;
      let text = "";
      const maxPages = Math.min(pdf.numPages, 12); // حماية
      for(let p=1;p<=maxPages;p++){
        const page = await pdf.getPage(p);
        const c = await page.getTextContent();
        const pageText = c.items.map(it => it.str).join(" ");
        text += `\n[Page ${p}] ${pageText}\n`;
      }
      attachments.push({ name:file.name, type:"pdf", text: text.trim().slice(0, 18000) });
    } else {
      // TXT/MD/JSON
      const t = await file.text();
      attachments.push({ name:file.name, type:"text", text: t.trim().slice(0, 18000) });
    }

    renderAttachments();
    saveChat();
    setStatus("Ready", false);
  }catch(e){
    console.error(e);
    setStatus("File error", false);
    alert("حصل خطأ في قراءة الملف.");
  }finally{
    fileEl.value = "";
  }
});

/* ========= Feature 5: Slash Commands ========= */
function applySlashCommand(input){
  const t = input.trim();
  if(!t.startsWith("/")) return { cmd:null, text: input };

  const firstSpace = t.indexOf(" ");
  const cmd = (firstSpace === -1 ? t : t.slice(0, firstSpace)).toLowerCase();
  const rest = (firstSpace === -1 ? "" : t.slice(firstSpace+1));

  const map = {
    "/code": "أجب بكود فقط قدر الإمكان مع شرح بسيط قبل الكود لو لزم.",
    "/translate": "ترجم النص التالي ترجمة دقيقة مع الحفاظ على المعنى:",
    "/explain": "اشرح الفكرة ببساطة وبأمثلة صغيرة:",
    "/short": "اجعل الرد مختصر جدًا في 3-5 سطور:",
    "/long": "اجعل الرد تفصيلي ومنظم بعناوين:"
  };

  if(map[cmd]){
    return { cmd, text: rest, cmdPrompt: map[cmd] };
  }
  return { cmd, text: input };
}

/* ========= Feature 1 + 7: Persona + Length Settings ========= */
function personaPrompt(persona){
  switch(persona){
    case "pi_dev":
      return "أنت مساعد خبير في تطوير تطبيقات Pi Network (Pi SDK, Pi API, مدفوعات, Pi Browser) وتفهم Supabase وVercel وتقدم حلول عملية بكود واضح.";
    case "teacher":
      return "أنت مدرس صبور يشرح خطوة بخطوة وبأسلوب بسيط مع أمثلة.";
    case "coder":
      return "أنت مبرمج محترف. أعطِ حلول عملية مع كود منظم وملاحظات قصيرة.";
    case "marketer":
      return "أنت مسوّق ذكي. اعطِ أفكار تسويق ونصوص إعلانية وخطط نمو بشكل عملي.";
    default:
      return "أنت مساعد عام مفيد ودقيق.";
  }
}
function lengthConfig(level){
  // tokens تقريبية
  if(level === "short") return { maxOutputTokens: 220, style: "الرد يكون مختصر ومباشر." };
  if(level === "long")  return { maxOutputTokens: 900, style: "الرد يكون تفصيلي ومنظم بعناوين." };
  return { maxOutputTokens: 450, style: "الرد متوسط الطول ومنظم." };
}

/* ========= Feature 4: Regenerate ========= */
function hasLastUserMessage(){
  for(let i=convo.length-1;i>=0;i--){
    if(convo[i].role === "user") return true;
  }
  return false;
}
function getLastUserIndex(){
  for(let i=convo.length-1;i>=0;i--){
    if(convo[i].role === "user") return i;
  }
  return -1;
}
async function regenerate(){
  // يعيد آخر سؤال (ويحذف آخر رد AI إن موجود بعده)
  const idx = getLastUserIndex();
  if(idx === -1) return;

  // احذف أي رسائل model بعد آخر user
  convo = convo.slice(0, idx+1);

  // ارسم من جديد
  chat.innerHTML = "";
  renderAttachments();
  for(const m of convo){
    addBubble(m.role === "user" ? "user" : "ai", m.text);
  }
  saveChat();

  // ابعت نفس آخر رسالة تاني
  await send(convo[idx].text, true);
}

/* ========= Feature 3: Streaming ========= */
function stopStream(){
  if(aborter){
    aborter.abort();
    aborter = null;
    setStatus("Stopped", false);
    stopBtn.disabled = true;
  }
}

/* ========= Core Send ========= */
async function send(forcedText=null, isRegen=false){
  const raw = forcedText ?? (msgEl.value || '');
  const original = raw.trim();
  if(!original) return;

  // Slash command parse
  const cmdData = applySlashCommand(original);
  const userText = (cmdData.text || "").trim();
  const cmdPrompt = cmdData.cmdPrompt || null;

  if(!userText){
    addBubble('ai', 'اكتب نص بعد الأمر مثل: /code اكتب لي كود...');
    return;
  }

  // لو مش regenerate، سجل الرسالة وامسح textarea
  if(!isRegen){
    addBubble('user', original); // نعرض النص كما كتبه (بأمره لو موجود)
    convo.push({ role:'user', text: original });
    msgEl.value = '';
    autosize();
  } else {
    // regenerate: لا نضيف user جديد، آخر user موجود بالفعل
  }

  regenBtn.disabled = !hasLastUserMessage();
  saveChat();

  sendBtn.disabled = true;
  msgEl.disabled = true;
  regenBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus("Streaming...", true);

  // Bubble AI
  const aiBubble = addBubble('ai', ''); // فاضي ونملأه streaming
  aiBubble.meta.textContent = '🤖 AI يكتب...';

  // build payload
  const temp = Number(tempEl.value)/100;
  const len = lengthConfig(lenLevelEl.value);

  // attachments as context
  let filesContext = "";
  if(attachments.length){
    const chunks = attachments.map(f => `--- FILE: ${f.name} (${f.type}) ---\n${f.text}`).join("\n\n");
    filesContext = `\n\n[مرفقات من المستخدم]\n${chunks}\n\n[نهاية المرفقات]\n`;
  }

  const systemText =
    personaPrompt(personaEl.value) +
    "\n" + len.style +
    "\nإذا احتجت كود، اجعله منسق وواضح." +
    (cmdPrompt ? ("\nتعليمات إضافية: " + cmdPrompt) : "");

  // history: نبعث المحادثة كـ user/model نص فقط (بدون تعديل عرض المستخدم)
  // نعيد بناء history منظمة: نمر على convo ونحوله لسياق
  const history = convo.map(m => ({ role:m.role, text:m.text }));

  // message النهائي: نص المستخدم + المرفقات
  const finalUserMessage =
    (cmdPrompt ? (cmdPrompt + "\n\n") : "") +
    userText +
    (filesContext ? ("\n\n" + filesContext) : "");

  aborter = new AbortController();

  try{
    const res = await fetch('/api/chat-stream', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        system: systemText,
        message: finalUserMessage,
        history,
        temperature: temp,
        maxOutputTokens: len.maxOutputTokens
      }),
      signal: aborter.signal
    });

    if(!res.ok){
      const t = await res.text();
      throw new Error("API Error: " + t.slice(0, 500));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let full = "";

    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value, { stream:true });
      // السيرفر بيبعت JSON lines: {"delta":"..."}\n
      const lines = chunk.split("\n").filter(Boolean);
      for(const line of lines){
        try{
          const obj = JSON.parse(line);
          if(obj.delta){
            full += obj.delta;
            aiBubble.content.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          }
          if(obj.done){
            // ignore
          }
        }catch{
          // ignore junk
        }
      }
    }

    aiBubble.meta.textContent = "🤖 AI";
    if(full.trim().length === 0){
      aiBubble.content.textContent = "مفيش رد اتبعت من السيرفر.";
    }

    // سجل رد الذكاء الاصطناعي في convo (بعد آخر user)
    // لو regenerate: نضيف model واحد
    convo.push({ role:'model', text: full });
    saveChat();

    setStatus("Ready", false);
  }catch(err){
    if(err?.name === "AbortError"){
      aiBubble.meta.textContent = "🤖 AI (متوقف)";
      if(!aiBubble.content.textContent.trim()){
        aiBubble.content.textContent = "تم إيقاف الرد.";
      }
      setStatus("Stopped", false);
    } else {
      console.error(err);
      aiBubble.meta.textContent = "🤖 AI (Error)";
      aiBubble.content.textContent = "حصل خطأ:\n" + (err?.message || err);
      setStatus("Error", false);
    }
  }finally{
    aborter = null;
    sendBtn.disabled = false;
    msgEl.disabled = false;
    regenBtn.disabled = !hasLastUserMessage();
    stopBtn.disabled = true;
    msgEl.focus();
  }
}

/* ========= Small Utils ========= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
