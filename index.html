<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pi Startups | Innovation Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #6f2fa0;
      --primary-gradient: linear-gradient(135deg, #6f2fa0 0%, #a044ff 100%);
      --accent: #fbce3a;
      --bg-body: #f8faff;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --glass: rgba(255, 255, 255, 0.9);
      --shadow: 0 15px 35px rgba(111, 47, 160, 0.1);
      --radius: 24px;
    }

    * { box-sizing: border-box; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    
    body { 
      margin: 0; 
      font-family: 'Tajawal', sans-serif; 
      background-color: var(--bg-body); 
      color: var(--text-main); 
      line-height: 1.6;
    }

    header { 
      background: var(--glass); 
      backdrop-filter: blur(20px); 
      position: sticky; top: 0; z-index: 1000; 
      border-bottom: 1px solid rgba(111, 47, 160, 0.05); 
      padding: 15px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    
    .container { width: 92%; max-width: 1200px; margin: 0 auto; }
    .nav-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    
    .logo { 
      font-weight: 900; font-size: 28px; color: var(--primary); 
      display: flex; align-items: center; gap: 10px; 
      letter-spacing: -0.5px;
    }

    .nav-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .lang-btn { 
      background: #fff; border: 1.5px solid var(--primary); color: var(--primary); 
      padding: 10px 20px; border-radius: 50px; cursor: pointer; 
      font-size: 14px; font-weight: 700; min-width: 100px;
    }
    .lang-btn:hover { background: var(--primary); color: #fff; }

    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { 
      width: 42px; height: 42px; border-radius: 50%; 
      background: var(--primary-gradient); color: #fff; 
      display: flex; align-items: center; justify-content: center; 
      font-weight: 900; font-size: 18px; 
    }

    .btn { 
      padding: 16px 32px; border-radius: 18px; border: none; 
      font-weight: 700; cursor: pointer; display: inline-flex; 
      align-items: center; justify-content: center; gap: 10px; 
      font-family: 'Tajawal'; font-size: 16px; min-height: 52px;
    }
    .btn-primary { 
      background: var(--primary-gradient); color: #fff; 
      box-shadow: 0 8px 20px rgba(111, 47, 160, 0.25);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(111, 47, 160, 0.35); }
    
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-danger { background: #fff1f1; color: #ff4757; font-size: 14px; }

    .hero { text-align: center; padding: 60px 0 40px; animation: fadeIn 1s ease; }
    .hero h1 { 
      font-size: 42px; font-weight: 900; margin-bottom: 15px;
      background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 30px; padding-bottom: 50px;
    }
    
    .card { 
      background: #fff; border-radius: var(--radius); padding: 25px; 
      box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(111, 47, 160, 0.15); }
    
    .equity-tag { 
      background: #fff9db; color: #f08c00; padding: 8px 15px; 
      border-radius: 12px; font-weight: 800; font-size: 13px; 
      border: 1px solid #ffe066; margin: 15px 0; display: block; text-align: center;
    }

    .category-badge { 
      background: rgba(111, 47, 160, 0.08); color: var(--primary); 
      padding: 5px 14px; border-radius: 10px; font-size: 12px; font-weight: 700;
    }

    .progress-container { margin: 20px 0; }
    .progress-bar-bg { height: 12px; background: #eff2f7; border-radius: 10px; overflow: hidden; }
    .progress-fill { 
      height: 100%; background: var(--primary-gradient); 
      border-radius: 10px; width: 0%;
    }

    .owner-actions { 
      display: flex; 
      gap: 12px; 
      margin-top: 15px; 
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 2000;
      padding: 20px;
    }
    .form-card { 
      background: #fff; padding: 40px; border-radius: 30px; 
      width: 100%; max-width: 550px; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    
    input, textarea { 
      width: 100%; padding: 15px; border: 1.5px solid #eee; 
      border-radius: 15px; margin-bottom: 20px; font-family: 'Tajawal';
      font-size: 15px; background: #fcfcfc;
    }
    input:focus, textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(111, 47, 160, 0.1); }

    #toast { 
      visibility: hidden; position: fixed; bottom: 30px; left: 50%; 
      transform: translateX(-50%); background: #2d3436; color: #fff; 
      padding: 15px 35px; border-radius: 50px; z-index: 9999; font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #toast.show { visibility: visible; animation: slideUp 0.4s ease forwards; }
    @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }

    @media (max-width: 768px) {
      .hero { padding: 50px 0 30px; }
      .hero h1 { font-size: 36px; }
      .hero p { font-size: 17px; }
      .btn { padding: 18px 32px; font-size: 16px; }
      .card { padding: 20px; }
      .grid-container { gap: 20px; }
      .nav-content { flex-direction: column; align-items: flex-start; }
      .nav-controls { width: 100%; justify-content: space-between; }
      .form-card { padding: 30px 20px; }
      .lang-btn { padding: 12px 24px; font-size: 15px; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 32px; }
      .logo { font-size: 24px; }
      .btn { padding: 18px 24px; font-size: 15px; }
    }

    body.ltr { direction: ltr; text-align: left; }
    body.ltr .nav-content { flex-direction: row; }
  </style>
</head>
<body id="mainBody">

<header>
  <div class="container nav-content">
    <div class="logo">π <span id="logoText">Startups</span></div>
    <div class="nav-controls">
      <button class="lang-btn" onclick="toggleLanguage()" id="langSwitcher">English</button>
      <div id="auth-area">
        <button class="btn btn-primary" onclick="authenticateUser()" id="loginBtn">دخول عبر Pi</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1 id="heroTitle">استثمر في مستقبل الابتكار</h1>
    <p id="heroSub">المنصة الأولى لدعم مشاريع مجتمع Pi وتحويل الأفكار إلى شركات واقعية.</p>
    <button class="btn btn-primary" onclick="openModal()" id="startBtn">إطلاق حملة استثمارية</button>
  </section>

  <div class="grid-container" id="projects-grid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="form-card">
    <h2 id="formTitle">إعداد حملة التمويل</h2>
    <input type="hidden" id="edit-id">
    <input type="text" id="pName" placeholder="اسم المشروع">
    <input type="text" id="pCategory" placeholder="المجال (تكنولوجيا، زراعة..)">
    <textarea id="pDesc" placeholder="اشرح فكرتك والعوائد للمستثمرين..." style="height:100px;"></textarea>
    
    <div style="display:flex; gap:15px; margin-bottom:10px">
      <div style="flex:1">
        <label id="labelGoal" style="font-size:12px; font-weight:bold; display:block; margin-bottom:5px">الهدف المطلوب (Pi)</label>
        <input type="number" id="pGoal" min="1">
      </div>
      <div style="flex:1">
        <label id="labelEquity" style="font-size:12px; font-weight:bold; display:block; margin-bottom:5px">نسبة الأسهم للداعمين (%)</label>
        <input type="number" id="pEquity" min="0" max="100">
      </div>
    </div>
    
    <button class="btn btn-primary" style="width:100%" onclick="saveProject()" id="submitBtn">نشر المشروع الآن</button>
    <button class="btn" style="width:100%; margin-top:10px; color:var(--text-muted)" onclick="closeModal()" id="cancelBtn">إغلاق</button>
  </div>
</div>

<div id="toast"></div>

<script>
  const langData = {
    ar: { 
      login: "دخول عبر Pi", 
      heroT: "استثمر في مستقبل الابتكار", 
      heroS: "المنصة الأولى لدعم مشاريع مجتمع Pi وتحويل الأفكار إلى شركات واقعية.", 
      start: "إطلاق حملة استثمارية", 
      formT: "إعداد حملة التمويل", 
      goalL: "الهدف المطلوب (Pi)", 
      equityL: "نسبة الأسهم للداعمين (%)", 
      submitB: "نشر المشروع الآن", 
      cancel: "إغلاق",
      equityT: "💎 حصة الأسهم للداعم:", 
      raisedT: "تم جمع", 
      targetT: "الهدف:", 
      byT: "بواسطة:", 
      investB: "استثمر Pi الآن", 
      editB: "تعديل", 
      delB: "حذف", 
      promptAmt: "أدخل كمية Pi التي تود استثمارها في ", 
      welcome: "أهلاً بك، ", 
      success: "تم بنجاح!" 
    },
    en: { 
      login: "Login with Pi", 
      heroT: "Invest in the Future", 
      heroS: "The premier platform for supporting Pi community projects and building real startups.", 
      start: "Launch Campaign", 
      formT: "Setup Funding Campaign", 
      goalL: "Target Goal (Pi)", 
      equityL: "Equity for Backers (%)", 
      submitB: "Publish Project Now", 
      cancel: "Close",
      equityT: "💎 Backer Equity Share:", 
      raisedT: "Raised", 
      targetT: "Target:", 
      byT: "By:", 
      investB: "Invest Pi Now", 
      editB: "Edit", 
      delB: "Delete", 
      promptAmt: "Enter Pi amount to invest in ", 
      welcome: "Welcome, ", 
      success: "Success!" 
    }
  };
  
  let currentLang = 'ar';
  let currentUser = null;

  // Supabase
  const _URL = "https://xncapmzlwuisupkjlftb" + ".supabase.co";
  const _KEY = "sb_publishable_zPECXAiI" + "_bDbeLtRYe3vIw_IEt_p_AS";
  const supa = window.supabase.createClient(_URL, _KEY);

  // Pi SDK - Production mode (sandbox: false) مع ربط بالـ backend
  if (window.Pi) { window.Pi.init({ version: "2.0", sandbox: false }); }

  // دالة لمعالجة الدفعات غير المكتملة (عند تسجيل الدخول)
  function onIncompletePaymentFound(payment) {
    // إرسال الدفعة غير المكتملة إلى الـ backend للإكمال
    fetch("/api/pi/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        paymentId: payment.identifier,
        txid: payment.transaction?.txid || null
      })
    }).catch(err => console.error("Incomplete payment error:", err));
  }

  async function authenticateUser() {
    try {
      const auth = await window.Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
      currentUser = auth.user;
      document.getElementById('auth-area').innerHTML = `
        <div class="user-profile">
          <div class="user-avatar">${currentUser.username[0].toUpperCase()}</div>
          <span style="font-weight:700">@${currentUser.username}</span>
        </div>`;
      await supa.from("pi_users").upsert({ pi_uid: currentUser.uid, username: currentUser.username });
      showToast(langData[currentLang].welcome + currentUser.username);
      fetchProjects();
      updateLanguageTexts();
    } catch (err) { 
      console.error(err);
      showToast("يرجى استخدام متصفح Pi Browser الرسمي");
    }
  }

  async function fetchProjects() {
    const { data } = await supa.from("projects").select("*").order("created_at", { ascending: false });
    const grid = document.getElementById("projects-grid");
    grid.innerHTML = "";
    const t = langData[currentLang];

    data.forEach(p => {
      const raised = Number(p.raised_pi) || 0;
      const goal = Number(p.goal_pi) || 1;
      const pct = Math.min(100, Math.floor((raised / goal) * 100));
      const isOwner = currentUser && (p.owner_pi_uid === currentUser.uid);

      grid.innerHTML += `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center">
            <span class="category-badge">${p.category}</span>
            <span style="font-size:10px; color:#999">${new Date(p.created_at).toLocaleDateString()}</span>
          </div>
          <h3 style="margin:15px 0 10px; font-size:20px">${p.name}</h3>
          <p style="font-size:14px; color:var(--text-muted); height:45px; overflow:hidden">${p.description}</p>
          <div class="equity-tag">${t.equityT} ${p.equity_pct}%</div>
          <div class="progress-container">
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px">
              <span><b>${raised} π</b> ${t.raisedT}</span>
              <span style="color:var(--primary); font-weight:bold">${pct}%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div style="font-size:11px; color:#999; margin-top:8px">${t.targetT} ${goal} Pi | ${t.byT} ${p.owner_username}</div>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="supportProject('${p.id}', '${p.name}')">${t.investB}</button>
          ${isOwner ? `
            <div class="owner-actions">
              <button class="btn btn-outline" onclick="editProject('${p.id}')">${t.editB}</button>
              <button class="btn btn-danger" onclick="deleteProject('${p.id}')">${t.delB}</button>
            </div>` : ''}
        </div>`;
    });
  }

  async function supportProject(projectId, projectName) {
    if (!currentUser) return authenticateUser();
    
    const amountStr = prompt(langData[currentLang].promptAmt + projectName);
    const amount = Number(amountStr);
    
    if (!amountStr || isNaN(amount) || amount <= 0) {
      showToast("أدخل مبلغًا صحيحًا");
      return;
    }

    try {
      const payment = await window.Pi.createPayment(
        {
          amount: amount,
          memo: `استثمار في مشروع: ${projectName}`,
          metadata: { projectId: projectId, investor_uid: currentUser.uid }
        },
        {
          // طلب موافقة السيرفر
          onReadyForServerApproval: async (paymentId) => {
            await fetch("/api/pi/approve", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ paymentId })
            });
          },
          // إكمال الدفع بعد التحقق من السيرفر
          onReadyForServerCompletion: async (paymentId, txid) => {
            const response = await fetch("/api/pi/complete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ paymentId, txid })
            });
            
            if (response.ok) {
              showToast(langData[currentLang].success);
              fetchProjects(); // تحديث القائمة بعد الدفع الناجح
            } else {
              showToast("فشل في إكمال الدفع");
            }
          },
          onCancel: () => showToast("تم إلغاء الدفع"),
          onError: (error) => {
            console.error(error);
            showToast("خطأ في الدفع: " + error.message);
          }
        }
      );
    } catch (err) {
      console.error(err);
      showToast("خطأ في بدء الدفع");
    }
  }

  async function saveProject() {
    if (!currentUser) return authenticateUser();
    
    const id = document.getElementById('edit-id').value;
    const projectData = {
      name: document.getElementById('pName').value.trim(),
      category: document.getElementById('pCategory').value.trim(),
      description: document.getElementById('pDesc').value.trim(),
      goal_pi: Number(document.getElementById('pGoal').value),
      equity_pct: Number(document.getElementById('pEquity').value),
      owner_pi_uid: currentUser.uid,
      owner_username: currentUser.username,
      raised_pi: id ? undefined : 0  // لا نغير raised_pi عند التعديل
    };

    if (!projectData.name || !projectData.category || !projectData.description || !projectData.goal_pi) {
      showToast("يرجى ملء جميع الحقول");
      return;
    }

    const { error } = id 
      ? await supa.from("projects").update(projectData).eq("id", id)
      : await supa.from("projects").insert(projectData);

    if (!error) { 
      showToast(langData[currentLang].success);
      closeModal(); 
      fetchProjects(); 
    } else {
      showToast("حدث خطأ، حاول مرة أخرى");
    }
  }

  // باقي الدوال (edit, delete, language, modal, toast) كما هي...
  function editProject(id) {
    supa.from("projects").select("*").eq("id", id).single().then(({data, error}) => {
      if (error || !data) return;
      document.getElementById('edit-id').value = data.id;
      document.getElementById('pName').value = data.name;
      document.getElementById('pCategory').value = data.category;
      document.getElementById('pDesc').value = data.description;
      document.getElementById('pGoal').value = data.goal_pi;
      document.getElementById('pEquity').value = data.equity_pct;
      openModal();
    });
  }

  async function deleteProject(id) {
    if (confirm(langData[currentLang].delB + "?")) { 
      await supa.from("projects").delete().eq("id", id); 
      fetchProjects(); 
    }
  }

  function updateLanguageTexts() {
    const t = langData[currentLang];
    document.getElementById('heroTitle').innerText = t.heroT;
    document.getElementById('heroSub').innerText = t.heroS;
    document.getElementById('startBtn').innerText = t.start;
    document.getElementById('formTitle').innerText = t.formT;
    document.getElementById('labelGoal').innerText = t.goalL;
    document.getElementById('labelEquity').innerText = t.equityL;
    document.getElementById('submitBtn').innerText = t.submitB;
    document.getElementById('cancelBtn').innerText = t.cancel;

    const loginBtn = document.getElementById('loginBtn');
    if (loginBtn) loginBtn.innerText = t.login;
  }

  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.getElementById('mainBody').className = currentLang === 'en' ? 'ltr' : '';
    document.getElementById('mainBody').dir = currentLang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('langSwitcher').innerText = currentLang === 'en' ? 'العربية' : 'English';
    
    updateLanguageTexts();
    fetchProjects();
  }

  function openModal() { 
    document.getElementById('modalOverlay').style.display = 'flex'; 
    updateLanguageTexts();
  }
  function closeModal() { 
    document.getElementById('modalOverlay').style.display = 'none'; 
    document.getElementById('edit-id').value = '';
    document.getElementById('pName').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pGoal').value = '';
    document.getElementById('pEquity').value = '';
  }
  
  function showToast(m) { 
    const t = document.getElementById("toast"); 
    t.innerText = m; 
    t.className = "show"; 
    setTimeout(() => t.className = "", 3000); 
  }

  updateLanguageTexts();
  fetchProjects();
</script>
</body>
</html>
