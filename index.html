<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Login Only</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    *{box-sizing:border-box;font-family:Tahoma,Arial}
    body{
      margin:0; color:#1f1230; background:#f4f0ff;
      min-height:100vh; display:flex; flex-direction:column;
    }

    header{
      background:#6a1b9a; color:#fff;
      padding:14px 16px;
      display:flex; justify-content:space-between; align-items:center;
      box-shadow:0 10px 25px rgba(0,0,0,.18);
      position:sticky; top:0; z-index:10;
    }
    .brand{display:flex; gap:10px; align-items:center}
    .logo{font-size:22px}
    .title{font-weight:900}
    .sub{font-size:12px; opacity:.9}

    main{flex:1; display:flex; align-items:center; justify-content:center; padding:18px}
    .card{
      width:min(520px, 94vw);
      background:#fff; border-radius:16px;
      border:1px solid rgba(106,27,154,.14);
      box-shadow:0 14px 40px rgba(0,0,0,.10);
      padding:16px;
    }
    .row{display:flex; gap:10px; flex-wrap:wrap}
    .btn{
      border:none; cursor:pointer;
      padding:11px 14px; border-radius:12px;
      font-weight:800;
      background:#6a1b9a; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
      transition:.15s transform;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn-ghost{
      background:#fff; color:#6a1b9a;
      border:1px solid rgba(106,27,154,.22);
      box-shadow:none;
    }

    .hint{
      margin-top:10px; font-size:12.5px; line-height:1.7;
      color:rgba(31,18,48,.75);
      background:#faf7ff;
      border:1px dashed rgba(106,27,154,.22);
      padding:10px; border-radius:12px;
    }

    .profile{
      display:flex; gap:12px; align-items:center;
      padding:12px; border-radius:14px;
      background:#faf7ff;
      border:1px solid rgba(106,27,154,.12);
      margin:12px 0;
    }
    .avatar{
      width:54px; height:54px; border-radius:50%;
      border:2px solid rgba(106,27,154,.25);
      background:#fff;
    }
    .name{font-weight:900; color:#4a1770}
    .meta{font-size:12px; opacity:.78; margin-top:2px}
    code{
      display:block;
      padding:10px; border-radius:12px;
      background:#0f0b18; color:#e9ddff;
      overflow:auto; font-size:12px;
      border:1px solid rgba(255,255,255,.10);
      margin-top:10px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      font-size:12px; font-weight:800;
      border:1px solid rgba(106,27,154,.18);
      background:#fff; color:#4a1770;
    }
    .ok{color:#1b7a3a}
    .bad{color:#b42318}

    .top-actions{display:flex; gap:10px; align-items:center}
    .mini{
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.28);
      color:#fff;
      padding:8px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
    }

    @media (max-width:520px){
      header{flex-direction:column; align-items:stretch; gap:10px}
      .top-actions{justify-content:space-between}
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">💜</div>
      <div>
        <div class="title">Pi Login Only</div>
        <div class="sub">تسجيل دخول بـ Pi SDK فقط (sandbox: false)</div>
      </div>
    </div>

    <div class="top-actions">
      <span id="piState" class="badge">Pi: ...</span>
      <button class="mini" id="copyUidBtn" title="نسخ UID" style="display:none">نسخ UID</button>
    </div>
  </header>

  <main>
    <div class="card">

      <div class="row">
        <button class="btn" id="loginBtn">دخول عبر Pi</button>
        <button class="btn btn-ghost" id="logoutBtn" style="display:none">تسجيل خروج</button>
      </div>

      <div class="hint" id="hintBox">
        ✅ لازم تفتح الصفحة من <b>Pi Browser</b> علشان تسجيل الدخول يشتغل.<br>
        ✅ وضع التشغيل: <b>Production (sandbox: false)</b>
      </div>

      <div id="profileBox" class="profile" style="display:none">
        <img id="avatar" class="avatar" src="https://ui-avatars.com/api/?name=Pi" alt="avatar" />
        <div>
          <div class="name" id="username">—</div>
          <div class="meta" id="userid">—</div>
        </div>
      </div>

      <code id="rawBox" style="display:none"></code>

    </div>
  </main>

  <script>
    let currentUser = null;

    const piState   = document.getElementById("piState");
    const loginBtn  = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const profileBox= document.getElementById("profileBox");
    const usernameEl= document.getElementById("username");
    const useridEl  = document.getElementById("userid");
    const avatarEl  = document.getElementById("avatar");
    const rawBox    = document.getElementById("rawBox");
    const copyUidBtn= document.getElementById("copyUidBtn");

    function setPiState() {
      const ok = !!window.Pi;
      piState.innerHTML = ok
        ? 'Pi: <span class="ok">جاهز</span>'
        : 'Pi: <span class="bad">غير موجود</span>';
    }

    setPiState();

    // init Pi (production) - safe
    function initPi() {
      if (!window.Pi) return false;
      try {
        window.Pi.init({ version: "2.0", sandbox: false });
        return true;
      } catch (e) {
        console.error("Pi.init error:", e);
        return false;
      }
    }

    loginBtn.addEventListener("click", async () => {
      try {
        if (!initPi()) {
          alert("لازم تفتح الصفحة من Pi Browser علشان Pi SDK يكون موجود.");
          return;
        }

        // permissions: username فقط
        const auth = await window.Pi.authenticate(["username"], () => {});
        if (!auth?.user?.uid || !auth?.user?.username) {
          alert("التسجيل رجع بيانات ناقصة. حاول تاني.");
          console.log("auth=", auth);
          return;
        }

        currentUser = auth.user;

        // UI
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        profileBox.style.display = "flex";
        rawBox.style.display = "block";
        copyUidBtn.style.display = "inline-block";

        usernameEl.textContent = "@" + currentUser.username;
        useridEl.textContent = "uid: " + currentUser.uid;
        avatarEl.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(currentUser.username);

        rawBox.textContent = JSON.stringify(auth, null, 2);

      } catch (e) {
        console.error(e);
        alert("فشل تسجيل الدخول. تأكد إنك فاتح من Pi Browser.");
      }
    });

    logoutBtn.addEventListener("click", () => {
      currentUser = null;

      loginBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
      profileBox.style.display = "none";
      rawBox.style.display = "none";
      copyUidBtn.style.display = "none";
    });

    copyUidBtn.addEventListener("click", async () => {
      try{
        if(!currentUser?.uid) return;
        await navigator.clipboard.writeText(String(currentUser.uid));
        alert("تم نسخ UID ✅");
      }catch(e){
        alert("مش قادر أنسخ. انسخه يدويًا من الشاشة.");
      }
    });

    // تحديث حالة Pi لو الصفحة اتفتحت في Pi Browser بعد تحميلها
    setInterval(setPiState, 1500);
  </script>

</body>
</html>
