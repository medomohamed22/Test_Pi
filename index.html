<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق إكس برو - Pi Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --primary: #002f34; --accent: #3a77ff; --pi: #ffda00; --bg: #f2f4f5; --surface: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--primary); padding-bottom: 60px; }
        header { background: var(--surface); padding: 12px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }
        .btn-pi { background: var(--pi); color: #674818; border: none; padding: 10px 18px; border-radius: 50px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        .search-section { margin: 25px 0; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .search-bar { display: flex; gap: 10px; width: 100%; max-width: 800px; }
        .search-input { flex: 1; padding: 12px 20px; border-radius: 50px; border: 1px solid #ddd; }
        .loc-select { padding: 10px; border-radius: 50px; border: 1px solid #ddd; background: white; }

        .categories-bar { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 10px 0; scrollbar-width: none; }
        .cat-pill { background: white; padding: 8px 18px; border-radius: 20px; border: 1px solid #ddd; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .cat-pill.active { background: var(--primary); color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .fav-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.8); border: none; width: 35px; height: 35px; border-radius: 50%; color: #ff4757; cursor: pointer; z-index: 5; }
        .card-body { padding: 15px; }
        .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: #777; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }

        .fab { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: var(--accent); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 99; cursor: pointer; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:15px;">جاري تحميل سوق إكس برو...</p></div>

<header>
    <div class="container nav">
        <a href="#" class="logo" onclick="location.reload()">سوق <span>إكس</span></a>
        <div id="authContainer">
            <button class="btn-pi" onclick="app.loginWithPi()"><i class="fab fa-pi"></i> دخول بـ Pi</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="عن ماذا تبحث؟" onkeyup="app.fetchAds()">
            <select id="locFilter" class="loc-select" onchange="app.fetchAds()">
                <option value="all">كل المحافظات</option>
                <option value="القاهرة">القاهرة</option>
                <option value="الإسكندرية">الإسكندرية</option>
                <option value="الجيزة">الجيزة</option>
            </select>
        </div>
        <div class="categories-bar">
            <div class="cat-pill active" onclick="app.filterCat('all', this)">الكل</div>
            <div class="cat-pill" onclick="app.filterCat('cars', this)">سيارات</div>
            <div class="cat-pill" onclick="app.filterCat('electronics', this)">إلكترونيات</div>
            <div class="cat-pill" onclick="app.filterCat('properties', this)">عقارات</div>
            <div class="cat-pill" onclick="app.filterCat('furniture', this)">أثاث</div>
            <div class="cat-pill" onclick="app.filterCat('fav', this)"><i class="fas fa-heart"></i> المفضلة</div>
        </div>
    </div>
    <div class="grid" id="productGrid"></div>
</div>

<button class="fab" onclick="app.checkAuth()"><i class="fas fa-plus"></i></button>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>إضافة إعلان جديد</h3>
        <form id="addForm" style="margin-top:15px;">
            <div class="form-group"><label>عنوان الإعلان</label><input type="text" id="pName" required></div>
            <div class="form-group"><label>السعر (ج.م)</label><input type="number" id="pPrice" required></div>
            <div class="form-group">
                <label>القسم</label>
                <select id="pCat">
                    <option value="cars">سيارات</option>
                    <option value="electronics">إلكترونيات</option>
                    <option value="properties">عقارات</option>
                    <option value="furniture">أثاث</option>
                </select>
            </div>
            <div class="form-group">
                <label>الموقع (المحافظة)</label>
                <select id="pLoc">
                    <option value="القاهرة">القاهرة</option>
                    <option value="الإسكندرية">الإسكندرية</option>
                    <option value="الجيزة">الجيزة</option>
                </select>
            </div>
            <div class="form-group"><label>رقم التواصل</label><input type="tel" id="pPhone" required></div>
            <div class="form-group"><label>الوصف</label><textarea id="pDesc" rows="3" required></textarea></div>
            <div class="form-group"><label>الصورة</label><input type="file" id="pImage" accept="image/*" required></div>
            <button type="submit" class="btn-pi" style="width:100%; justify-content:center; background:var(--accent); color:white;" id="submitBtn">نشر الآن</button>
            <button type="button" onclick="toggleModal('addModal', false)" style="width:100%; border:none; background:none; margin-top:10px; cursor:pointer; color:#777;">إلغاء</button>
        </form>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content" id="detailContent"></div>
</div>

<script>
    const SB_URL = 'https://xncapmzlwuisupkjlftb.supabase.co';
    const SB_KEY = 'sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS'; 
    const client = supabase.createClient(SB_URL, SB_KEY);
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: false });

    const app = {
        currentUser: null,
        currentCat: 'all',
        userFavs: [],

        async init() {
            await this.fetchAds();
            document.getElementById('loader').style.display = 'none';
        },

        async loginWithPi() {
            try {
                const auth = await Pi.authenticate(['username'], (pay) => {});
                this.currentUser = auth.user;
                await this.loadFavs();
                this.updateUI();
            } catch (e) { alert("خطأ في تسجيل دخول Pi"); }
        },

        async loadFavs() {
            if (!this.currentUser) return;
            const { data } = await client.from('favorites').select('ad_id').eq('user_id', this.currentUser.username);
            this.userFavs = data.map(f => f.ad_id);
        },

        updateUI() {
            if(this.currentUser) {
                document.getElementById('authContainer').innerHTML = `<div class="user-profile"><span>${this.currentUser.username}</span> <i class="fas fa-check-circle" style="color:var(--accent)"></i></div>`;
            }
        },

        filterCat(cat, el) {
            this.currentCat = cat;
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            this.fetchAds();
        },

        async fetchAds() {
            const search = document.getElementById('searchInput').value;
            const loc = document.getElementById('locFilter').value;
            
            let query = client.from('ads').select('*').order('updated_at', { ascending: false });
            
            if (this.currentCat === 'fav') {
                if (!this.currentUser) { alert("سجل دخولك لرؤية المفضلة"); return; }
                query = query.in('id', this.userFavs);
            } else if (this.currentCat !== 'all') {
                query = query.eq('category', this.currentCat);
            }

            if (loc !== 'all') query = query.eq('location', loc);
            if (search) query = query.ilike('name', `%${search}%`);

            const { data, error } = await query;
            if (!error) this.render(data);
        },

        render(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.length ? '' : '<p style="grid-column:1/-1; text-align:center; padding:40px;">لا توجد نتائج</p>';
            items.forEach(item => {
                const isFav = this.userFavs.includes(item.id);
                grid.innerHTML += `
                    <div class="card">
                        <button class="fav-btn" onclick="app.toggleFav(${item.id}, event)">
                            <i class="${isFav ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                        <div onclick="app.showDetails(${item.id})">
                            <img src="${item.image_url}" class="card-img">
                            <div class="card-body">
                                <div class="card-price">${item.price} ج.م</div>
                                <div style="font-weight:bold; margin:5px 0;">${item.name}</div>
                                <div style="font-size:12px; color:#777;"><i class="fas fa-map-marker-alt"></i> ${item.location}</div>
                                <div class="card-meta">
                                    <span><i class="fas fa-eye"></i> ${item.views_count || 0}</span>
                                    <span><i class="fas fa-clock"></i> ${new Date(item.updated_at).toLocaleDateString('ar-EG')}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        },

        async toggleFav(id, e) {
            e.stopPropagation();
            if (!this.currentUser) return alert("سجل دخولك أولاً");
            
            if (this.userFavs.includes(id)) {
                await client.from('favorites').delete().eq('user_id', this.currentUser.username).eq('ad_id', id);
                this.userFavs = this.userFavs.filter(favId => favId !== id);
            } else {
                await client.from('favorites').insert({ user_id: this.currentUser.username, ad_id: id });
                this.userFavs.push(id);
            }
            this.fetchAds();
        },

        async showDetails(id) {
            const { data: item } = await client.from('ads').select('*').eq('id', id).single();
            // زيادة عدد المشاهدات
            await client.from('ads').update({ views_count: (item.views_count || 0) + 1 }).eq('id', id);
            
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <img src="${item.image_url}" style="width:100%; border-radius:10px;">
                <h2 style="margin:15px 0 5px;">${item.name}</h2>
                <h3 style="color:var(--accent);">${item.price} ج.م</h3>
                <p style="margin:10px 0; font-size:14px; color:#555; line-height:1.6;">${item.description}</p>
                <div style="font-size:13px; color:#777; margin-bottom:15px;">
                    <i class="fas fa-user"></i> البائع: ${item.seller_user} | <i class="fas fa-map-marker-alt"></i> ${item.location}
                </div>
                ${this.currentUser && this.currentUser.username === item.seller_user ? 
                    `<button onclick="app.bumpAd(${item.id})" class="btn-pi" style="width:100%; background:#2ed573; color:white; margin-bottom:10px;">تحديث الإعلان (Bump)</button>` : ''}
                <a href="tel:${item.phone}" class="btn-pi" style="width:100%; justify-content:center; background:var(--accent); color:white; text-decoration:none;">اتصال بالبائع</a>
                <button onclick="toggleModal('detailModal', false)" style="width:100%; border:none; background:none; margin-top:10px; cursor:pointer;">إغلاق</button>
            `;
            toggleModal('detailModal', true);
        },

        async bumpAd(id) {
            const { error } = await client.from('ads').update({ updated_at: new Date() }).eq('id', id);
            if (!error) { alert("تم رفع الإعلان للأعلى!"); location.reload(); }
        },

        checkAuth() {
            if(!this.currentUser) { alert("سجل دخولك أولاً"); this.loginWithPi(); }
            else toggleModal('addModal', true);
        }
    };

    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        try {
            const file = document.getElementById('pImage').files[0];
            const name = `${Date.now()}_${file.name}`;
            await client.storage.from('ad_images').upload(name, file);
            const { data: { publicUrl } } = client.storage.from('ad_images').getPublicUrl(name);

            await client.from('ads').insert({
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                location: document.getElementById('pLoc').value,
                description: document.getElementById('pDesc').value,
                phone: document.getElementById('pPhone').value,
                image_url: publicUrl,
                seller_user: app.currentUser.username,
                updated_at: new Date()
            });
            location.reload();
        } catch (err) { alert(err.message); btn.disabled = false; }
    };

    function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
    app.init();
</script>
</body>
</html>
