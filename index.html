<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio | Image Gen</title>
  <!-- خط 'Cairo' لتصميم عصري -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* لوحة الألوان - Purple & White Theme */
      --primary: #6366f1;       
      --primary-dark: #4f46e5;  
      --accent: #d946ef;        
      --bg-body: #f8fafc;       
      --surface: #ffffff;       
      --text-main: #1e293b;     
      --text-sub: #64748b;      
      --border: #e2e8f0;        
      --input-bg: #f1f5f9;      
      
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(99, 102, 241, 0.15), 0 8px 10px -6px rgba(99, 102, 241, 0.1);
      
      --radius-xl: 24px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(217, 70, 239, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid #fff;
      position: relative;
      overflow: hidden;
    }

    /* === Header === */
    .header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .brand h1 {
      margin: 0; font-size: 22px; font-weight: 800;
      background: linear-gradient(to right, var(--text-main), var(--primary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 12px; font-weight: 700; color: var(--primary);
      background: rgba(99, 102, 241, 0.1); padding: 6px 12px; border-radius: 20px;
    }

    /* === Input Section === */
    .input-group { position: relative; margin-bottom: 16px; }
    textarea {
      width: 100%; height: 120px; background: var(--input-bg);
      border: 2px solid transparent; border-radius: var(--radius-md);
      padding: 16px; font-size: 16px; color: var(--text-main);
      resize: none; outline: none; transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    textarea:focus {
      background: #fff; border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    textarea::placeholder { color: #94a3b8; }

    /* === Quick Styles Chips === */
    .chips-scroller {
      display: flex; gap: 8px; margin-bottom: 20px;
      overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .chips-scroller::-webkit-scrollbar { display: none; }
    .chip {
      background: #fff; border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 600;
      color: var(--text-sub); cursor: pointer; white-space: nowrap;
      transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .chip:hover {
      border-color: var(--primary); color: var(--primary);
      background: rgba(99, 102, 241, 0.05); transform: translateY(-2px);
    }

    /* === Action Buttons === */
    .actions { display: flex; gap: 12px; margin-bottom: 24px; }
    .btn-main {
      flex: 2; background: linear-gradient(90deg, var(--primary), var(--accent));
      color: white; border: none; padding: 14px; border-radius: var(--radius-md);
      font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-main:hover {
      transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }
    .btn-main:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-sec {
      flex: 1; background: white; border: 1px solid var(--border);
      color: var(--text-sub); border-radius: var(--radius-md); font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn-sec:hover { background: var(--input-bg); color: var(--text-main); }

    /* === Image Viewer & Aurora Effect === */
    .display-area {
      position: relative; width: 100%; min-height: 380px;
      background: #f1f5f9; /* تغيير الخلفية لفاتح لتتناسب مع ألوان ChatGPT */
      border-radius: var(--radius-xl); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid #fff; box-shadow: 0 0 0 1px var(--border);
    }

    .display-area img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      display: none; animation: zoomIn 0.5s ease; z-index: 10;
    }

    /* The Placeholder */
    .empty-state {
      color: #94a3b8; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .empty-state svg { width: 60px; height: 60px; opacity: 0.5; }

    /* === NEW: ChatGPT Aurora Effect === */
    .aurora-loader {
      position: absolute; inset: 0;
      background: #ffffff; /* خلفية بيضاء لضمان دمج الألوان */
      display: none; /* مخفي افتراضياً */
      z-index: 5;
      overflow: hidden;
    }

    /* كرات الألوان العائمة */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px); /* سر النعومة */
      opacity: 0.8;
      animation: float 8s infinite alternate ease-in-out;
    }

    /* ألوان الباستيل الناعمة (مثل صورة ChatGPT) */
    .blob-1 {
      width: 120%; height: 120%; top: -20%; left: -20%;
      background: #ffe3e0; /* وردي فاتح */
    }
    .blob-2 {
      width: 90%; height: 90%; bottom: -10%; right: -20%;
      background: #eedbff; /* بنفسجي فاتح */
      animation-delay: -2s;
    }
    .blob-3 {
      width: 80%; height: 80%; top: 30%; right: 20%;
      background: #fff5db; /* كريمي/أصفر فاتح */
      animation-delay: -4s;
    }

    .loading-status {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 6; font-size: 15px; font-weight: 700;
      color: #475569; letter-spacing: 0.5px;
      animation: pulseText 2s infinite ease-in-out;
    }

    /* === Footer / Download === */
    .download-bar {
      margin-top: 16px; display: none; animation: slideUp 0.3s ease;
    }
    .btn-download {
      width: 100%; padding: 12px; background: var(--text-main);
      color: white; border: none; border-radius: var(--radius-md);
      font-weight: 700; cursor: pointer; display: flex; justify-content: center;
      gap: 10px; transition: 0.2s;
    }
    .btn-download:hover { background: #000; }

    /* === Animations === */
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes pulseText { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* === Toast === */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--text-main); color: white; padding: 10px 24px;
      border-radius: 50px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none; z-index: 999;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 20px; border-radius: 20px; }
      .display-area { min-height: 300px; }
      .actions { flex-direction: column; }
      .btn-main, .btn-sec { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo-icon">AI</div>
      <div>
        <h1>Imagine AI</h1>
      </div>
    </div>
    <div class="badge">V2.0 PRO</div>
  </div>

  <!-- Input Area -->
  <div class="input-group">
    <textarea id="prompt" placeholder="اطلق العنان لخيالك.. مثلاً: قطة رائد فضاء تجلس على سطح القمر، إضاءة سينمائية، جودة 4k"></textarea>
  </div>

  <!-- Quick Styles (Horizontal Scroll) -->
  <div class="chips-scroller">
    <div class="chip" onclick="addTag('Realistic, 8k')">📸 واقعي</div>
    <div class="chip" onclick="addTag('Cyberpunk, Neon')">🤖 سايبر بانك</div>
    <div class="chip" onclick="addTag('Anime, Studio Ghibli')">🌸 أنيمي</div>
    <div class="chip" onclick="addTag('3D Render, Unreal Engine')">🧊 ثلاثي الأبعاد</div>
    <div class="chip" onclick="addTag('Oil Painting')">🎨 رسم زيتي</div>
    <div class="chip" onclick="addTag('Cinematic Lighting')">🎬 سينمائي</div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button id="generateBtn" class="btn-main" onclick="generateImage()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path></svg>
      <span id="btnText">توليد الصورة</span>
    </button>
    <button class="btn-sec" onclick="fillRandom()">🎲 مثال</button>
  </div>

  <!-- Image Display & Aurora Effect -->
  <div class="display-area" id="displayArea">
    
    <!-- ✅ تأثير الـ Aurora الجديد (ChatGPT Style) -->
    <div class="aurora-loader" id="auroraLoader">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="loading-status" id="loadingText">جاري تهيئة الإبداع...</div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <span>الصورة ستظهر هنا</span>
    </div>

    <!-- The Image -->
    <img id="resultImage" src="" alt="AI Art">
  </div>

  <!-- Download Section -->
  <div class="download-bar" id="downloadBar">
    <button class="btn-download" onclick="downloadImg()">
      ⬇️ تحميل الصورة بجودة عالية
    </button>
  </div>

</div>

<!-- Simple Toast Notification -->
<div class="toast" id="toast">رسالة تنبيه</div>

<script>
  // --- النصوص المتغيرة أثناء التحميل ---
  const loadingMessages = [
    "🚀 الاتصال بالسيرفر...",
    "🧠 الذكاء الاصطناعي يفكر...",
    "🎨 يتم الآن دمج الألوان...",
    "💡 ضبط الإضاءة والظلال...",
    "✨ وضع اللمسات السحرية..."
  ];
  let msgInterval;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    t.style.animation = 'slideUp 0.3s ease';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function addTag(tag) {
    const input = document.getElementById('prompt');
    if (input.value.includes(tag)) return;
    input.value = input.value ? input.value + ", " + tag : tag;
    showToast(`تم إضافة: ${tag}`);
  }

  function fillRandom() {
    const prompts = [
      "A futuristic sleek sports car on a rainy neon street, cyberpunk, 8k, realistic",
      "Portrait of an ancient Egyptian queen, gold jewelry, cinematic lighting, hyper realistic",
      "Tiny cute isometric house in a glass jar, magical forest background, 3d render",
      "Astronaut riding a horse on Mars, epic composition, dust particles, dramatic light"
    ];
    document.getElementById('prompt').value = prompts[Math.floor(Math.random() * prompts.length)];
    showToast("تم اختيار مثال عشوائي 🎲");
  }

  // --- تشغيل الأنيميشن (تعديل ليدعم الـ Aurora) ---
  function startLoading() {
    const loader = document.getElementById('auroraLoader'); // الجديد
    const txt = document.getElementById('loadingText');
    const btn = document.getElementById('generateBtn');
    const empty = document.getElementById('emptyState');
    const img = document.getElementById('resultImage');
    const dl = document.getElementById('downloadBar');

    loader.style.display = 'block'; // إظهار أنيميشن الـ Aurora
    empty.style.display = 'none';
    img.style.display = 'none';
    dl.style.display = 'none';
    
    btn.disabled = true;
    btn.style.opacity = '0.7';
    document.getElementById('btnText').textContent = "جاري التوليد...";

    let i = 0;
    txt.textContent = loadingMessages[0];
    msgInterval = setInterval(() => {
      i = (i + 1) % loadingMessages.length;
      txt.textContent = loadingMessages[i];
    }, 1500);
  }

  function stopLoading(success) {
    clearInterval(msgInterval);
    const loader = document.getElementById('auroraLoader');
    const btn = document.getElementById('generateBtn');
    
    loader.style.display = 'none'; // إخفاء الأنيميشن
    btn.disabled = false;
    btn.style.opacity = '1';
    document.getElementById('btnText').textContent = "توليد مرة أخرى";

    if (!success) {
      document.getElementById('emptyState').style.display = 'flex';
    }
  }

  // --- دالة التوليد الرئيسية ---
  async function generateImage() {
    const promptVal = document.getElementById('prompt').value.trim();
    if (!promptVal) {
      showToast("⚠️ الرجاء كتابة وصف للصورة أولاً!");
      return;
    }

    startLoading();

    try {
      // محاكاة الاتصال بالسيرفر
      const response = await fetch('/.netlify/functions/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: promptVal })
      });

      let data = {};
      try { data = await response.json(); } catch(e){}

      if (!response.ok) throw new Error(data.error || "خطأ في السيرفر");
      if (!data.dataUrl) throw new Error("لم يتم إرجاع صورة");

      // عرض الصورة عند التحميل الناجح
      const img = document.getElementById('resultImage');
      img.onload = () => {
        stopLoading(true);
        img.style.display = 'block';
        document.getElementById('downloadBar').style.display = 'block';
        showToast("تم التوليد بنجاح! 🎉");
      };
      img.src = data.dataUrl;

    } catch (err) {
      console.error(err);
      stopLoading(false);
      showToast("❌ حدث خطأ: " + (err.message || "فشل الاتصال"));
    }
  }

  function downloadImg() {
    const img = document.getElementById('resultImage');
    if (!img.src) return;
    const a = document.createElement('a');
    a.href = img.src;
    a.download = `AI-Gen-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("جاري التحميل... ⬇️");
  }
</script>

</body>
</html>
