<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>سوق باي | Pi Market</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #7C3AED;
  --primary-dark: #5B21B6;
  --accent: #F59E0B;
  --bg-body: #F3F4F6;
  --surface: #FFFFFF;
  --text-main: #111827;
  --text-muted: #6B7280;
  --danger: #EF4444;
  --border: #E5E7EB;
  --nav-height: 70px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  padding-bottom: calc(var(--nav-height) + 20px);
  overflow-y: auto;
  user-select: none;
}

/* --- Utilities --- */
.container { width: min(100%, 800px); margin: 0 auto; padding: 16px; }
.hidden { display: none !important; }
.btn {
  border: none; cursor: pointer; border-radius: 14px;
  padding: 10px 16px; font-weight: 700; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.1s ease; font-size: 14px;
}
.btn:active { transform: scale(0.95); }
.btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2); }
.btn-gold { background: linear-gradient(135deg, var(--accent), #FBBF24); color: white; }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

/* --- Header --- */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  height: 60px;
}
.brand { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }

/* User Profile in Header */
.header-user {
  display: flex; align-items: center; gap: 10px;
  background: #f9fafb; padding: 4px 12px 4px 4px;
  border-radius: 99px; border: 1px solid var(--border);
}
.header-avatar {
  width: 32px; height: 32px; background: var(--primary); color: white;
  border-radius: 50%; display: grid; place-items: center; font-size: 14px;
}
.header-name { font-size: 13px; font-weight: 700; color: var(--text-main); }

/* --- Bottom Navigation (Animated) --- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: white;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 1000;
  padding-bottom: 10px;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
}

.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--text-muted); font-size: 11px; font-weight: 600;
  background: none; border: none; cursor: pointer; padding: 8px; width: 60px;
  position: relative;
  transition: color 0.3s;
}

.nav-item i {
  font-size: 22px;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.nav-item.active { color: var(--primary); }
.nav-item.active i { transform: translateY(-5px) scale(1.1); }
.nav-item.active::after {
  content: ''; position: absolute; bottom: 5px;
  width: 5px; height: 5px; background: var(--primary);
  border-radius: 50%;
}

/* --- Views Layout --- */
.view-section { animation: fadeScale 0.4s ease-out; }
@keyframes fadeScale {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

/* --- Product Cards --- */
.products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card {
  background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
  overflow: hidden; display: flex; flex-direction: column;
  position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}
.card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eee; }
.card-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.card-price {
  font-weight: 800; color: var(--primary); font-size: 15px;
  display: flex; align-items: center; gap: 4px;
}
.card-price span { font-size: 11px; background: #ede9fe; padding: 2px 6px; border-radius: 6px; }
.card-title { font-size: 13px; margin: 0; line-height: 1.4; font-weight: 700; height: 36px; overflow: hidden; }

/* --- Inbox List --- */
.inbox-item {
  background: white; padding: 14px; margin-bottom: 10px;
  border-radius: 16px; border: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  transition: transform 0.2s;
}
.inbox-item:active { transform: scale(0.98); background: #f9fafb; }
.inbox-avatar {
  width: 45px; height: 45px; border-radius: 50%;
  background: #f3f4f6; color: var(--primary);
  display: grid; place-items: center; font-size: 18px; font-weight: bold;
}
.inbox-info { flex: 1; overflow: hidden; }
.inbox-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.inbox-name { font-weight: 800; font-size: 14px; color: var(--text-main); }
.inbox-product { font-size: 11px; color: white; background: var(--accent); padding: 2px 6px; border-radius: 6px; }
.inbox-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- Modals --- */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 2000; display: none; align-items: flex-end; justify-content: center;
}
.sheet {
  background: white; width: 100%; max-width: 600px;
  border-radius: 24px 24px 0 0; padding: 20px;
  max-height: 90vh; overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
}
@keyframes slideUp { from {transform: translateY(100%)} to {transform: translateY(0)} }

/* --- Chat Room --- */
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
}
.chat-area {
  flex: 1; overflow-y: auto; background: #f9fafb;
  padding: 10px; border-radius: 12px; margin-bottom: 10px;
  min-height: 300px; max-height: 60vh;
}
.bubble {
  max-width: 75%; padding: 10px 14px; border-radius: 18px;
  margin-bottom: 8px; font-size: 13px; line-height: 1.4; position: relative;
}
.bubble.me {
  background: var(--primary); color: white; align-self: flex-end; margin-right: auto;
  border-bottom-right-radius: 4px;
}
.bubble.other {
  background: white; border: 1px solid var(--border); align-self: flex-start; margin-left: auto;
  border-bottom-left-radius: 4px;
}

/* --- Inputs --- */
input, textarea {
  width: 100%; padding: 14px; margin-bottom: 12px;
  border: 1px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; outline: none;
  background: #fdfdfd;
}
input:focus, textarea:focus { border-color: var(--primary); background: white; }
</style>
</head>
<body>

<header class="header">
  <div class="brand"><i class="fa-solid fa-store"></i> سوق باي</div>
  <button id="loginBtn" class="btn btn-gold">
    <i class="fa-solid fa-fingerprint"></i> دخول
  </button>
  <div id="headerUser" class="header-user hidden">
    <div id="userAvatar" class="header-avatar">?</div>
    <div id="userDispName" class="header-name">المستخدم</div>
  </div>
</header>

<div class="container">
  <div id="view-home" class="view-section">
    <h3 style="margin-top:5px;display:flex;align-items:center;gap:8px">
      <i class="fa-solid fa-fire" style="color:var(--accent)"></i> أحدث المعروضات
    </h3>
    <div id="products-list" class="products-grid"></div>
    <div id="loading" style="text-align:center;padding:20px;color:gray">جاري التحميل...</div>
  </div>

  <div id="view-chats" class="view-section hidden">
    <h3 style="margin-top:5px">الرسائل الواردة</h3>
    <div id="inbox-list">
      <div style="text-align:center;padding:40px;color:gray;font-size:14px">
        <i class="fa-regular fa-comments" style="font-size:30px;margin-bottom:10px;display:block"></i>
        يجب تسجيل الدخول لعرض رسائلك
      </div>
    </div>
  </div>

  <div id="view-profile" class="view-section hidden">
    <div id="profile-guest" style="text-align:center;padding:50px 20px;">
      <i class="fa-solid fa-user-lock" style="font-size:50px;color:#d1d5db;margin-bottom:15px"></i>
      <h3>أنت زائر</h3>
      <p style="color:gray;font-size:14px">سجل الدخول لتتمكن من إضافة إعلاناتك والتحكم بها.</p>
    </div>

    <div id="profile-user" class="hidden">
      <div style="background:white;padding:20px;border-radius:20px;text-align:center;border:1px solid var(--border)">
        <div style="width:80px;height:80px;background:var(--primary);color:white;border-radius:50%;display:grid;place-items:center;font-size:30px;margin:0 auto 10px;">
          <i class="fa-solid fa-user"></i>
        </div>
        <h3 id="p-username" style="margin:0">...</h3>
        <p id="p-uid" style="font-size:12px;color:gray;margin:5px 0 15px">ID: ...</p>
        <button class="btn btn-primary" style="width:100%" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i> إضافة إعلان جديد
        </button>
      </div>
      <h4 style="margin:20px 0 10px">إعلاناتي</h4>
      <div id="my-ads-list" class="products-grid"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="nav('home')">
    <i class="fa-solid fa-house-chimney"></i>
    <span>الرئيسية</span>
  </button>
  <button class="nav-item" onclick="nav('chats')">
    <i class="fa-solid fa-comment-dots"></i>
    <span>المحادثات</span>
  </button>
  <button class="nav-item" onclick="nav('profile')">
    <i class="fa-solid fa-user-gear"></i>
    <span>حسابي</span>
  </button>
</nav>

<div id="addModal" class="modal" onclick="if(event.target==this) closeAddModal()">
  <div class="sheet">
    <h3 style="margin-top:0">ماذا تريد أن تبيع؟</h3>
    <input id="addName" placeholder="اسم المنتج (مثال: ايفون 13)" />
    <div style="display:flex;gap:10px">
      <input id="addPrice" type="number" placeholder="السعر (Pi)" />
      <input id="addPhone" type="tel" placeholder="رقم الموبايل (اختياري)" />
    </div>
    <textarea id="addDesc" placeholder="وصف حالة المنتج..."></textarea>
    <label style="font-size:12px;font-weight:bold;margin-bottom:8px;display:block">صورة المنتج</label>
    <input id="addImg" type="file" accept="image/*" />
    <button id="publishBtn" class="btn btn-primary" style="width:100%" onclick="submitProduct()">
      نشر الإعلان
    </button>
  </div>
</div>

<div id="chatModal" class="modal" style="z-index:2100" onclick="if(event.target==this) closeChat()">
  <div class="sheet" style="height:92vh;">
    <div class="chat-header">
      <div>
        <div id="chatTitle" style="font-weight:800;font-size:15px">اسم المنتج</div>
        <div id="chatPeer" style="font-size:12px;color:gray">...</div>
      </div>
      <button onclick="closeChat()" style="background:none;border:none;font-size:18px"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="msgContainer" class="chat-area" style="display:flex;flex-direction:column;"></div>
    <div style="display:flex;gap:8px;margin-top:auto">
      <input id="msgInput" placeholder="اكتب رسالة..." style="margin:0;border-radius:25px" />
      <button class="btn btn-primary" style="border-radius:50%;width:48px;height:48px;padding:0" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
// --- CONFIG ---
const SUPABASE_URL = "https://xncapmzlwuisupkjlftb.supabase.co";
const SUPABASE_KEY = "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS"; 

let sb, user = null;
let activeChat = null; // { pid, otherId }

// --- INIT ---
document.addEventListener("DOMContentLoaded", async () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  initPi();
  loadAllProducts();
});

// --- NAVIGATION LOGIC ---
function nav(viewName) {
  document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  const view = document.getElementById(`view-${viewName}`);
  view.classList.remove('hidden');
  view.style.animation = 'none';
  view.offsetHeight; 
  view.style.animation = 'fadeScale 0.4s ease-out';

  const iconIndex = viewName === 'home' ? 0 : viewName === 'chats' ? 1 : 2;
  document.querySelectorAll('.nav-item')[iconIndex].classList.add('active');

  if(viewName === 'profile' && user) loadMyAds();
  if(viewName === 'chats' && user) loadInbox();
}

// --- PI LOGIN & USER DISPLAY ---
function initPi(){
  const btn = document.getElementById("loginBtn");
  
  if(!window.Pi){
    // Mock Login if not inside Pi Browser
    btn.onclick = () => handleLogin("test_" + Math.floor(Math.random()*1000), "زائر_تجريبي");
    return;
  }

  // ✅ SANDBOX IS FALSE (Production)
  Pi.init({ version: "2.0", sandbox: false });
  
  btn.onclick = async () => {
    try {
      const auth = await Pi.authenticate(["username"], () => {});
      handleLogin(auth.user.uid, auth.user.username);
    } catch(e) { alert("خطأ في الدخول: " + e) }
  };
}

async function handleLogin(uid, username) {
  user = { uid, username };
  // ✅ تخزين اسم المستخدم في قاعدة البيانات عند الدخول
  await sb.from("users").upsert({ pi_id: uid, username: username });
  
  document.getElementById("loginBtn").classList.add("hidden");
  document.getElementById("headerUser").classList.remove("hidden");
  document.getElementById("userDispName").innerText = username;
  document.getElementById("userAvatar").innerText = username.charAt(0).toUpperCase();

  document.getElementById("profile-guest").classList.add("hidden");
  document.getElementById("profile-user").classList.remove("hidden");
  document.getElementById("p-username").innerText = username;
  document.getElementById("p-uid").innerText = "UID: " + uid.slice(0,6) + "...";
  
  sb.channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
       if(payload.new.receiver_pi_id === user.uid) {
         const chatIcon = document.querySelectorAll('.nav-item')[1].querySelector('i');
         chatIcon.style.color = '#EF4444';
       }
    }).subscribe();
}

// --- PRODUCTS (Home) ---
async function loadAllProducts() {
  const { data } = await sb.from("products").select("*").order("created_at", {ascending:false});
  document.getElementById("loading").style.display = "none";
  const list = document.getElementById("products-list");
  list.innerHTML = "";

  if(!data || !data.length) {
    list.innerHTML = "<div style='grid-column:1/-1;text-align:center'>لا توجد إعلانات</div>";
    return;
  }

  data.forEach(p => {
    const isOwner = user && p.seller_pi_id === user.uid;
    const img = p.image_url || "https://placehold.co/400?text=No+Image";
    
    let btnHtml = "";
    if(!isOwner) {
       // نمرر اسم البائع من بيانات المنتج
       btnHtml = `<button onclick="openChatRoom(${p.id}, '${p.seller_pi_id}', '${p.name}', '${p.seller_username}')" class="btn btn-primary" style="width:100%;font-size:12px;padding:6px">مراسلة البائع</button>`;
    } else {
       btnHtml = `<div style="text-align:center;font-size:11px;color:gray;padding:6px">إعلانك</div>`;
    }

    const html = `
      <div class="card">
        <img src="${img}" class="card-img" loading="lazy">
        <div class="card-body">
          <div class="card-price">${p.price} <span>Pi</span></div>
          <h4 class="card-title">${p.name}</h4>
          ${btnHtml}
        </div>
      </div>
    `;
    list.innerHTML += html;
  });
}

// --- INBOX SYSTEM (Modified for Real Usernames) ---
async function loadInbox() {
  const list = document.getElementById("inbox-list");
  list.innerHTML = "<div style='text-align:center;padding:20px'>جاري تحديث المحادثات...</div>";

  const { data } = await sb.from("messages")
    .select("*, products(name, seller_pi_id, seller_username)")
    .or(`sender_pi_id.eq.${user.uid},receiver_pi_id.eq.${user.uid}`)
    .order("created_at", {ascending: false});

  list.innerHTML = "";
  if(!data || !data.length) {
    list.innerHTML = "<div style='text-align:center;padding:40px;color:gray'>لا توجد محادثات نشطة</div>";
    return;
  }

  // 1. تجميع المحادثات وتحديد هوية الطرف الآخر
  const threads = new Map();
  const otherUserIds = new Set(); // لتخزين IDs الأشخاص الذين نحتاج معرفة أسمائهم

  data.forEach(m => {
    const isMeSender = m.sender_pi_id === user.uid;
    const otherId = isMeSender ? m.receiver_pi_id : m.sender_pi_id;
    const key = `${m.product_id}_${otherId}`;

    if(!threads.has(key)) {
      otherUserIds.add(otherId); // إضافة الـ ID لقائمة البحث
      const prod = m.products || {};
      
      threads.set(key, {
        pid: m.product_id,
        otherId: otherId,
        prodName: prod.name || "منتج محذوف",
        lastMsg: m.content,
        // سنملأ الاسم لاحقاً
        peerName: "مستخدم Pi", 
        ts: new Date(m.created_at)
      });
    }
  });

  // 2. جلب أسماء المستخدمين الحقيقية من جدول users
  if(otherUserIds.size > 0){
    const { data: usersData } = await sb
      .from('users')
      .select('pi_id, username')
      .in('pi_id', Array.from(otherUserIds));
      
    if(usersData){
      // إنشاء خريطة للأسماء (ID -> Username)
      const userMap = {};
      usersData.forEach(u => userMap[u.pi_id] = u.username);
      
      // تحديث أسماء المحادثات
      threads.forEach((val, key) => {
         if(userMap[val.otherId]) {
           val.peerName = userMap[val.otherId];
         }
      });
    }
  }

  // 3. عرض المحادثات
  threads.forEach(t => {
    const item = `
      <div class="inbox-item" onclick="openChatRoom(${t.pid}, '${t.otherId}', '${t.prodName}', '${t.peerName}')">
        <div class="inbox-avatar">${t.peerName.charAt(0).toUpperCase()}</div>
        <div class="inbox-info">
          <div class="inbox-top">
            <span class="inbox-name">${t.peerName}</span>
            <span class="inbox-product">${t.prodName}</span>
          </div>
          <div class="inbox-msg">${t.lastMsg}</div>
        </div>
      </div>
    `;
    list.innerHTML += item;
  });
}

// --- CHAT ROOM & MESSAGING ---
function openChatRoom(pid, otherId, prodName, peerName) {
  if(!user) return alert("سجل دخول أولاً");
  
  activeChat = { pid, otherId };
  document.getElementById("chatTitle").innerText = prodName;
  document.getElementById("chatPeer").innerText = "مع: " + (peerName || "مستخدم");
  document.getElementById("chatModal").style.display = "flex";
  
  const container = document.getElementById("msgContainer");
  container.innerHTML = ""; 
  
  loadMessages();

  sb.channel(`room:${pid}:${otherId}`).on('postgres_changes', 
    { event: 'INSERT', schema: 'public', table: 'messages', filter: `product_id=eq.${pid}` }, 
    payload => {
      const m = payload.new;
      const isRel = (m.sender_pi_id == user.uid && m.receiver_pi_id == otherId) || 
                    (m.sender_pi_id == otherId && m.receiver_pi_id == user.uid);
      if(isRel) renderMsg(m);
    }
  ).subscribe();
}

async function loadMessages() {
  const { data } = await sb.from("messages")
    .select("*")
    .eq("product_id", activeChat.pid)
    .order("created_at", {ascending: true});
    
  if(data) {
    data.forEach(m => {
      const isRel = (m.sender_pi_id == user.uid && m.receiver_pi_id == activeChat.otherId) || 
                    (m.sender_pi_id == activeChat.otherId && m.receiver_pi_id == user.uid);
      if(isRel) renderMsg(m);
    });
  }
}

function renderMsg(m) {
  const container = document.getElementById("msgContainer");
  const isMe = m.sender_pi_id === user.uid;
  
  const div = document.createElement("div");
  div.className = `bubble ${isMe ? 'me' : 'other'}`;
  div.innerText = m.content;
  
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMsg() {
  const inp = document.getElementById("msgInput");
  const txt = inp.value.trim();
  if(!txt) return;

  const { error } = await sb.from("messages").insert({
    product_id: activeChat.pid,
    sender_pi_id: user.uid,
    receiver_pi_id: activeChat.otherId,
    content: txt
  });
  
  if(!error) inp.value = "";
}

function closeChat() {
  document.getElementById("chatModal").style.display = "none";
  activeChat = null;
  sb.removeAllChannels(); 
}

// --- PROFILE & ADS ---
function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

async function submitProduct() {
  const name = document.getElementById("addName").value;
  const price = document.getElementById("addPrice").value;
  const phone = document.getElementById("addPhone").value;
  const desc = document.getElementById("addDesc").value;
  const file = document.getElementById("addImg").files[0];
  const btn = document.getElementById("publishBtn");

  if(!name || !price) return alert("البيانات ناقصة!");
  
  btn.innerText = "جاري..."; btn.disabled = true;

  let image_url = null;
  if(file) {
    const path = `${user.uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
    const { error } = await sb.storage.from("images").upload(path, file);
    if(!error) {
      const { data } = sb.storage.from("images").getPublicUrl(path);
      image_url = data.publicUrl;
    }
  }

  const { error } = await sb.from("products").insert({
    name, price, phone, description: desc, image_url,
    seller_pi_id: user.uid, seller_username: user.username
  });

  if(!error) {
    alert("تم النشر!");
    closeAddModal();
    loadAllProducts();
    loadMyAds();
    document.getElementById("addName").value = "";
  } else {
    alert("خطأ: " + error.message);
  }
  btn.innerText = "نشر الإعلان"; btn.disabled = false;
}

async function loadMyAds() {
  const list = document.getElementById("my-ads-list");
  list.innerHTML = "تحميل...";
  const { data } = await sb.from("products").select("*").eq("seller_pi_id", user.uid);
  list.innerHTML = "";
  
  if(data) {
    data.forEach(p => {
       list.innerHTML += `
       <div class="card">
         <img src="${p.image_url || ''}" class="card-img">
         <div class="card-body">
           <div class="card-title">${p.name}</div>
           <button onclick="deleteProduct(${p.id})" class="btn btn-ghost" style="color:red;font-size:12px;width:100%"><i class="fa-solid fa-trash"></i> حذف</button>
         </div>
       </div>`;
    });
  }
}

async function deleteProduct(id) {
  if(confirm("حذف الإعلان؟")) {
    await sb.from("products").delete().eq("id", id);
    loadMyAds();
    loadAllProducts();
  }
}
</script>
</body>
</html>
