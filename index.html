<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pi Startups | منصة دعم المشروعات</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* --- CSS Variables & Reset --- */
    :root {
      --primary: #6f2fa0; /* Pi Purple */
      --primary-dark: #4b1e6e;
      --accent: #fbce3a; /* Pi Gold */
      --bg-body: #f8f9fe;
      --bg-card: #ffffff;
      --text-main: #2d2d2d;
      --text-muted: #6c757d;
      --border-radius: 16px;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; outline: none; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* --- Header --- */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 15px 0;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-weight: 900;
      font-size: 24px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { color: var(--text-main); font-size: 18px; font-weight: 700; }
    
    /* --- Buttons --- */
    .btn {
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(111, 47, 160, 0.3);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover { background: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* --- Hero Section --- */
    .hero {
      text-align: center;
      padding: 60px 0 40px;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--primary-dark); }
    .hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 30px; }

    /* --- User Info --- */
    #user-section {
      background: linear-gradient(135deg, #6f2fa0, #8e44ad);
      color: white;
      padding: 20px;
      border-radius: var(--border-radius);
      margin-bottom: 30px;
      display: none; /* Hidden by default */
      animation: fadeIn 0.5s ease;
    }
    .user-welcome { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .user-name { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }

    /* --- Forms --- */
    .form-card {
      background: var(--bg-card);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    .input-group { margin-bottom: 15px; }
    input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      transition: var(--transition);
      background: #fdfdfd;
    }
    input:focus, textarea:focus { border-color: var(--primary); background: #fff; }
    textarea { resize: vertical; min-height: 100px; }
    .row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .row-inputs { grid-template-columns: 1fr; } }

    /* --- Projects Grid --- */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }
    .card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(111, 47, 160, 0.2); }
    .card-body { padding: 20px; flex-grow: 1; }
    .card-tag {
      background: #f3e5f5;
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 10px;
    }
    .card h3 { margin: 5px 0; font-size: 1.2rem; }
    .card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
    
    .progress-container { margin-top: 15px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .progress-bar {
      height: 8px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 1s ease;
    }

    /* --- Toast Notification --- */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 16px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

  </style>
</head>
<body>

<header>
  <div class="container nav-content">
    <div class="logo">
      π <span>Pi Startups</span>
    </div>
    <div id="auth-btn-container">
      <button class="btn btn-primary" id="loginBtn" onclick="authenticateUser()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
        تسجيل دخول Pi
      </button>
    </div>
  </div>
</header>

<div class="container">
  
  <section class="hero">
    <h1>ادعم مشروعات المستقبل</h1>
    <p>منصة لتمويل ودعم الأفكار الناشئة باستخدام عملة Pi. شارك فكرتك أو ادعم الآخرين.</p>
  </section>

  <div id="user-section">
    <div class="user-welcome">
      <div class="user-name">
        👋 أهلاً، <span id="display-username">Loading...</span>
      </div>
      <button class="btn btn-outline" style="border-color:white; color:white;" onclick="toggleAddProject()">
        + إضافة مشروع جديد
      </button>
    </div>

    <div id="add-project-box" class="form-card" style="display:none; color: var(--text-main); margin-top:20px;">
      <h3 style="margin-top:0">بيانات المشروع</h3>
      <div class="row-inputs">
        <div class="input-group">
          <input type="text" id="pName" placeholder="اسم المشروع">
        </div>
        <div class="input-group">
          <input type="text" id="pCategory" placeholder="التصنيف (مثال: تقنية، تعليم)">
        </div>
      </div>
      <div class="input-group">
        <textarea id="pDesc" placeholder="وصف المشروع ورؤيتك المستقبلية..."></textarea>
      </div>
      <div class="row-inputs">
        <div class="input-group">
          <input type="number" id="pGoal" placeholder="المبلغ المطلوب (Pi)">
        </div>
        <div class="input-group">
          <input type="text" id="pOwner" placeholder="اسم المؤسس" readonly>
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="submitProject()">نشر المشروع</button>
        <button class="btn btn-outline" onclick="toggleAddProject()">إلغاء</button>
      </div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
    <h2 style="margin:0; color: var(--primary-dark);">المشروعات المميزة</h2>
    <button class="btn btn-outline" style="padding:5px 15px; font-size:12px;" onclick="fetchProjects()">تحديث</button>
  </div>
  
  <div id="projects-grid" class="grid-container">
    <div style="text-align:center; width:100%; grid-column: 1/-1; color:#999;">جاري التحميل...</div>
  </div>

  <footer style="text-align:center; margin-top:50px; padding:20px; color:#999; font-size:13px;">
    © 2026 Pi Startups - All rights reserved
  </footer>

</div>

<div id="toast">رسالة تنبيه</div>
<script>
  // 1. إعداد Supabase
  const supabase = window.supabase.createClient(
    "https://xncapmzlwuisupkjlftb.supabase.co",
    "sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS"
  );

  let currentUser = null;

  // 2. دالة التعامل مع المدفوعات غير المكتملة (إجبارية من Pi SDK)
  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment found:", payment);
    // في التطبيق الحقيقي، هنا تقوم بإرسال الدفعة للسيرفر لإكمالها
    return $.post('/payment/complete', { paymentId: payment.identifier, txid: payment.transaction.txid, app_client: 'pi_app' }); 
  };

  // 3. تهيئة Pi SDK عند تحميل الصفحة
  window.addEventListener('load', async () => {
    try {
      const Pi = window.Pi;
      if (!Pi) {
        alert("خطأ: Pi SDK لم يتم تحميله. تأكد من اتصال الإنترنت.");
        return;
      }
      
      // هام جداً:
      // sandbox: true -> للتجربة (يعمل بدون توثيق الدومين أحياناً)
      // sandbox: false -> للوضع الحقيقي (يجب أن يكون الدومين مسجلاً في البوابة)
      Pi.init({ version: "2.0", sandbox: true }); 
      console.log("Pi SDK Initialized");
      
    } catch (err) {
      console.error("Initialization Error:", err);
    }
  });

  // 4. دالة تسجيل الدخول
  async function authenticateUser() {
    const loginBtn = document.getElementById("loginBtn");
    const originalText = loginBtn.innerHTML;

    try {
      // تغيير حالة الزر
      loginBtn.disabled = true;
      loginBtn.innerHTML = "جاري الاتصال بـ Pi...";

      const Pi = window.Pi;
      
      // الصلاحيات المطلوبة
      const scopes = ['username', 'payments'];

      // طلب المصادقة (أهم سطر)
      const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);

      console.log("Auth Success:", auth);

      // تخزين بيانات المستخدم
      // ملاحظة: أحياناً يأتي الكائن auth مباشرة أو auth.user حسب الإصدار
      currentUser = auth.user || auth; 

      if (!currentUser || !currentUser.username) {
        throw new Error("لم يتم العثور على اسم المستخدم.");
      }

      // نجاح الدخول
      onLoginSuccess();

      // حفظ في Supabase
      saveUserToDB(currentUser);

    } catch (err) {
      console.error("Auth Failed:", err);
      // إظهار رسالة الخطأ للمستخدم
      alert("فشل تسجيل الدخول: " + (err.message || err));
      
      // إعادة الزر لحالته الأصلية
      loginBtn.disabled = false;
      loginBtn.innerHTML = originalText;
    }
  }

  // 5. واجهة المستخدم بعد النجاح
  function onLoginSuccess() {
    document.getElementById("auth-btn-container").style.display = "none";
    const userSection = document.getElementById("user-section");
    userSection.style.display = "block";
    userSection.classList.add("fade-in"); // إضافة تأثير
    
    document.getElementById("display-username").textContent = currentUser.username;
    document.getElementById("pOwner").value = currentUser.username;
    
    showToast(`تم تسجيل الدخول بنجاح! أهلاً ${currentUser.username}`);
  }

  // 6. حفظ المستخدم في قاعدة البيانات
  async function saveUserToDB(user) {
    const { error } = await supabase
      .from("pi_users")
      .upsert({ pi_uid: user.uid, username: user.username }, { onConflict: 'pi_uid' });
      
    if(error) console.warn("Supabase Log:", error.message);
  }

  /* --- وظائف المشروعات (نفس السابق مع تحسينات بسيطة) --- */
  
  async function submitProject() {
    if (!currentUser) return showToast("يجب تسجيل الدخول أولاً!");

    const name = document.getElementById("pName").value.trim();
    const category = document.getElementById("pCategory").value.trim();
    const desc = document.getElementById("pDesc").value.trim();
    const goal = document.getElementById("pGoal").value;

    if (!name || !desc || !goal) return showToast("أكمل جميع البيانات المطلوبة");

    const btn = event.target;
    const oldText = btn.textContent;
    btn.textContent = "جاري النشر...";
    btn.disabled = true;

    const payload = {
      owner_pi_uid: currentUser.uid,
      owner_username: currentUser.username,
      name, category, description: desc,
      goal_pi: Number(goal), raised_pi: 0
    };

    const { error } = await supabase.from("projects").insert(payload);

    if (error) {
      alert("خطأ قاعدة البيانات: " + error.message);
    } else {
      showToast("تم نشر المشروع! 🚀");
      toggleAddProject();
      document.getElementById("pName").value = "";
      document.getElementById("pDesc").value = "";
      document.getElementById("pGoal").value = "";
      fetchProjects();
    }
    btn.textContent = oldText;
    btn.disabled = false;
  }

  async function fetchProjects() {
    const grid = document.getElementById("projects-grid");
    grid.innerHTML = '<div style="text-align:center;width:100%">جاري التحميل...</div>';
    
    const { data, error } = await supabase
      .from("projects")
      .select("*")
      .order("created_at", { ascending: false });

    if (error || !data) {
      grid.innerHTML = '<div style="text-align:center">لا توجد مشروعات أو حدث خطأ.</div>';
      return;
    }

    grid.innerHTML = "";
    if(data.length === 0) {
       grid.innerHTML = '<div style="text-align:center; color:#777">كن أول من يضيف مشروعاً!</div>';
       return;
    }

    data.forEach(p => {
      const pct = Math.min(100, Math.round(((p.raised_pi||0) / (p.goal_pi||1)) * 100));
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="card-body">
          <span class="card-tag">${escapeHtml(p.category)}</span>
          <h3>${escapeHtml(p.name)}</h3>
          <p>${escapeHtml(p.description)}</p>
          <div class="progress-container">
            <div class="progress-labels">
              <span>${p.raised_pi||0} π</span><span>${p.goal_pi} π</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>
          <small style="color:#999; display:block; margin-top:10px">المالك: ${escapeHtml(p.owner_username)}</small>
        </div>`;
      grid.appendChild(div);
    });
  }

  // Helpers
  function toggleAddProject() {
    const b = document.getElementById("add-project-box");
    b.style.display = b.style.display==="none"?"block":"none";
  }
  function showToast(m) {
    const t = document.getElementById("toast");
    t.textContent = m; t.className = "show";
    setTimeout(()=>t.className="", 3000);
  }
  function escapeHtml(t) { return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // Init
  fetchProjects();
</script>


</body>
</html>
