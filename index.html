<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pi Dev Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
:root{
  --p:#7B2FF7;--p2:#9B6DFF;--bg:#F4F0FF;--card:#fff;
  --text:#1F1F2E;--mut:#6B6B85;--border:#E6E0FF;
}
*{box-sizing:border-box;font-family:Tajawal,system-ui}
body{margin:0;background:var(--bg);color:var(--text)}
header{
  position:sticky;top:0;z-index:9;
  background:#fff;border-bottom:1px solid var(--border);
  padding:12px 14px;display:flex;gap:10px;align-items:center
}
header h1{margin:0;font-size:18px;color:var(--p)}
header input{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border)}
header button{padding:10px 14px;border-radius:12px;border:none;background:var(--p);color:#fff}

main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{
  background:var(--card);border-radius:16px;padding:14px;
  box-shadow:0 8px 24px rgba(123,47,247,.12)
}
.card h3{margin:0 0 8px;color:var(--p)}
.mut{color:var(--mut);font-size:13px}

nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px
}
nav button{background:none;border:none;color:var(--mut)}
nav button.active{color:var(--p);font-weight:700}

.hidden{display:none}
</style>
</head>

<body>
<header>
  <h1>Pi Dev Hub</h1>
  <input id="search" placeholder="بحث..." />
  <button id="loginBtn">تسجيل دخول Pi</button>
</header>

<main>
  <section id="home" class="grid"></section>
  <section id="projects" class="grid hidden"></section>
  <section id="profile" class="hidden"></section>
</main>

<nav>
  <button onclick="show('home')" class="active">الرئيسية</button>
  <button onclick="show('projects')">المشاريع</button>
  <button onclick="show('profile')">حسابي</button>
</nav>

<script>
const SUPABASE_URL="https://xncapmzlwuisupkjlftb.supabase.co";
const SUPABASE_ANON="sb_publishable_zPECXAiI_bDbeLtRYe3vIw_IEt_p_AS";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

let session=null, piUser=null;

async function init(){
  await sb.auth.signInAnonymously();
  const {data}=await sb.from('posts').select('*').order('created_at',{ascending:false});
  renderPosts(data||[]);
}
init();

function renderPosts(list){
  const c=document.getElementById('home');
  c.innerHTML=list.map(p=>`
    <div class="card">
      <h3>${p.title}</h3>
      <div class="mut">${p.pi_username||''}</div>
      <p>${p.content}</p>
    </div>
  `).join('');
}

document.getElementById('loginBtn').onclick=async()=>{
  Pi.init({version:"2.0",sandbox:false});
  const auth=await Pi.authenticate(['username'],()=>{});
  piUser=auth.user;
  session=await sb.auth.getSession();
  await fetch('/api/pi/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      pi_uid:piUser.uid,
      pi_username:piUser.username,
      supabase_access_token:session.data.session.access_token
    })
  });
  alert('تم تسجيل الدخول');
};

function show(id){
  document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}
</script>
</body>
</html>
