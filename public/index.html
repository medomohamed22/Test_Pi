<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ULTRA AI — يتعلم من الإنترنت</title>
<style>
:root{
  --p:#7B2FF7; --p2:#9B6DFF;
  --bg:#0b0e1c; --card:#151936; --stroke:#24294a;
  --text:#fff; --mut:#a7aed8;
  --r:18px;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Tajawal",Segoe UI}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(180deg,#0b0e1c,#070914);
  color:var(--text);
  display:flex; justify-content:center;
}
.app{width:100%;max-width:520px;min-height:100vh;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:5;
  background:rgba(17,20,51,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--stroke);
  padding:12px 12px 10px;
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{
  width:40px;height:40px;border-radius:14px;
  background:radial-gradient(circle at 30% 30%, var(--p2), var(--p));
  display:flex;align-items:center;justify-content:center;font-weight:900
}
.hd{display:flex;flex-direction:column;gap:2px}
.hd b{font-size:14px}
.hd span{font-size:12px;color:var(--mut)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  border:1px solid var(--stroke);
  background:#111433;
  color:#fff;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  cursor:pointer;
}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));border:none}
.btn.danger{background:#2a0f18;border:1px solid #4a1b2a}
.main{flex:1;display:flex;flex-direction:column}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{
  max-width:88%;
  padding:10px 12px;border-radius:16px;
  border:1px solid var(--stroke);
  background:rgba(21,25,54,.9);
  line-height:1.55;
  white-space:pre-wrap;
}
.msg.user{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(123,47,247,.95),rgba(155,109,255,.92));
  border:none;
}
.msg.ai{align-self:flex-end}
.meta{font-size:11px;color:var(--mut);margin-top:6px}
.composer{
  border-top:1px solid var(--stroke);
  background:#0f122a;
  padding:10px;
  display:grid;
  gap:8px;
}
.row{display:flex;gap:8px}
input,textarea{
  width:100%;
  padding:11px 12px;
  border-radius:14px;
  border:1px solid var(--stroke);
  background:#10143a;
  color:#fff;
  outline:none;
}
textarea{min-height:64px;resize:none}
.pill{
  font-size:12px;color:var(--mut);
  display:flex;gap:8px;flex-wrap:wrap
}
.pill code{background:#111433;border:1px solid var(--stroke);padding:2px 8px;border-radius:999px;color:#d7dbff}
.small{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div style="display:flex;gap:10px;align-items:center">
        <div class="logo">AI</div>
        <div class="hd">
          <b>ULTRA AI</b>
          <span>يتعلم من الإنترنت + يخزن معرفة على Netlify Blobs</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnStats">📊 العقل</button>
        <button class="btn danger" id="btnClear">🧹 مسح التعلم</button>
        <button class="btn primary" id="btnLearn">🌐 تعلم من رابط</button>
      </div>
    </div>
    <div class="pill">
      <span>Endpoints:</span>
      <code>/.netlify/functions/learn</code>
      <code>/.netlify/functions/ask</code>
    </div>
  </div>

  <div class="main">
    <div class="chat" id="chat"></div>

    <div class="composer">
      <div class="row">
        <textarea id="q" placeholder="اسأل… مثال: ما هو Web3؟ أو اشرح Pi Network باختصار"></textarea>
      </div>
      <div class="row">
        <button class="btn primary" id="send" style="flex:1">إرسال السؤال</button>
      </div>
      <div class="small">ملاحظة: أول ما تسأل، النظام ممكن يعمل “تعلم تلقائي” من الإنترنت ويحفظه.</div>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const qEl  = document.getElementById('q');

function addMsg(text, who="ai", meta=""){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (who === "user" ? "user" : "ai");
  wrap.textContent = text;
  if(meta){
    const m = document.createElement('div');
    m.className='meta';
    m.textContent = meta;
    wrap.appendChild(m);
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

async function postJSON(url, body){
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body || {})
  });
  return await r.json();
}

async function ask(){
  const q = (qEl.value || "").trim();
  if(!q) return;
  addMsg(q, "user");
  qEl.value = "";

  addMsg("⏳ بفكر وببحث وبسترجع اللي اتعلمته…", "ai");

  try{
    const out = await postJSON("/.netlify/functions/ask", { q });
    // امسح رسالة التحميل
    chat.lastChild.remove();

    if(!out?.ok){
      addMsg("❌ حصل خطأ: " + (out?.error || "Unknown"), "ai");
      return;
    }

    addMsg(out.answer || "مفيش إجابة حالياً", "ai", out.meta || "");

  }catch(e){
    chat.lastChild.remove();
    addMsg("❌ فشل الاتصال بالسيرفر: " + e.message, "ai");
  }
}

async function learn(){
  const url = prompt("حط رابط الصفحة اللي عايزني اتعلم منها:");
  if(!url) return;
  addMsg("🌐 بتعلم من: " + url, "user");
  addMsg("⏳ بجمع محتوى الصفحة وبخزنه…", "ai");
  try{
    const out = await postJSON("/.netlify/functions/learn", { url });
    chat.lastChild.remove();
    if(!out?.ok){
      addMsg("❌ تعلم فشل: " + (out?.error || "Unknown"), "ai");
      return;
    }
    addMsg("✅ اتعلمت من الصفحة.\n- كلمات محفوظة تقريباً: " + out.tokensApprox +
           "\n- مصدر: " + out.source, "ai");
  }catch(e){
    chat.lastChild.remove();
    addMsg("❌ فشل الاتصال: " + e.message, "ai");
  }
}

async function stats(){
  try{
    const out = await postJSON("/.netlify/functions/stats", {});
    if(!out?.ok) return alert(out?.error || "error");
    alert("🧠 حجم المعرفة:\n" +
      "- مصادر: " + out.docs +
      "\n- حجم تقريبي: " + out.bytesApprox + " bytes"
    );
  }catch(e){
    alert(e.message);
  }
}

async function clearAll(){
  if(!confirm("أكيد تمسح كل اللي اتعلمه؟")) return;
  try{
    const out = await postJSON("/.netlify/functions/clear", {});
    if(!out?.ok) return alert(out?.error || "error");
    alert("تم المسح ✅");
  }catch(e){
    alert(e.message);
  }
}

document.getElementById('send').onclick = ask;
document.getElementById('btnLearn').onclick = learn;
document.getElementById('btnStats').onclick = stats;
document.getElementById('btnClear').onclick = clearAll;

addMsg("أهلاً 👋\n1) اسأل سؤال.\n2) أو علّمني من رابط.\nالنظام هيحفظ المعرفة على Netlify Blobs ويتطور مع الوقت.", "ai");
</script>
</body>
</html>
